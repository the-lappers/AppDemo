<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day-Off Chat · เดย์ออฟ</title>
<meta name="description" content="Chat with Day-Off: say a vibe or ask where to go next, and get a one-day walking route for Yaowarat, Song Wat and Talat Noi.">
<meta name="theme-color" content="#ffffff">
<script>
/* Resolve the theme before first paint so there is no flash. */
(function(){
  var p="system";
  try{ p=localStorage.getItem("dayoff-theme")||"system"; }catch(e){}
  if(!/^(light|dark|system)$/.test(p)) p="system";
  var dark = p==="dark" || (p==="system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  var r=document.documentElement; r.dataset.theme=dark?"dark":"light"; r.dataset.themePref=p;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#F4F5F7; --card:#FFFFFF; --line:#E4E7EC; --track:#D9DDE4;
  --ink:#1B2233; --ink-2:#596273; --on-ink:#FFFFFF;
  --accent:#C93520; --accent-d:#AE2C1A; --on-accent:#FFFFFF;
  --warn:#B3261E; --gold:#E3AE3C; --gold-soft:#FBF0D4; --on-gold:#1B2233;
  --pill:#1B2233; --on-pill:#FFFFFF; --done:#6B7384;
  --toast-bg:#1B2233; --toast-fg:#FFFFFF; --toast-act:#F2C265;
  --scrim:rgba(27,34,51,.45);
  --shadow:0 1px 2px rgba(27,34,51,.06),0 6px 16px -8px rgba(27,34,51,.14);
  --ease:cubic-bezier(.23,1,.32,1);
  --f-head:'Mitr','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --header-h:56px; --tap:36px; --tap-sm:32px; --gutter:16px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
}
@media (pointer:coarse){:root{--tap:44px;--tap-sm:44px}}
@media (min-width:900px){:root{--gutter:32px}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111418; --surface:#181C22; --card:#1E232A; --line:#2D343E; --track:#3A424E;
  --ink:#EDF0F4; --ink-2:#A9B1BD; --on-ink:#111418;
  --accent:#FF8A75; --accent-d:#FFA08E; --on-accent:#1A0B08;
  --warn:#FF9488; --gold:#E3AE3C; --gold-soft:#3A3115; --on-gold:#1B2233;
  --pill:#EDF0F4; --on-pill:#111418; --done:#8C94A2;
  --toast-bg:#EDF0F4; --toast-fg:#1B2233; --toast-act:#8A3A00;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 0 0 1px rgba(255,255,255,.04);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--header-h) + var(--tap) + 16px);scroll-padding-bottom:96px}
.view{scroll-padding:16px}
body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);caret-color:var(--accent);overflow-wrap:anywhere}
::selection{background:var(--gold);color:var(--on-gold)}
*{scrollbar-width:thin;scrollbar-color:var(--track) transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;text-wrap:balance}
h1,h2{font-family:var(--f-head);font-weight:500}
h3{font-weight:600}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
dl,dd{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* header */
.header{position:sticky;top:0;z-index:30;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:0 var(--gutter);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:var(--s2);font:500 20px/1 var(--f-head);white-space:nowrap}
.brand-mark rect.f{fill:var(--ink)} .brand-mark g{fill:var(--bg)} .brand-mark circle{fill:var(--accent)}
.hctl{display:flex;align-items:center;gap:var(--s3)}
.live{display:none;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
#themeSlot{display:contents}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:2px}
.seg button{min-width:var(--tap);min-height:var(--tap);border:0;border-radius:999px;background:transparent;font-weight:600;font-size:13px;display:grid;place-items:center;padding:0 var(--s2);transition:background-color 160ms var(--ease)}
.seg button[aria-pressed="true"]{background:var(--pill);color:var(--on-pill)}
.seg-full{display:none}
.hlink{width:var(--tap);height:var(--tap);flex:none;border-radius:50%;display:grid;place-items:center;text-decoration:none;transition:transform 160ms var(--ease),background-color 160ms var(--ease)}
.hlink .ico{width:20px;height:20px}
.hlink:active{transform:scale(.94)}
.hlink.primary{background:var(--accent);color:var(--on-accent)}
.hlink.soft{background:var(--surface);color:var(--ink)}
@media (hover:hover) and (pointer:fine){.hlink.primary:hover{background:var(--accent-d)}.hlink.soft:hover{background:var(--track)}}
.theme-cycle{min-width:var(--tap);min-height:var(--tap);border:0;border-radius:50%;background:var(--surface);display:grid;place-items:center}
@media (min-width:560px){.seg-full{display:flex}.theme-cycle{display:none}}
@media (min-width:700px){.live{display:inline-flex}}
.inner{max-width:760px;margin:0 auto;display:grid;gap:var(--s5)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s4);border-radius:999px;border:1px solid transparent;font:600 14px/1 var(--f-body);white-space:nowrap;transition:transform 160ms var(--ease),background-color 160ms var(--ease),opacity 160ms}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--pill);color:var(--on-pill)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--track)}
.btn.small{min-height:var(--tap-sm);padding:0 var(--s3);font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover) and (pointer:fine){
  .btn.primary:hover{background:var(--accent-d)} .btn.dark:hover{opacity:.88} .btn.ghost:hover{background:var(--surface)}
  .chip:hover{background:var(--surface)} .add:hover{background:var(--surface)} .linkbtn:hover{background:var(--bg)}
  .seg button:hover:not([aria-pressed="true"]){background:var(--track)} .theme-cycle:hover{background:var(--track)}
}
.linkbtn{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap-sm);padding:0 var(--s2);border:0;background:transparent;border-radius:var(--s2);color:var(--ink);font-weight:600;font-size:13px;text-decoration:underline;text-decoration-color:var(--track);text-underline-offset:3px}
.linkbtn[aria-pressed="true"]{background:var(--bg)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,currentColor 35%,transparent);border-top-color:currentColor;animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap-sm);padding:0 var(--s3);border-radius:999px;border:1px solid var(--track);background:var(--card);font:500 13px/1.2 var(--f-body);transition:background-color 160ms var(--ease),transform 160ms var(--ease)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--pill);color:var(--on-pill);border-color:var(--pill)}
.chiprow{display:flex;flex-wrap:wrap;gap:var(--s2)}

/* type */
h1{font-size:28px;line-height:1.3}
h2{font-size:20px;line-height:1.35}
.sub{color:var(--ink-2);font-size:14px}
.hint{font-size:13px;color:var(--ink-2)}
.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:var(--s2)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
/* notices */
.notice{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:14px}
.notice.warn{background:var(--gold-soft);box-shadow:none}
.notice .ico{margin-top:3px}
.notice .chiprow{margin-top:var(--s2)}
.res-head{display:grid;gap:var(--s1)}
.matched{display:flex;flex-wrap:wrap;gap:var(--s2)}
.pill{display:inline-flex;align-items:center;padding:2px var(--s3);border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:500}
.filters{padding:var(--s4) var(--s5);display:grid;gap:var(--s4)}
.sliders{display:grid;gap:var(--s4) var(--s5);grid-template-columns:1fr}
@media (min-width:700px){.sliders{grid-template-columns:1fr 1fr}}
.slider{display:grid;gap:var(--s2)}
.slider .top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);font-size:13px}
.slider label{font-weight:600}
.slider output{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--ink) var(--p,0%),var(--track) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--card);border:2px solid var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--ink);outline-offset:3px}
input[type=range]:focus-visible::-moz-range-thumb{outline:2px solid var(--ink);outline-offset:3px}
@media (pointer:coarse){input[type=range]{height:36px}input[type=range]::-webkit-slider-thumb{width:24px;height:24px;margin-top:-10px}}
.thumb{position:relative;width:64px;height:64px;border-radius:12px;display:grid;place-items:center;color:var(--ic,#fff);background:var(--t);overflow:hidden}
.thumb .ico{width:24px;height:24px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tone-ink{--t:#1B2233} .tone-red{--t:#C93520} .tone-slate{--t:#4B5568} .tone-gold{--t:#E3AE3C;--ic:#1B2233}
:root[data-theme="dark"] .tone-ink{--t:#3A4659}
.name-line{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s2)}
.name-line h3{font-size:16px;line-height:1.4}
.best{background:var(--gold);color:var(--on-gold);font-size:12px;font-weight:600;padding:0 var(--s2);border-radius:6px;line-height:1.6}
.best.alt{background:var(--surface);color:var(--ink);border:1px solid var(--track)}
.st{display:inline-flex;align-items:center;gap:4px;padding:0 var(--s2);border-radius:6px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;line-height:1.6}
.st .ico{width:12px;height:12px}
.st.warn{background:var(--gold-soft)}
.st.done{background:var(--done);color:var(--bg)}
.meta{font-size:13px;color:var(--ink-2);margin-top:2px}
.vibes{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);margin-top:var(--s3)}
.vibe{display:inline-flex;align-items:center;gap:var(--s2);font-size:13px}
.vibe .vs{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.slats{display:inline-flex;gap:2px}
.slats i{width:9px;height:6px;border-radius:2px;background:var(--track);transform-origin:left center}
.slats i.on{background:var(--ink)}
.scored .slats i.on{animation:slat 380ms var(--ease) backwards;animation-delay:calc(var(--r)*90ms + var(--i)*30ms)}
@keyframes slat{from{transform:scaleX(.2);opacity:0}}
.evid{font-size:12px;color:var(--ink-2);margin-top:var(--s2)}
.empty{padding:var(--s5);display:grid;gap:var(--s3);justify-items:start}
.empty p{color:var(--ink-2)}
/* day */
.day-head{display:grid;gap:var(--s3)}
.day-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:var(--s3)}
.head-acts{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.day-meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);align-items:center}
.field{display:flex;align-items:center;gap:var(--s2);font-size:13px}
.field label{font-weight:600}
select{min-height:var(--tap-sm);padding:0 var(--s3);border:1px solid var(--track);border-radius:999px;background:var(--card);font-weight:500;font-size:13px}
.sum{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s5);font-size:14px}
.sum>div{display:flex;gap:6px;align-items:baseline}
.sum dt{color:var(--ink-2)}
.sum dd{font-weight:600;font-variant-numeric:tabular-nums}
.sum dd small{color:var(--ink-2);font-weight:400;margin-left:4px}
.late-chip{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);padding:2px var(--s3);border-radius:999px;font-weight:600;font-size:13px;justify-self:start}
.suggest{padding:var(--s4) var(--s5);display:grid;gap:var(--s3)}
.suggest h3{display:flex;gap:var(--s2);align-items:center;font-size:14px;color:var(--ink-2)}
.suggest .pick h3{font-size:16px;color:var(--ink)}
.suggest .facts{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);font-size:13px}
.suggest .facts span{display:inline-flex;gap:6px;align-items:center}
.suggest .rank{font-size:12px;color:var(--ink-2)}
.sug-acts{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.timeline{position:relative;padding:var(--s4) var(--s4) var(--s2)}
.stop{background:var(--card);border-radius:12px}
.stop .walkin,.stop .srow{display:grid;grid-template-columns:44px 24px minmax(0,1fr);column-gap:var(--s3)}
.stop .walkin[hidden]{display:none}
.rail{position:relative;display:flex;justify-content:center}
.rail::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--track)}
.walkin .rail::after{background:repeating-linear-gradient(180deg,var(--track) 0 4px,transparent 4px 8px)}
.stop:first-child .srow .rail::after{top:12px}
.stop:last-child .srow .rail::after{bottom:auto;height:12px}
.dot{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:500 12px/1 var(--f-head);box-shadow:0 0 0 3px var(--card)}
.dot.done{background:var(--done);color:var(--bg)}
.dot .ico{width:12px;height:12px;stroke-width:3}
.time{font:500 14px/24px var(--f-head);font-variant-numeric:tabular-nums;white-space:nowrap}
.stop.done .time,.stop.done h3{color:var(--ink-2)}
.stop-body{position:relative;min-width:0;padding-bottom:var(--s3)}
.stop-body h3{font-size:15px;line-height:24px}
.stop-chips{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);margin-top:var(--s1)}
.note{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--ink-2);margin-top:var(--s1)}
.note .ico{margin-top:2px;width:14px;height:14px}
.note.warn{color:var(--warn);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);margin-top:var(--s2)}
.walk-body{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) 0 var(--s3);font-size:13px;color:var(--ink-2)}
.rm,.ibtn{width:var(--tap-sm);height:var(--tap-sm);flex:none;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;color:var(--ink-2)}
.ibtn[aria-pressed="true"]{color:var(--accent)} .ibtn[aria-pressed="true"] .ico{fill:currentColor}
/* the tools sit top-right beside the name only; notes, stepper and buttons below use the full width, so nothing overflows the card on a phone */
.stop-tools{position:absolute;top:calc((24px - var(--tap-sm)) / 2);right:0;display:flex;align-items:flex-start}
.stop:not(.done) .stop-body h3{padding-right:calc(var(--tap-sm) * 3 + var(--s2))}
/* manual ordering */
.grip{touch-action:none;cursor:grab}
.grip:active{cursor:grabbing}
/* the lifted stop gets breathing room on every side: a card-coloured ring (no layout change, so the list does not jump) plus a soft shadow */
.stop.lifting{position:relative;z-index:4;cursor:grabbing;border-radius:16px;box-shadow:0 0 0 12px var(--card),0 14px 32px 8px rgba(27,34,51,.26)}
:root[data-theme="dark"] .stop.lifting{box-shadow:0 0 0 12px var(--card),0 14px 32px 8px rgba(0,0,0,.55)}
.timeline.reordering{user-select:none;-webkit-user-select:none}
.timeline.reordering .stop:not(.lifting) .time,.timeline.reordering .walk-body{opacity:.35}
@media (hover:hover) and (pointer:fine){.rm:hover,.ibtn:hover{background:var(--surface)} .rm:hover{color:var(--warn)}}
.nofit,.skipbox{padding:var(--s4) var(--s5)}
.nofit h3,.skipbox h3{display:flex;gap:var(--s2);align-items:center;font-size:14px}
.nofit h3{color:var(--warn)}
.nofit ul,.skipbox ul{margin-top:var(--s2)}
.nofit li,.skipbox li{display:flex;justify-content:space-between;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-top:1px solid var(--line)}
.nofit li:first-child,.skipbox li:first-child{border-top:0}
.day-foot{display:flex;justify-content:flex-start}
/* sheet */
dialog{border:0;padding:0;background:transparent;max-width:none;margin:auto auto 0;width:100%;color:var(--ink)}
dialog::backdrop{background:var(--scrim)}
dialog[open]{animation:sheetin 240ms var(--ease)}
dialog[open]::backdrop{animation:fade 200ms ease-out}
@keyframes sheetin{from{transform:translateY(16px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);border-radius:20px 20px 0 0;padding:var(--s5);max-width:560px;margin:0 auto;display:grid;gap:var(--s4);overscroll-behavior:contain;max-height:88dvh;overflow:auto;padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom))}
.sheet h2{font-size:20px}
.sheet h3{font-size:14px;margin-bottom:var(--s2)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);border:0;padding:0;margin:0}
.opts legend{font-weight:600;font-size:14px;margin-bottom:var(--s2);padding:0}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;justify-content:center;min-height:var(--tap);border:1px solid var(--track);border-radius:999px;font-weight:600;font-size:13px;transition:background-color 160ms var(--ease)}
.opt input:checked+span{background:var(--pill);color:var(--on-pill);border-color:var(--pill)}
.opt input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.diff{display:grid;gap:var(--s2);background:var(--surface);border-radius:12px;padding:var(--s3) var(--s4);font-size:14px}
.diff li{display:flex;gap:var(--s2);align-items:flex-start}
.diff .ico{margin-top:3px}
.diff .bad{color:var(--warn);font-weight:600}
.sheet-actions{display:flex;justify-content:flex-end;gap:var(--s2)}
.axes{display:grid;gap:var(--s2)}
.axes li{display:grid;grid-template-columns:minmax(76px,auto) auto 1fr;gap:var(--s3);align-items:center;font-size:13px}
.axes .mn{color:var(--ink-2);font-size:12px;text-align:right}
.rev{display:grid;gap:var(--s2);font-size:13px;color:var(--ink-2)}
.srcline{display:flex;gap:var(--s2);align-items:flex-start;font-size:12px;color:var(--ink-2)}
.srcline .ico{margin-top:2px;width:14px;height:14px}
.linkrow{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.linkrow code{flex:1;min-width:0;background:var(--surface);border-radius:999px;padding:var(--s2) var(--s4);font:500 13px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.votes{display:grid}
.votes li{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s2) 0;border-top:1px solid var(--line);font-size:14px}
.votes li:first-child{border-top:0}
.vt{display:grid;gap:4px;justify-items:end;min-width:104px}
.vbar{display:flex;width:88px;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.vbar .up{background:var(--ink)} .vbar .dn{background:var(--accent)}
.vt .vs{font-size:12px;color:var(--ink-2)}
/* toast */
.toasts{position:fixed;left:var(--gutter);right:var(--gutter);bottom:84px;z-index:40;display:flex;justify-content:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:var(--s2);max-width:420px;width:100%;background:var(--toast-bg);color:var(--toast-fg);border-radius:12px;padding:var(--s1) var(--s1) var(--s1) var(--s4);font-size:14px;box-shadow:0 12px 28px -10px rgba(0,0,0,.4);animation:toastin 200ms var(--ease)}
.toast span{flex:1;padding:var(--s2) 0}
.toast button{min-height:var(--tap);padding:0 var(--s3);border:0;border-radius:8px;background:transparent;color:var(--toast-act);font-weight:600}
.toast :focus-visible{outline-color:var(--toast-fg)}
@keyframes toastin{from{transform:translateY(8px);opacity:0}}
/* map pins (Leaflet divIcons) */
.leaflet-container{font:inherit;background:var(--surface)}
:root[data-theme="dark"] #map[data-tiles="osm"] .leaflet-tile-pane,:root[data-theme="dark"] #map[data-tiles="carto"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
.leaflet-control-attribution{font-size:11px}
.pin{display:grid;place-items:center;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);color:#fff;font:500 12px/1 var(--f-head);transition:transform 160ms var(--ease)}
.pin.res{width:16px;height:16px;background:var(--accent)}
.pin.tray{width:16px;height:16px;background:#1B2233}
.pin.num{width:26px;height:26px;background:var(--accent);color:var(--on-accent)}
.pin.num.done{background:var(--done);color:#fff}
.pin.faint{width:9px;height:9px;background:#9AA3B2;border-width:1.5px}
.pin.best{box-shadow:0 0 0 4px var(--gold),0 1px 4px rgba(0,0,0,.35)}
.pinbox{width:100%;height:100%;display:grid;place-items:center}
.leaflet-marker-icon:focus-visible .pin,.leaflet-marker-icon:hover .pin{transform:scale(1.2)}
.leaflet-marker-icon:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:50%}
@media (pointer:coarse){.leaflet-bar a{width:44px;height:44px;line-height:44px}}
/* adjustable time at a place */
.stay{display:inline-flex;align-items:center;gap:var(--s1);margin-top:var(--s1);font-size:13px;color:var(--ink-2)}
.stay output{min-width:56px;text-align:center;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ibtn.sm{width:var(--tap-sm);height:var(--tap-sm);border:1px solid var(--track);color:var(--ink);font-size:16px;line-height:1}
/* place photo in the detail sheet */
.hero{margin:0;display:grid;gap:var(--s2)}
.hero-img{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero figcaption{font-size:12px;color:var(--ink-2)}
.hero figcaption a{color:inherit}

/* ===== chat layout: phone = map strip on top, chat below. desktop = chat 55% | map 45% ===== */
:root{--strip-h:156px;--bar-h:52px;--stack:84px}
.app{position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--strip-h) minmax(0,1fr);grid-template-areas:"map" "chat";height:calc(100dvh - var(--header-h));overflow:hidden;background:var(--surface)}
.app[data-map="off"]{grid-template-rows:var(--bar-h) minmax(0,1fr)}
.mapcol{grid-area:map;position:relative;min-height:0;isolation:isolate;background:var(--surface);margin:var(--s2) var(--s3) 0;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow),inset 0 0 0 3px var(--card)}
.mapcol::after{content:"";position:absolute;inset:0;z-index:1000;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line)}
.app[data-map="full"] .mapcol{grid-area:auto;position:absolute;inset:0;z-index:8;margin:0;border:0;border-radius:0;box-shadow:none}
.app[data-map="full"] .mapcol::after{display:none}
.app[data-map="off"] #map{display:none}
#map{position:absolute;inset:0;background:var(--surface)}
.mapfail{padding:var(--s5);color:var(--ink-2)}
.mapbar{position:absolute;left:var(--s2);top:var(--s2);z-index:1100;display:flex;gap:var(--s2)}
.app[data-map="off"] .mapbar{top:50%;transform:translateY(-50%)}
.mapbar .iconbtn{width:var(--tap-sm);padding:0}
.mapbar .btn{box-shadow:var(--shadow)}
.mapsw{position:absolute;left:var(--s2);bottom:var(--s2);z-index:1100;display:flex;padding:2px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.mapsw[hidden],.app[data-map="off"] .mapsw{display:none}
.mapsw button{min-height:var(--tap-sm);padding:0 var(--s3);border:0;border-radius:999px;background:transparent;font-weight:600;font-size:12px;color:var(--ink);transition:background-color 160ms var(--ease)}
.mapsw button[aria-pressed="true"]{background:var(--pill);color:var(--on-pill)}
@media (hover:hover){.mapsw button:hover:not([aria-pressed="true"]){background:var(--track)}}
.mapsw button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
@media (pointer:coarse){.mapsw button{min-height:var(--tap)}}
.chatcol{grid-area:chat;position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface)}
.chatmain{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}

/* conversation */
.log{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:var(--s4) var(--gutter) var(--s4);display:flex;flex-direction:column;gap:var(--s3);scroll-padding:var(--s4)}
.log>.msg{width:100%;max-width:720px;margin-inline:auto}
.msg{display:flex;gap:var(--s2);align-items:flex-start}
.msg.user{justify-content:flex-end}
.msg.fresh{animation:msgin 220ms var(--ease)}
@keyframes msgin{from{transform:translateY(8px);opacity:0}}
.avatar{width:28px;height:28px;flex:none;border-radius:50%;background:var(--pill);color:var(--on-pill);display:grid;place-items:center}
.avatar .ico{width:16px;height:16px}
.stack{display:grid;gap:var(--s2);min-width:0;justify-items:start;flex:1 1 auto;max-width:600px}
.msg.user .stack{justify-items:end;flex:0 1 auto;max-width:min(86%,520px)}
.bubble{padding:10px var(--s4);border-radius:18px 18px 18px 6px;background:var(--card);border:1px solid var(--line);max-width:min(100%,520px)}
.bubble p+p{margin-top:var(--s2)}
.msg.user .bubble{background:var(--pill);color:var(--on-pill);border-color:var(--pill);border-radius:18px 18px 6px 18px}
.fnote{font-size:13px;color:var(--ink-2)}
.typing .bubble{display:flex;align-items:center;gap:4px;padding:14px var(--s4)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-2);animation:blink 1.1s ease-in-out infinite}
.typing i:nth-of-type(2){animation-delay:.15s}.typing i:nth-of-type(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.cards{display:grid;gap:var(--s2);width:100%;max-width:560px}
.pcard{display:grid;grid-template-columns:56px minmax(0,1fr);gap:var(--s2) var(--s3);padding:var(--s3)}
.thumbbtn{width:56px;height:56px;padding:0;border:0;background:transparent;border-radius:12px;cursor:pointer}
.thumbbtn .thumb{width:56px;height:56px}
.pc-acts{grid-column:2;display:flex;flex-wrap:wrap;gap:var(--s2)}
.pcard .name-line h3{font-size:15px}
.pcard .vibes{margin-top:var(--s2)}
.miniday{padding:var(--s3) var(--s4);display:grid;gap:var(--s3);justify-items:start}
.miniday ol{display:grid;gap:var(--s1);width:100%}
.miniday li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:var(--s2);font-size:14px}
.miniday .time{font:500 14px/1.55 var(--f-head);font-variant-numeric:tabular-nums}
.stack>.diff{width:100%;max-width:520px}
.stack>.filters{width:100%;max-width:560px}
.sugcard{padding:var(--s3) var(--s4);display:grid;gap:var(--s2);width:100%;max-width:560px}
.sugcard .rank{font-size:12px;color:var(--ink-2)}
.resolved{font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}

/* bottom stack: day bar, quick replies, composer */
.bottom{flex:none;background:var(--bg);border-top:1px solid var(--line);padding:var(--s2) var(--gutter) calc(var(--s2) + env(safe-area-inset-bottom))}
.bottom-in{display:grid;gap:var(--s2);max-width:720px;margin:0 auto}
.bottom-in [hidden]{display:none}
.embedbar{display:flex;gap:var(--s2)}
.embedbar[hidden]{display:none}
.embedbar .btn{flex:1}
.embed #toClassic,.embed #toHub{display:none}
.hlink.closer{display:none}
.embed .hlink.closer{display:grid}
.daybtn{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:52px;padding:var(--s2) var(--s4) var(--s2) var(--s3);border:1px solid var(--track);border-radius:16px;background:var(--card);text-align:left;transition:transform 160ms var(--ease),background-color 160ms var(--ease)}
.daybtn:active{transform:scale(.99)}
.db-ico{width:32px;height:32px;flex:none;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.db-txt{flex:1;min-width:0;display:grid;line-height:1.35}
.db-txt strong{font-weight:600}
.db-txt span{font-size:13px;color:var(--ink-2)}
.db-go .ico{width:18px;height:18px;transform:rotate(180deg)}
.quick{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick .chip{flex:none;white-space:nowrap}
.composer{display:flex;align-items:flex-end;gap:var(--s2)}
.cinput{flex:1;min-width:0;min-height:var(--tap);max-height:120px;resize:none;padding:8px var(--s4);border:1px solid var(--track);border-radius:22px;background:var(--bg);font-size:15px;line-height:1.45;overflow-y:auto}
.cinput::placeholder{color:var(--ink-2);opacity:1}
.cinput:focus-visible{outline-offset:0;border-color:var(--ink)}
.sendbtn{width:var(--tap);height:var(--tap);flex:none;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transition:transform 160ms var(--ease),opacity 160ms,background-color 160ms var(--ease)}
.micbtn{width:var(--tap);height:var(--tap);flex:none;border:1px solid var(--track);border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;transition:transform 160ms var(--ease),background-color 160ms var(--ease)}
.micbtn[hidden]{display:none}
.vlang{flex:none;min-width:var(--tap);height:var(--tap);padding:0 var(--s2);border:0;border-radius:999px;background:transparent;color:var(--ink-2);font:600 12px/1 var(--f-body)}
.vlang[hidden]{display:none}
.vlang:hover{color:var(--ink)}
.micbtn .ico{width:20px;height:20px}
.micbtn:active{transform:scale(.94)}
.micbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:mic-pulse 1.4s var(--ease) infinite}
@keyframes mic-pulse{0%{box-shadow:0 0 0 0 rgba(201,53,32,.45)}100%{box-shadow:0 0 0 12px rgba(201,53,32,0)}}
@media (hover:hover) and (pointer:fine){.micbtn:not([aria-pressed="true"]):hover{background:var(--surface)}}
@media (prefers-reduced-motion:reduce){.micbtn[aria-pressed="true"]{animation:none}}
.sendbtn:active{transform:scale(.94)}
.sendbtn:disabled{opacity:.4;cursor:not-allowed}
.sendbtn .ico{width:18px;height:18px}
@media (hover:hover) and (pointer:fine){.daybtn:hover{background:var(--surface)}.sendbtn:not(:disabled):hover{background:var(--accent-d)}.thumbbtn:hover{opacity:.9}}

/* day panel: covers the chat column only, so the map and its route stay visible */
.daypanel{position:absolute;inset:-1px 0 0;z-index:6;display:flex;flex-direction:column;background:var(--surface)}
.daypanel[hidden]{display:none}
.daypanel:not([hidden]){animation:panelin 240ms var(--ease)}
@keyframes panelin{from{transform:translateY(24px);opacity:0}}
.dp-head{flex:none;display:flex;align-items:center;padding:var(--s2) var(--gutter);background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dp-view{flex:1 1 auto;min-height:0;min-width:0;overflow-y:auto;overscroll-behavior:contain;padding:var(--s4) var(--gutter) var(--s5);scroll-padding:var(--s4);outline:0}
.daydock{flex:none;background:var(--bg);border-top:1px solid var(--line);padding:var(--s3) var(--gutter) calc(var(--s3) + env(safe-area-inset-bottom))}
.daydock[hidden]{display:none}
.dock-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.dock-txt strong{display:block;font-weight:600;line-height:1.35}

/* toasts sit just above whichever bar is at the bottom */
.toasts{position:fixed;left:var(--gutter);right:var(--gutter);bottom:calc(var(--stack) + 12px);z-index:40;display:flex;justify-content:center;pointer-events:none}

@media (min-width:900px){
  .app,.app[data-map]{grid-template-columns:minmax(0,55fr) minmax(0,45fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"chat map"}
  .mapcol,.app[data-map] .mapcol{grid-area:map;position:relative;inset:auto;z-index:auto;margin:0;border:0;border-radius:0;box-shadow:none;border-left:1px solid var(--line)}
  .mapcol::after,.app[data-map] .mapcol::after{display:none}
  .app[data-map] #map{display:block}
  .mapbar{display:none}
  .toasts{left:0;right:auto;width:55vw}
  dialog{margin:auto;width:480px}
  .sheet{border-radius:20px}
}
@media (max-width:420px){
  .nofit,.skipbox,.suggest,.filters{padding:var(--s4)}
}
@media (prefers-reduced-motion:reduce){
  .msg.fresh,.daypanel:not([hidden]),dialog[open],dialog[open]::backdrop,.toast{animation:none}
  .typing i{animation:none;opacity:.6}
  .btn,.chip,.daybtn,.sendbtn,.pin{transition:none}
  .spin{animation-duration:2s}
}
</style>
</head>

<header class="header">
  <div class="brand">
    <svg class="brand-mark" width="26" height="26" viewBox="0 0 30 30" aria-hidden="true"><rect class="f" x="3" y="4" width="24" height="22" rx="5"/><g><rect x="6" y="8" width="18" height="2.5" rx="1"/><rect x="6" y="12.5" width="18" height="2.5" rx="1"/><rect x="6" y="17" width="18" height="2.5" rx="1"/></g><circle cx="22.5" cy="22" r="3.6"/></svg>
    <span>Day-Off</span>
  </div>
  <div class="hctl">
    <span class="live" id="liveClock"></span>
    <span id="themeSlot"></span>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-act="lang" data-lang="th" aria-pressed="true">ไทย</button>
      <button type="button" data-act="lang" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button type="button" class="hlink soft closer" id="embedClose" data-act="embedClose" data-testid="embed-close"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button>
    <a class="hlink soft" id="toClassic" href="day-off-demo.html" data-testid="to-classic"><svg class="ico" aria-hidden="true"><use href="#i-classic"/></svg></a>
    <a class="hlink soft" id="toHub" href="versions.html" data-testid="to-hub"><svg class="ico" aria-hidden="true"><use href="#i-spark"/></svg></a>
  </div>
</header>

<div class="app" id="app" data-map="strip">
  <aside class="mapcol" id="mapcol">
    <div id="map" role="region"></div>
    <div class="mapbar" id="mapbar"></div>
    <div class="mapsw" id="mapsw" role="group" aria-label="Map provider" hidden></div>
  </aside>
  <section class="chatcol" id="chatcol">
    <div class="chatmain" id="chatmain">
      <main class="log" id="log" role="log" aria-live="off" data-testid="chat-log"></main>
      <div class="bottom" id="bottom">
        <div class="bottom-in">
          <div class="embedbar" id="embedbar" hidden></div>
          <div id="daybar" hidden></div>
          <div class="quick" id="quick" role="group" hidden></div>
          <form class="composer" id="composer" novalidate>
            <textarea class="cinput" id="msg" rows="1" enterkeyhint="send" autocomplete="off"></textarea>
            <button type="button" class="vlang" id="vlang" data-testid="vlang" hidden></button>
            <button type="button" class="micbtn" id="mic" aria-pressed="false" hidden data-testid="mic"><svg class="ico" aria-hidden="true"><use href="#i-mic"/></svg></button>
            <button type="submit" class="sendbtn" id="send" disabled><svg class="ico" aria-hidden="true"><use href="#i-send"/></svg></button>
          </form>
        </div>
      </div>
    </div>
    <section class="daypanel" id="daypanel" role="region" hidden>
      <div class="dp-head"><button type="button" class="btn small ghost" id="dpBack" data-act="closeDay" data-fk="dpBack"></button></div>
      <div class="dp-view" id="dayview" tabindex="-1"></div>
      <div class="daydock" id="daydock" hidden></div>
    </section>
  </section>
</div>

<div class="toasts" id="toasts"></div>
<div class="sr" id="live" aria-live="polite" role="status"></div>
<dialog id="sheet" aria-labelledby="sheet-title"></dialog>

<script src="env.js"></script>

function bangkokNow(){
  const m=(params.get("at")||"").match(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[ -](\d\d):(\d\d)$/);
  if(m) return {dow:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(m[1]), min:+m[2]*60+ +m[3]};
  const f=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Bangkok",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g=k=>f.find(x=>x.type===k).value;
  return {dow:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(g("weekday")), min:(+g("hour")%24)*60+ +g("minute")};
}

/* minimal opening_hours reader for the shapes used above: "Mo-Su 09:00-18:00", "Tu-Su ...", "10:00-19:00" */
function hoursFor(h,dow){
  if(!h) return {status:"unknown"};
  const m=h.match(/^(?:(Mo|Tu|We|Th|Fr|Sa|Su)(?:-(Mo|Tu|We|Th|Fr|Sa|Su))? )?(\d\d):(\d\d)-(\d\d):(\d\d)$/);
  if(!m) return {status:"unknown"};
  const a=m[1]?DAYIDX[m[1]]:0, b=m[1]?(m[2]?DAYIDX[m[2]]:a):6;
  if(dow<a||dow>b) return {status:"closed"};
  const o=+m[3]*60+ +m[4]; let c=+m[5]*60+ +m[6]; if(c<=o) c+=1440;
  return {status:"ok", open:o, close:c};
}

/* ---------- route solver (mock of the OR-Tools step) ---------- */
function simulate(order,start,prevPlace,endMin,manual=false){
  let now=start, prev=prevPlace||null, walk=0; const items=[], dropped=[];
  for(const id of order){
    const p=P[id];
    if(p.status==="unknown"){ dropped.push({id, reason:"unknown"}); continue; }
    if(p.status==="closed"){ dropped.push({id, reason:"closedday"}); continue; }
    const w=prev?walkMin(prev,p):0, arr=now+w, s=Math.max(arr,p.open), end=s+durOf(p);
    let conflict=null;
    /* automatic mode drops what cannot fit; manual mode keeps the user's order and flags the conflict instead */
    if(end>p.close){ if(!manual){ dropped.push({id, reason: arr<p.open ? "late" : "early"}); continue; } conflict="close"; }
    else if(end>endMin){ if(!manual){ dropped.push({id, reason:"window"}); continue; } conflict="window"; }
    items.push({id, walk:w, wait:s-arr, start:s, end, conflict});
    walk+=w; now=end; prev=p;
  }
  return {items,dropped,finish:now,walk};
}
const fitsIn=(pl,id)=>pl.items.some(i=>i.id===id&&!i.conflict);
function solve(ids,start,prevPlace,endMin,pins,base){
  if(!ids.length) return {items:[],dropped:[],finish:start,walk:0};
  const pinned=Object.keys(pins).filter(id=>ids.includes(id));
  const run=useP=>{
    let best=null;
    (function perm(rest,cur){
      if(!rest.length){
        if(useP && pinned.some(id=>cur.indexOf(id)+base!==pins[id])) return;
        const r=simulate(cur,start,prevPlace,endMin), cost=r.dropped.length*1e5+r.finish+r.walk*0.01;
        if(!best||cost<best.cost) best={...r,cost};
        return;
      }
      rest.forEach((id,i)=>perm([...rest.slice(0,i),...rest.slice(i+1)],[...cur,id]));
    })(ids,[]);
    return best;
  };
  return (pinned.length && run(true)) || run(false);   /* pins are respected when any order allows them */
}
function plan(tray=state.tray, delay=state.delay, start=state.startMin, end=state.endMin){
  const vs=state.visits.filter(v=>tray.includes(v.id));   /* visited stops stay fixed (FR-706) */
  const items=[]; let prev=null, walk=0;
  vs.forEach(v=>{ const p=P[v.id], w=prev?walkMin(prev,p):0; items.push({id:v.id,walk:w,wait:0,start:v.start,end:v.end,done:true}); walk+=w; prev=p; });
  const rest=tray.filter(id=>!vs.some(v=>v.id===id));
  const t0=vs.length ? vs[vs.length-1].end+delay : start+delay;
  const r=state.manual ? simulate(rest,t0,prev,end,true) : solve(rest,t0,prev,end,state.pins,vs.length);
  const all=[...items,...r.items];
  return {items:all, dropped:r.dropped, finish:all.length?all[all.length-1].end:t0, walk:walk+r.walk};
}

    return `<li><div><strong>${esc(nm(p))}</strong><p class="note warn">${icon("alert")}<span>${why}</span></p></div>

  const lateBase=hasVisits?state.visits.filter(v=>state.tray.includes(v.id)).slice(-1)[0].end:s;

    ${pl.items.length?`<ol class="card timeline" data-testid="timeline">${list}</ol>`:""}

    <div class="day-foot"><button type="button" class="linkbtn" data-act="routing" data-fk="routing" aria-pressed="${state.routeDown}">${icon("route")}${t(state.routeDown?"simUp":"simDown")}</button></div>

/* ---------- real map (Leaflet + OpenStreetMap tiles) ---------- */
let LMAP=null, LGROUP=null, LROUTE=null, lastFit="", routeToken=0;
/* Tiles: Mapbox when MAP_BLOCK_KEY is available (served by server.mjs as /env.js), else OSM over http, else CARTO.
   Three tile errors (bad token, URL restriction, 403) retire a provider and the next one takes over. */
const MAP_KEY = (window.DAYOFF_ENV && window.DAYOFF_ENV.MAP_BLOCK_KEY) || "";
const LONGDO_KEY = (window.DAYOFF_ENV && window.DAYOFF_ENV.LONGDO_MAP_KEY) || "";
/* "Mapbox | Longdo" switch: only shown when both keys exist; the choice is saved like the theme */
let mapPref="mapbox"; try{ mapPref=localStorage.getItem("dayoff-map")==="longdo"?"longdo":"mapbox"; }catch(e){}
const OSM_ATTR='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
let TL=null, tileKind="", tileErrs=0; const tileDead=new Set();
function wantTiles(){
  if(LONGDO_KEY && mapPref==="longdo" && !tileDead.has("longdo")) return "longdo";
  if(MAP_KEY && !tileDead.has("mapbox")) return document.documentElement.dataset.theme==="dark" ? "mapbox-dark" : "mapbox-light";
  if(location.protocol==="file:" || tileDead.has("osm")) return "carto";
  return "osm";
}
function tileSpec(kind){
  if(kind.startsWith("mapbox")){
    const style = kind==="mapbox-dark" ? "dark-v11" : "streets-v12";
    return {url:`https://api.mapbox.com/styles/v1/mapbox/${style}/tiles/512/{z}/{x}/{y}@2x?access_token=${MAP_KEY}`, opt:{tileSize:512, zoomOffset:-1, maxZoom:19, attribution:'&copy; <a href="https://www.mapbox.com/about/maps/">Mapbox</a> '+OSM_ATTR}};
  }
  if(kind==="longdo") return {url:`https://ms.longdo.com/mmmap/tile.php?zoom={z}&x={x}&y={y}&key=${LONGDO_KEY}&proj=epsg3857&HD=true`, opt:{tileSize:256, maxZoom:19, attribution:'&copy; <a href="https://map.longdo.com/">Longdo Map</a> '+OSM_ATTR}};
  if(kind==="carto") return {url:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", opt:{maxZoom:19, subdomains:"abcd", attribution:OSM_ATTR+' &copy; <a href="https://carto.com/attributions">CARTO</a>'}};
  return {url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", opt:{maxZoom:19, attribution:OSM_ATTR}};
}
function renderMapSwitch(){
  const el=$("#mapsw"); if(!el) return;
  if(!(MAP_KEY && LONGDO_KEY)){ el.hidden=true; return; }
  el.hidden=false;
  el.innerHTML=["mapbox","longdo"].map(k=>`<button type="button" data-prov="${k}" aria-pressed="${k===mapPref}">${k==="mapbox"?"Mapbox":"Longdo"}</button>`).join("");
}
function setMapProvider(k){
  mapPref=k; try{ localStorage.setItem("dayoff-map",k); }catch(e){}
  tileDead.delete(k); renderMapSwitch(); syncTiles();
}
function syncTiles(){
  if(!LMAP) return;
  const kind=wantTiles(); if(kind===tileKind) return;
  if(TL) LMAP.removeLayer(TL);
  const sp=tileSpec(kind); TL=L.tileLayer(sp.url,sp.opt).addTo(LMAP); tileKind=kind; tileErrs=0;
  $("#map").dataset.tiles = kind.startsWith("mapbox") ? "mapbox" : kind;
  TL.on("tileerror",()=>{ if(++tileErrs>=3){ tileDead.add(kind.startsWith("mapbox")?"mapbox":kind); syncTiles(); } });
}
const routeCache=new Map();
function initMap(){
  if(!window.L){ $("#map").innerHTML=`<p class="mapfail">${t("mapFail")}</p>`; return; }
  LMAP=L.map("map",{zoomControl:false,attributionControl:false,scrollWheelZoom:true,keyboard:true}).setView([13.7385,100.5105],15);
  L.control.attribution({position:"topright"}).addTo(LMAP); L.control.zoom({position:"bottomright"}).addTo(LMAP);   /* top-right so the phone bottom sheet never hides it */
  syncTiles(); renderMapSwitch();
  $("#mapsw").addEventListener("click",e=>{ const b=e.target.closest("button[data-prov]"); if(b) setMapProvider(b.dataset.prov); });
  LGROUP=L.layerGroup().addTo(LMAP);
  new ResizeObserver(()=>{ LMAP.invalidateSize(); }).observe($("#map"));
}
function pinIcon(kind,n,best){
  const dot = kind==="num"||kind==="done" ? 26 : kind==="faint" ? 9 : 16;
  const size = kind==="faint" ? 14 : Math.max(dot,30);          /* hit area stays comfortable even when the dot is small */
  const cls = kind==="done" ? "num done" : kind;
  return L.divIcon({className:"", html:`<div class="pinbox"><div class="pin ${cls}${best?" best":""}">${n||""}</div></div>`, iconSize:[size,size], iconAnchor:[size/2,size/2]});
}
async function walkGeometry(pts){
  const key=pts.map(p=>p.lng.toFixed(5)+","+p.lat.toFixed(5)).join(";");
  if(routeCache.has(key)) return routeCache.get(key);
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),6000);
    const r=await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${key}?overview=full&geometries=geojson`,{signal:ctl.signal});
    clearTimeout(to);
    if(!r.ok) throw new Error("route "+r.status);
    const j=await r.json(); const g=j.routes&&j.routes[0]&&j.routes[0].geometry.coordinates.map(([x,y])=>[y,x]);
    routeCache.set(key,g||null); return g||null;
  }catch(e){ routeCache.set(key,null); return null; }
}

const LMARKERS={};
function focusItem(id){
  const el=document.querySelector(`.stop[data-pid="${id}"]`);
  if(!el) return;
  el.scrollIntoView({block:"center",behavior:reducedMotion()?"auto":"smooth"});
}
function renderMap(){
  const col=$("#mapcol");
  if(!LMAP) return;
  syncTiles();                         /* follows the theme (light / dark Mapbox style) */
  LGROUP.clearLayers(); if(LROUTE){ LMAP.removeLayer(LROUTE); LROUTE=null; }
  Object.keys(LMARKERS).forEach(k=>delete LMARKERS[k]);
  routeToken++;
  let pins=[], route=[], focus=[], mode="all";
  const live=liveResults(), inTray=id=>state.tray.includes(id);
  if(state.dayOpen || (!live && state.tray.length)){
    mode="day";
    const pl=plan();
    pl.items.forEach((it,i)=>{ const p=P[it.id]; pins.push({p,kind:it.done?"done":"num",n:i+1}); focus.push(p); });
    route=pl.items.map(i=>P[i.id]);
    PLACES.filter(p=>!pl.items.some(i=>i.id===p.id)).forEach(p=>pins.unshift({p,kind:"faint"}));
  } else if(live && live.items.length){
    mode="places";
    const ids=live.items.map(r=>r.id);
    live.items.forEach((r,i)=>{ const p=P[r.id]; pins.push({p,kind:inTray(p.id)?"tray":"res",best:i===0&&!r.weak}); focus.push(p); });
    PLACES.filter(p=>!ids.includes(p.id)).forEach(p=>pins.unshift({p,kind:inTray(p.id)?"tray":"faint"}));
  } else { PLACES.forEach(p=>pins.push({p,kind:inTray(p.id)?"tray":"faint"})); }
  pins.forEach(({p,kind,n,best})=>{
    const m=L.marker([p.lat,p.lng],{icon:pinIcon(kind,n,best),title:nm(p),alt:nm(p),keyboard:kind!=="faint",riseOnHover:true});
    m.bindTooltip(esc(nm(p)),{direction:"top",offset:[0,-8]});
    m.on("click",()=>{ if(state.dayOpen) focusItem(p.id); else openDetail(p.id); });
    m.addTo(LGROUP); LMARKERS[p.id]=m;
  });
  $("#map").setAttribute("aria-label", mode!=="all"&&focus.length?t("mapStops",{n:focus.length}):t("mapLabel"));
  if(route.length>1){
    const pts=route.map(p=>[p.lat,p.lng]), token=routeToken;
    LROUTE=L.polyline(pts,{color:"#C93520",weight:4,opacity:.85,dashArray:"2 8",lineCap:"round"}).addTo(LMAP);
    if(!state.routeDown) walkGeometry(route).then(g=>{
      if(!g||token!==routeToken||!LMAP) return;
      LMAP.removeLayer(LROUTE); LROUTE=L.polyline(g,{color:"#C93520",weight:4,opacity:.9}).addTo(LMAP);
      LROUTE.getElement()?.setAttribute("data-route","osm");
    });
  }
  if(col.offsetWidth===0 || col.clientHeight<60){ lastFit=""; return; }     /* map is hidden or collapsed */
  const key=mode+"|"+focus.map(p=>p.id).join(",")+"|"+mapState();
  if(key!==lastFit){
    lastFit=key; LMAP.invalidateSize();
    const pts=(focus.length?focus:PLACES).map(p=>[p.lat,p.lng]);
    if(pts.length===1) LMAP.setView(pts[0],16,{animate:false});
    else LMAP.fitBounds(L.latLngBounds(pts),{padding:[28,28],maxZoom:17,animate:false});
  }
}
/* ---------- live photos (Wikipedia, only where a page exists; the icon tile is the fallback) ---------- */
async function loadPhotos(){
  await Promise.all(PLACES.filter(p=>p.wiki).map(async p=>{
    try{
      const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+p.wiki);
      if(!r.ok) return;
      const j=await r.json(); const src=j.thumbnail&&j.thumbnail.source;
      if(src){ state.photos[p.id]=src; document.querySelectorAll(`.thumb[data-pid="${p.id}"]`).forEach(el=>{ if(!el.querySelector("img")) el.insertAdjacentHTML("beforeend",`<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer">`); }); }
    }catch(e){}
  }));
}
function addToggle(id){
  const i=state.tray.indexOf(id);
  if(i>=0){ state.tray.splice(i,1); state.visits=state.visits.filter(v=>v.id!==id); delete state.pins[id]; say(t("liveRemoved",{name:nm(P[id]),n:state.tray.length})); }
  else if(state.tray.length>=MAX_STOPS){ toast(t("full")); return false; }
  else { state.tray.push(id); state.skipped=state.skipped.filter(x=>x!==id); say(t("liveAdded",{name:nm(P[id]),n:state.tray.length})); }
  state.prev=null; render(); return true;
}
function removeStop(id){
  pushUndo(); state.tray=state.tray.filter(x=>x!==id); delete state.pins[id]; render({focus:"#vh"});
  toast(t("tRemoved",{name:nm(P[id])}),true);
}
function swapStop(id){
  const base=baseTags();
  const cands=PLACES.filter(p=>!state.tray.includes(p.id)).sort((a,b)=>base.reduce((s,x)=>s+b.tags[x],0)-base.reduce((s,x)=>s+a.tags[x],0));
  for(const c of cands){
    const next=state.tray.map(x=>x===id?c.id:x);
    if(fitsIn(plan(next),c.id)){
      pushUndo(); state.tray=next; delete state.pins[id]; render({focus:"#vh"});
      toast(t("tSwapped",{a:nm(P[id]),b:nm(c)}),true); return;
    }
  }
  toast(t("tNoSwap"));
}
function markDone(id){
  const pl=plan(), cur=pl.items.find(i=>!i.done);
  if(!cur||cur.id!==id) return;
  pushUndo();
  state.visits.push({id,start:cur.start,end:cur.end}); delete state.pins[id];
  state.suggest=true; state.rejected=[];
  render({focus:"#vh"}); toast(t("tDone",{name:nm(P[id])}),true);
}
function skipStop(id){
  pushUndo();
  state.tray=state.tray.filter(x=>x!==id); state.skipped.push(id); delete state.pins[id];
  state.suggest=true; state.rejected=[];
  render({focus:"#vh"}); toast(t("tSkipped",{name:nm(P[id])}),true);
}
function togglePin(id){
  pushUndo();
  if(state.pins[id]!=null){ delete state.pins[id]; render(); toast(t("tUnpinned",{name:nm(P[id])}),true); return; }
  const idx=plan().items.findIndex(i=>i.id===id);
  state.pins[id]=Math.max(0,idx); render(); toast(t("tPinned",{name:nm(P[id]),n:idx+1}),true);
}
function acceptSuggestion(id){
  if(state.tray.length>=MAX_STOPS){ toast(t("full")); return; }
  pushUndo(); state.tray.push(id); state.rejected=[]; render({focus:"#vh"}); toast(t("tSugAdded",{name:nm(P[id])}),true);
}
function diffLines(oldPl,newPl){
  const om=new Map(oldPl.items.map(i=>[i.id,i])), out=[];
  newPl.items.forEach(i=>{ const o=om.get(i.id); if(i.conflict && !(o&&o.conflict)){ out.push({cls:"bad",txt:t("skipped",{name:nm(P[i.id])})}); return; } if(!o) out.push({cls:"",txt:t("fits",{name:nm(P[i.id])})}); else if(o.start!==i.start) out.push({cls:"",txt:t("moved",{name:nm(P[i.id]),a:fmt(o.start),b:fmt(i.start)})}); });
  newPl.dropped.forEach(d=>{ if(!oldPl.dropped.some(x=>x.id===d.id)) out.push({cls:"bad",txt:t("skipped",{name:nm(P[d.id])})}); });
  return out;
}
const DELAYS=[30,60,120,240];
const delayLabel=n=>n<60?t("min",{n}):t("hr",{n:n/60});
function openSheet(){
  const cur=DELAYS.includes(state.delay)?state.delay:30;
  const sh=$("#sheet");
  sh.innerHTML=`<div class="sheet">
    <h2 id="sheet-title">${t("sheetTitle")}</h2>
    <fieldset class="opts"><legend>${t("sheetQ")}</legend>
      ${DELAYS.map(n=>`<label class="opt"><input type="radio" name="delay" value="${n}" ${n===cur?"checked":""}><span>${delayLabel(n)}</span></label>`).join("")}
    </fieldset>
    <div><h3>${t("changes")}</h3><ul class="diff" id="diff" aria-live="polite" data-testid="diff"></ul></div>
    <div class="sheet-actions"><button type="button" class="btn ghost" data-act="cancel">${t("cancel")}</button><button type="button" class="btn primary" data-act="apply" data-testid="apply">${t("apply")}</button></div>
  </div>`;
  const upd=()=>{
    const n=+sh.querySelector("input:checked").value;
    const lines=diffLines(plan(), plan(state.tray,n));
    sh.querySelector("#diff").innerHTML = lines.length ? lines.map(l=>`<li class="${l.cls}">${icon(l.cls?"alert":"clock")}<span>${esc(l.txt)}</span></li>`).join("") : `<li>${icon("check")}<span>${t("nochange")}</span></li>`;
  };
  sh.querySelectorAll("input").forEach(i=>i.addEventListener("change",upd)); upd();
  sh.showModal();
}
function applyDelay(){
  const sh=$("#sheet"); const n=+sh.querySelector("input:checked").value;
  sh.close(); pushUndo(); state.delay=n; render({focus:"#vh"}); toast(t("tReplanned"),true);
}
/* time at a place: 15-180 min, applies to the day plan immediately */
function setDur(id,v){
  const p=P[id]; if(!p) return;
  v=Math.max(15,Math.min(180,Math.round(v/5)*5));
  if(v===durOf(p)) return;
  pushUndo(); state.durs[id]=v;
  render(); say(t("tStay",{name:nm(p),n:t("dur",{n:v})}));
}
/* place photo: a geotagged Wikimedia Commons photo within 60 m (credited), else the Wikipedia photo, else a Mapbox aerial view of the exact spot */
const commonsCache=new Map();
function plainText(html){ return new DOMParser().parseFromString(html||"","text/html").body.textContent.trim(); }
async function commonsPhoto(p){
  if(commonsCache.has(p.id)) return commonsCache.get(p.id);
  let out=null;
  try{
    const u="https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch&ggscoord="+p.lat+"%7C"+p.lng+"&ggsradius=60&ggslimit=10&ggsnamespace=6&prop=imageinfo&iiprop=url%7Cextmetadata%7Cmime&iiurlwidth=800&iiextmetadatafilter=Artist%7CLicenseShortName&format=json&origin=*";
    const r=await fetch(u); if(!r.ok) throw new Error("commons");
    const j=await r.json();
    const pg=Object.values((j.query&&j.query.pages)||{}).filter(x=>x.imageinfo&&x.imageinfo[0]&&x.imageinfo[0].mime==="image/jpeg").sort((a,b)=>a.index-b.index)[0];
    if(pg){ const ii=pg.imageinfo[0], m=ii.extmetadata||{};
      out={kind:"commons", src:ii.thumburl||ii.url, credit:plainText(m.Artist&&m.Artist.value)||"Wikimedia Commons", lic:plainText(m.LicenseShortName&&m.LicenseShortName.value), href:ii.descriptionurl}; }
  }catch(e){}
  commonsCache.set(p.id,out); return out;
}

/* ---------- manual order: drag a stop by its handle, or focus the handle and press ↑ / ↓ ---------- */
const reducedMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function commitOrder(order,focusId){
  const doneIds=state.visits.filter(v=>state.tray.includes(v.id)).map(v=>v.id);
  const moved=order.filter(id=>!doneIds.includes(id));
  const current=plan().items.filter(i=>!i.done).map(i=>i.id);
  if(moved.join()===current.join()) return false;                         /* dropped back where it was: nothing changed */
  const rest=state.tray.filter(id=>!doneIds.includes(id)&&!moved.includes(id));   /* unscheduled stops stay at the end */
  pushUndo(); state.tray=[...doneIds,...moved,...rest]; state.manual=true;
  render({focus:`[data-fk="grip-${focusId}"]`});
  const pl=plan();
  say(t("tMoved",{name:nm(P[focusId]),n:pl.items.findIndex(i=>i.id===focusId)+1,m:pl.items.length}));
  return true;
}
function moveStop(id,dir){
  const ids=plan().items.filter(i=>!i.done).map(i=>i.id), i=ids.indexOf(id), j=i+dir;
  if(i<0) return;
  if(j<0||j>=ids.length){ say(t("moveEdge",{name:nm(P[id])})); return; }
  [ids[i],ids[j]]=[ids[j],ids[i]]; commitOrder(ids,id);
}
let rd=null;
function renumber(ol){
  [...ol.children].forEach((li,i)=>{ const d=li.querySelector(".dot:not(.done)"); if(d) d.textContent=i+1; const w=li.querySelector(".walkin"); if(w) w.hidden=(i===0); });
}
function rdPlace(y){ const base=rd.ol.getBoundingClientRect().top+rd.li.offsetTop; rd.li.style.transform=`translateY(${y-rd.grabY-base}px)`; }
function rdReorder(y){
  const {li,ol}=rd, centre=y-rd.grabY+li.offsetHeight/2, others=[...ol.children].filter(x=>x!==li);
  let idx=0; others.forEach(x=>{ const r=x.getBoundingClientRect(); if(centre>r.top+r.height/2) idx++; });
  idx=Math.max(idx,rd.locked);                                            /* visited stops stay on top */
  if(idx===[...ol.children].indexOf(li)) return;
  const before=new Map(others.map(x=>[x,x.getBoundingClientRect().top]));
  ol.insertBefore(li,others[idx]||null); renumber(ol);
  if(!reducedMotion()) others.forEach(x=>{                                /* neighbours glide into place (transform only) */
    const d=before.get(x)-x.getBoundingClientRect().top;
    if(d){ x.style.transition="none"; x.style.transform=`translateY(${d}px)`; x.getBoundingClientRect(); x.style.transition="transform 180ms var(--ease)"; x.style.transform=""; }
  });
}
function rdFollow(){
  if(!rd||!rd.active) return;
  const sc=$("#dayview"), r=sc.getBoundingClientRect();
  if(rd.y<r.top+48) sc.scrollTop-=10; else if(rd.y>r.bottom-48) sc.scrollTop+=10;   /* scroll while dragging near an edge */
  rdPlace(rd.y); rdReorder(rd.y); rdPlace(rd.y);
  rd.raf=requestAnimationFrame(rdFollow);
}
function rdEnd(commit){
  if(!rd) return;
  const d=rd; rd=null; cancelAnimationFrame(d.raf);
  try{ d.grip.releasePointerCapture(d.pointer); }catch(e){}
  if(!d.active) return;
  const order=[...d.ol.children].map(x=>x.dataset.pid);
  [...d.ol.children].forEach(x=>{ x.style.transform=""; x.style.transition=""; });
  d.li.classList.remove("lifting"); d.ol.classList.remove("reordering");
  if(!(commit && order.join()!==d.order0 && commitOrder(order,d.pid))) render({focus:`[data-fk="grip-${d.pid}"]`});
}
document.addEventListener("pointerdown",e=>{
  const grip=e.target.closest&&e.target.closest(".grip"); if(!grip||e.button>0) return;
  const li=grip.closest(".stop"), ol=li.parentElement;
  rd={li,ol,grip,pid:li.dataset.pid,pointer:e.pointerId,y:e.clientY,y0:e.clientY,grabY:e.clientY-li.getBoundingClientRect().top,
      locked:[...ol.children].filter(x=>x.classList.contains("done")).length,active:false,raf:0,order0:[...ol.children].map(x=>x.dataset.pid).join()};
  grip.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove",e=>{
  if(!rd||e.pointerId!==rd.pointer) return;
  rd.y=e.clientY;
  if(!rd.active){
    if(Math.abs(e.clientY-rd.y0)<4) return;
    rd.active=true; rd.li.classList.add("lifting"); rd.ol.classList.add("reordering"); rd.raf=requestAnimationFrame(rdFollow);

document.addEventListener("pointerup",e=>{ if(rd&&e.pointerId===rd.pointer) rdEnd(true); });

/* ---------- chat: messages are data, text is rendered from keys so the language switch re-translates the whole conversation ---------- */
let mid=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pushMsg=m=>{ m.id=++mid; state.msgs.push(m); return m; };
const msgVars=m=>typeof m.v==="function" ? m.v() : (m.v||{});
const liveResults=()=>[...state.msgs].reverse().find(m=>m.kind==="results")||null;
const snapshotResults=()=>visibleResults().map(r=>({id:r.id, m:matchPct(r), weak:isWeak(r)}));
function filterSummary(){

  if(f.price<3) a.push(priceTxt3(f.price));

const isPhone=()=>matchMedia("(max-width: 899px)").matches;

/* intents: plain regexes over the lower-cased text, Thai and English */
const RX={
  undo:/\bundo\b|ย้อนกลับ/, reset:/\breset\b|clear (the )?filters?|รีเซ็ต|ล้างตัวกรอง/,
  help:/what can you|\bhelp\b|ทำอะไรได้|ใช้ยังไง/, hello:/^(hi|hello|hey|สวัสดี|หวัดดี)[\s!.]*$/,
  sample:/sample|ตัวอย่าง/, share:/\bshare\b|แชร์/,
  late:/\blate\b(?! night)|running behind|\bdelay|ไปช้า|มาช้า|ช้ากว่า|ช้า\s*\d|สาย\s*\d/,
  done:/\bdone\b|finished|เสร็จแล้ว|ไปแล้ว/, skip:/\bskip\b|ข้าม/,
  plan:/\bplan\b|itinerary|whole day|full day|จัดวัน|ทั้งวัน|จัดทริป/,
  next:/\bnext\b|ไปไหนต่อ|ต่อไป|where (should|do) i go|ไปไหนดี/,
  filters:/\bfilters?\b|ตัวกรอง|กรอง/,
  cheaper:/cheaper|ถูกกว่า/, cheap:/cheap|budget|ถูก|ประหยัด/, free:/\bfree\b|ฟรี/,
  closer:/closer|nearer|nearby|\bnear\b|ใกล้/, open:/open (right )?now|open today|เปิดอยู่|เปิดตอนนี้/
};
const clampDelay=n=>Math.max(15,Math.min(240,Math.round(n/15)*15));
function parseDelay(s){
  let m=s.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|h\b|ชม|ชั่วโมง)/);
  if(m) return clampDelay(+m[1]*60);
  m=s.match(/(\d+)\s*(?:minutes?|mins?|m\b|นาที)/);
  if(m) return clampDelay(+m[1]);
  if(/an hour|หนึ่งชั่วโมง/.test(s)) return 60;
  return 30;
}
function applyMods(s){
  const f=state.filters; let changed=false;
  if(RX.cheaper.test(s)){ f.price=f.price>=3?1:Math.max(0,f.price-1); changed=true; }
  else if(RX.free.test(s)){ f.price=0; changed=true; }
  else if(RX.cheap.test(s)){ f.price=Math.min(f.price,1); changed=true; }
  if(RX.closer.test(s)){ f.dist=f.dist>=DIST_MAX?10:Math.max(3,f.dist-3); changed=true; }
  if(RX.open.test(s)){ f.open=true; changed=true; }
  if(changed) state.msgs.filter(m=>m.kind==="filters").forEach(m=>m.dirty=true);
  return changed;
}

/* the bot "types" for a moment, then each message lands in order */
let chain=Promise.resolve();
function reply(...ms){
  chain=chain.then(async()=>{
    for(const m of ms){
      state.typing=true; render(); await sleep(reducedMotion()?120:520);
      state.typing=false; pushMsg({role:"bot",fresh:true,...m}); render();
      if(m.k) say(t(m.k,msgVars(m)));
    }
  }).catch(e=>{ state.typing=false; console.error(e); });
  return chain;
}

function runSearch(q){
  state.parsed=parseQuery(q);
  const r=rank(q,state.parsed);
  state.results=r.list; state.mode=r.mode; state.searched=true;
  if(state.mode==="none" && state.parsed.cafe) state.mode="match";   /* "cafe" alone is a real request */
}
function doSearch(q,lead){
  state.query=q; runSearch(q);
  const items=snapshotResults(), msg={kind:"results",items,tags:[...baseTags()],shown:3,filt:filterSummary(),mode:state.mode,q};
  if(!items.length){ msg.k="rNoPass"; msg.chips=["reset"]; }
  else if(state.mode==="none"){ msg.k="rNone"; msg.v={q}; msg.chips=["cafe","street","art","old"]; }
  else if(state.mode==="empty"){ msg.k=lead||"rFoundAll"; msg.v=function(){ return {n:this.items.length}; }; }
  else { msg.k="rFound"; msg.v=function(){ return {n:this.items.length,q:this.q}; }; }

}
function refreshLive(){
  const m=liveResults();
  if(m){ m.items=snapshotResults(); m.filt=filterSummary(); }
  render();
}
function showFilters(){ state.msgs=state.msgs.filter(m=>m.kind!=="filters"); reply({kind:"filters",k:"rFilters"}); }
function resetFilters(){
  state.filters={price:3,dist:DIST_MAX,open:false};
  state.msgs.filter(m=>m.kind==="filters").forEach(m=>m.dirty=true);
  refreshLive(); reply({k:"rReset"});
}

/* a whole day from the current ranking: different types first, each stop must really fit */
function planIntent(){
  const dayV=()=>{ const p=plan(); return {n:p.items.length,t:fmt(p.finish)}; };
  if(state.tray.length){ reply({kind:"plan",k:"rDay",v:dayV}); return; }
  if(!state.results.length){ const r=rank("",{tags:[],cafe:false}); state.results=r.list; state.mode="empty"; }
  const picked=[], types=new Set();
  for(const pass of [0,1]){
    for(const r of visibleResults()){
      if(picked.length>=4) break;
      const p=P[r.id];
      if(picked.includes(p.id)||p.status!=="ok"||(pass===0&&types.has(p.type))) continue;
      const next=[...picked,p.id], pl=plan(next);
      if(next.every(id=>fitsIn(pl,id))){ picked.push(p.id); types.add(p.type); }
    }
  }
  if(!picked.length){ reply({k:"rPlanFail",chips:["reset"]}); return; }
  state.tray=picked; state.skipped=[]; state.visits=[]; state.pins={}; state.manual=false; state.delay=0; state.prev=null; state.rejected=[]; state.suggest=false;
  reply({kind:"plan",k:"rPlan",v:dayV});
}
function suggestReply(){
  const c=nextCandidates()[0], pl=plan();
  const ref=[...pl.items].reverse().find(i=>i.done)||pl.items[pl.items.length-1];
  if(!c){
    reply(state.tray.length>=MAX_STOPS ? {k:"full"} : {k:"sugNone",v:()=>({t:fmt(state.endMin),name:ref?nm(P[ref.id]):""})});
    return;
  }
  reply({kind:"suggest",k:"rNext",cid:c.p.id,w:c.w,left:c.left,refType:ref?P[ref.id].type:null,
    v:()=>({name:nm(c.p),w:t(state.routeDown?"walkApprox":"sugWalk",{n:c.w}),left:durText(Math.max(0,c.left))})});
}
function lateIntent(s){
  if(!state.tray.length){ reply({k:"rLateNeed"}); return; }
  const n=parseDelay(s), oldPl=plan();
  pushUndo(); state.delay=n;
  const newPl=plan();
  render();
  reply({kind:"lines",k:"rLate",v:()=>({d:n%60===0?t("hrs",{n:n/60}):t("dur",{n})}),linesFn:()=>diffLines(oldPl,newPl),undo:true});
}
function doneIntent(){
  const cur=plan().items.find(i=>!i.done);
  if(!cur){ reply({k:"rDoneNone"}); return; }
  markDone(cur.id);
  reply({k:"rDone",v:()=>({name:nm(P[cur.id])})}); suggestReply();
}
function skipIntent(){
  const cur=plan().items.find(i=>!i.done);
  if(!cur){ reply({k:"rSkipNone"}); return; }
  skipStop(cur.id);
  reply({k:"rSkip",v:()=>({name:nm(P[cur.id])})}); suggestReply();
}
function loadSample(){
  state.query=EXAMPLES[0][state.lang]; runSearch(state.query);
  state.filters={price:3,dist:DIST_MAX,open:false};
  /* stops that are open every day, so the sample works on any weekday */
  state.tray=["soheng","eiahsae","gulongbao","yoofish"]; state.skipped=[]; state.visits=[]; state.rejected=[];
  state.delay=0; state.startMin=600; state.endMin=1080; state.prev=null; state.routeDown=false; state.manual=false; state.pins={}; state.suggest=false;
  const first=plan().items[0];
  state.visits=[{id:first.id,start:first.start,end:first.end}];
  render();
  reply({kind:"plan",k:"rSample"}); suggestReply();
}
function handleText(raw){
  const text=String(raw).trim(); if(!text) return;
  pushMsg({role:"user",text,fresh:true}); render();
  const s=text.toLowerCase();
  if(RX.undo.test(s)){ if(state.prev){ undoLast(); reply({k:"rUndo"}); } else reply({k:"rUndoNone"}); return; }
  if(RX.reset.test(s)){ resetFilters(); return; }
  if(RX.help.test(s)){ reply({k:"rHelp",chips:["cafe","street","plan","next","late","share"]}); return; }
  if(RX.hello.test(s)){ reply({k:"rHello",chips:["cafe","street","open","plan"]}); return; }
  if(RX.sample.test(s)){ loadSample(); return; }
  if(RX.share.test(s)){
    if(!state.tray.length) reply({k:"rShareNeed"}); else reply({k:"rShare"}).then(openShare);
    return;
  }
  if(RX.late.test(s)){ lateIntent(s); return; }
  if(RX.done.test(s)){ doneIntent(); return; }
  if(RX.skip.test(s)){ skipIntent(); return; }
  if(RX.plan.test(s)){ planIntent(); return; }
  if(RX.next.test(s)){ if(state.tray.length) suggestReply(); else doSearch("","rStart"); return; }
  if(RX.filters.test(s)){ showFilters(); return; }
  const changed=applyMods(s), parsed=parseQuery(text);
  if(parsed.tags.length||parsed.cafe||!changed) doSearch(text);
  else doSearch(state.searched?state.query:"");     /* only a filter word: re-run the last search with it */

/* ?voice=demo swaps the browser's speech service for a pretend one that "hears" a sample phrase, so the voice flow can be tried without Google's service */
const DEMO_SAY={en:["quiet cafe, old walls","street food at night","art alleys and murals"],th:["คาเฟ่เงียบ ๆ ตึกเก่า","ของกินริมทางยามค่ำ","ซอยอาร์ต ภาพมูรัล"]};

/* Voice hears both languages, whatever the page language is: the page language goes first, and when the result is empty or unsure the other language is tried once (the browser can only listen in one language at a time) */
const VOICE_PREFS=["auto","th","en"];
let voicePref="auto"; try{ const v=localStorage.getItem("dayoff-voice"); if(VOICE_PREFS.includes(v)) voicePref=v; }catch(e){}
const voiceShort=()=>voicePref==="auto"?"Auto":voicePref==="th"?"ไทย":"EN";
const voiceDesc=()=>t(voicePref==="auto"?"voiceAuto":voicePref==="th"?"voiceTh":"voiceEn");
function cycleVoicePref(){
  voicePref=VOICE_PREFS[(VOICE_PREFS.indexOf(voicePref)+1)%VOICE_PREFS.length];
  try{ localStorage.setItem("dayoff-voice",voicePref); }catch(e){}
  const b=$("#vlang"); if(b){ b.textContent=voiceShort(); const l=t("voiceLang",{v:voiceDesc()}); b.setAttribute("aria-label",l); b.title=l; }
  toast(t("voiceLang",{v:voiceDesc()}));

const VOICE_CONF=0.9;
const voiceLangs=()=>voicePref==="th"?["th-TH"]:voicePref==="en"?["en-US"]:state.lang==="th"?["th-TH","en-US"]:["en-US","th-TH"];
const voiceName=code=>code==="th-TH"?(state.lang==="th"?"ภาษาไทย":"Thai"):(state.lang==="th"?"ภาษาอังกฤษ":"English");
function startListening(){
  if(!SR||listening) return;
  let best=null;
  const attempt=i=>{
    const code=voiceLangs()[i], last=i===voiceLangs().length-1;
    rec=new SR(); rec.lang=code; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
    let finalText="", interim="", conf=1, failed=false;
    rec.onresult=e=>{
      let txt="", c=[];
      for(let k=0;k<e.results.length;k++){ txt+=e.results[k][0].transcript; if(e.results[k].isFinal){ finalText=txt; const v=e.results[k][0].confidence; if(typeof v==="number"&&v>0) c.push(v); } }
      interim=txt; if(c.length) conf=Math.min(...c);
      msgBox.value=txt; fitBox();
    };
    rec.onerror=e=>{
      if(e.error==="no-speech"||e.error==="aborted") return;       /* handled in onend: try the other language, or say nothing was heard */
      failed=true;
      if(e.error==="not-allowed"||e.error==="service-not-allowed") toast(t("tMicBlocked")); else if(e.error==="network") toast(t(navigator.brave?"tMicBrave":"tMicNet"));
    };
    rec.onend=()=>{
      rec=null; const v=(finalText||interim).trim();
      if(failed){ listening=false; fitBox(); render(); return; }
      if(v&&(!best||conf>best.conf)) best={txt:v,conf};
      if(!last&&(!v||conf<VOICE_CONF)){
        toast(t("tMicRetry",{lang:voiceName(voiceLangs()[i+1])}));
        setTimeout(()=>{ try{ attempt(i+1); }catch(err){ listening=false; fitBox(); render(); } },900);
        return;
      }
      listening=false;
      if(best){ msgBox.value=""; fitBox(); handleText(best.txt); render(); } else { toast(t("tMicNone")); fitBox(); render(); }
    };
    try{ rec.start(); listening=true; msgBox.value=""; fitBox(); renderMic(); }catch(err){ listening=false; rec=null; fitBox(); render(); }
  };
  attempt(0);
}

  if(e.target.id==="fPrice"||e.target.id==="fDist"){
    const el=e.target, v=+el.value, min=+el.min, max=+el.max;
    el.style.setProperty("--p",((v-min)/(max-min)*100)+"%");
    if(el.id==="fPrice"){ state.filters.price=v; $("#fPrice-o").textContent=priceTxt3(v); }
    else { state.filters.dist=v; $("#fDist-o").textContent=distTxt(v); }
    refreshLive();                                      /* live: the latest list re-ranks while you drag */
  }
  else if(e.target.id==="stayR"){
    const el=e.target; el.style.setProperty("--p",((+el.value-15)/(180-15)*100)+"%"); $("#stayR-o").textContent=t("dur",{n:+el.value});
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="startSel"){ pushUndo(); state.startMin=+e.target.value; render(); toast(t("tStart"),true); }
  else if(e.target.id==="endSel"){ pushUndo(); state.endMin=+e.target.value; render(); toast(t("tEnd"),true); }
  else if(e.target.id==="stayR"){ setDur($("#sheet").dataset.pid,+e.target.value); }
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape"||e.defaultPrevented||$("#sheet").open) return;
  if(mapState()==="full"){ state.map="strip"; render({focus:"[data-fk='mb-full']"}); }
  else if(state.dayOpen) closeDay();
});
$("#sheet").addEventListener("click",e=>{ if(e.target===$("#sheet")) $("#sheet").close(); });
matchMedia("(max-width: 899px)").addEventListener("change",()=>{ lastFit=""; render(); });
new ResizeObserver(syncStack).observe($("#bottom"));
/* keep the live clock honest without re-rendering the page */
setInterval(()=>{ if(!params.get("at")){ const n=bangkokNow(); if(n.dow!==state.now.dow){ state.now=n; applyHours(); render(); } else { state.now=n; } $("#liveClock").textContent=clockText(); } },30000);

applyTheme(state.theme,false);
initMap();
pushMsg({role:"bot",kind:"greet",k:"greet"});
render();
loadPhotos();
</script>
</body>
</html>

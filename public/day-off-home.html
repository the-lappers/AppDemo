<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day-Off · Home</title>
<meta name="description" content="Describe a vibe, get a one-day walking route for Yaowarat, Song Wat and Talat Noi.">
<meta name="theme-color" content="#ffffff">
<script>
/* Resolve the theme before first paint so there is no flash. */
(function(){
  var p="system";
  try{ p=localStorage.getItem("dayoff-theme")||"system"; }catch(e){}
  if(!/^(light|dark|system)$/.test(p)) p="system";
  var dark = p==="dark" || (p==="system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  var r=document.documentElement; r.dataset.theme=dark?"dark":"light"; r.dataset.themePref=p;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#F4F5F7; --card:#FFFFFF; --line:#E4E7EC; --track:#D9DDE4;
  --ink:#1B2233; --ink-2:#596273; --on-ink:#FFFFFF;
  --accent:#C93520; --accent-d:#AE2C1A; --on-accent:#FFFFFF;
  --warn:#B3261E; --gold:#E3AE3C; --gold-soft:#FBF0D4; --on-gold:#1B2233;
  --pill:#1B2233; --on-pill:#FFFFFF; --done:#6B7384;
  --toast-bg:#1B2233; --toast-fg:#FFFFFF; --toast-act:#F2C265;
  --scrim:rgba(27,34,51,.45);
  --shadow:0 1px 2px rgba(27,34,51,.06),0 6px 16px -8px rgba(27,34,51,.14);
  --ease:cubic-bezier(.23,1,.32,1);
  --f-head:'Mitr','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --header-h:56px; --tap:36px; --tap-sm:32px; --gutter:16px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
}
@media (pointer:coarse){:root{--tap:44px;--tap-sm:44px}}
@media (min-width:900px){:root{--gutter:32px}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111418; --surface:#181C22; --card:#1E232A; --line:#2D343E; --track:#3A424E;
  --ink:#EDF0F4; --ink-2:#A9B1BD; --on-ink:#111418;
  --accent:#FF8A75; --accent-d:#FFA08E; --on-accent:#1A0B08;
  --warn:#FF9488; --gold:#E3AE3C; --gold-soft:#3A3115; --on-gold:#1B2233;
  --pill:#EDF0F4; --on-pill:#111418; --done:#8C94A2;
  --toast-bg:#EDF0F4; --toast-fg:#1B2233; --toast-act:#8A3A00;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 0 0 1px rgba(255,255,255,.04);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--header-h) + var(--tap) + 16px);scroll-padding-bottom:96px}
.view{scroll-padding:16px}
body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);caret-color:var(--accent);overflow-wrap:anywhere}
::selection{background:var(--gold);color:var(--on-gold)}
*{scrollbar-width:thin;scrollbar-color:var(--track) transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;text-wrap:balance}
h1,h2{font-family:var(--f-head);font-weight:500}
h3{font-weight:600}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
dl,dd{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* header */
.header{position:sticky;top:0;z-index:30;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:0 var(--gutter);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:var(--s2);font:500 20px/1 var(--f-head);white-space:nowrap}
.brand-mark rect.f{fill:var(--ink)} .brand-mark g{fill:var(--bg)} .brand-mark circle{fill:var(--accent)}
.hctl{display:flex;align-items:center;gap:var(--s3)}
.live{display:none;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
#themeSlot{display:contents}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:2px}
.seg button{min-width:var(--tap);min-height:var(--tap);border:0;border-radius:999px;background:transparent;font-weight:600;font-size:13px;display:grid;place-items:center;padding:0 var(--s2);transition:background-color 160ms var(--ease)}
.seg button[aria-pressed="true"]{background:var(--pill);color:var(--on-pill)}
.seg-full{display:none}
.hlink{width:var(--tap);height:var(--tap);flex:none;border-radius:50%;display:grid;place-items:center;text-decoration:none;transition:transform 160ms var(--ease),background-color 160ms var(--ease)}
.hlink .ico{width:20px;height:20px}
.hlink:active{transform:scale(.94)}
.hlink.primary{background:var(--accent);color:var(--on-accent)}
.fabs{position:fixed;right:var(--gutter);bottom:calc(var(--s4) + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:var(--s3)}
.hlink.fab{width:52px;height:52px;box-shadow:0 6px 18px -4px rgba(27,34,51,.4)}
.hlink .ico{display:block;margin:0}
.hlink.fab .ico{width:24px;height:24px}
/* phone: the button would sit on top of the list's + buttons, so it only shows on the first screen and when the sheet is lowered to the map */
@media (max-width:899px){body.has-dock .fabs{bottom:calc(var(--s4) + 76px + env(safe-area-inset-bottom))}
.fabs{display:none}body[data-view="describe"] .fabs,body:has(#panel[data-st="map"]) .fabs{display:flex}}
.hlink.soft{background:var(--surface);color:var(--ink)}
@media (hover:hover) and (pointer:fine){.hlink.primary:hover{background:var(--accent-d)}.hlink.soft:hover{background:var(--track)}}
.theme-cycle{min-width:var(--tap);min-height:var(--tap);border:0;border-radius:50%;background:var(--surface);display:grid;place-items:center}
@media (min-width:560px){.seg-full{display:flex}.theme-cycle{display:none}}
@media (min-width:700px){.live{display:inline-flex}}

/* layout: desktop = information 55% | map 45%. phone = full-screen map with a draggable bottom sheet */
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"tabs" "stage";height:calc(100dvh - var(--header-h));overflow:hidden;background:var(--surface)}
.tabs[hidden]{display:none}
.tabs{grid-area:tabs;position:relative;z-index:6;display:flex;gap:var(--s5);padding:0 var(--gutter);background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{display:inline-flex;align-items:center;justify-content:flex-start;min-height:var(--tap);min-width:var(--tap);padding:0;border:0;border-bottom:2px solid transparent;background:transparent;font-weight:500;color:var(--ink-2);margin-bottom:-1px}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
.mapcol{grid-area:stage;position:relative;min-height:0;background:var(--surface);isolation:isolate}
body[data-view="describe"] .mapcol{display:none}
#map{position:absolute;inset:0;background:var(--surface)}
.mapfail{padding:var(--s5);color:var(--ink-2)}
/* the sheet resizes its scroll area, so height (not transform) is animated: only on release, never while dragging, never under reduced motion */
.panel{grid-area:stage;align-self:end;position:relative;z-index:5;display:flex;flex-direction:column;height:var(--sheet-h,100%);max-height:100%;min-height:0;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px -8px rgba(27,34,51,.3);transition:height 260ms var(--ease)}
.panel.dragging{transition:none}
body[data-view="describe"] .panel{border-radius:0;box-shadow:none}
.grab{flex:none;display:grid;place-items:center;width:100%;height:var(--tap);border:0;background:transparent;touch-action:none;cursor:grab;border-radius:20px 20px 0 0}
.grab span{width:40px;height:4px;border-radius:2px;background:var(--track)}
body[data-view="describe"] .grab{display:none}
.view{flex:1 1 auto;min-height:0;min-width:0;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);padding:var(--s2) var(--gutter) var(--s5);outline:0;scroll-padding:16px}
body[data-view="describe"] .view{padding-top:var(--s5)}
.panel[data-st="peek"] .view{overflow:hidden}
.inner{max-width:760px;margin:0 auto;display:grid;gap:var(--s5)}
.dock{flex:none;background:var(--bg);border-top:1px solid var(--line);padding:var(--s3) var(--gutter) calc(var(--s3) + env(safe-area-inset-bottom))}
.dock[hidden]{display:none}
.dock-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.dock-txt strong{display:block;font-weight:600;line-height:1.35}
.dock-txt span{font-size:13px;color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s4);border-radius:999px;border:1px solid transparent;font:600 14px/1 var(--f-body);white-space:nowrap;transition:transform 160ms var(--ease),background-color 160ms var(--ease),opacity 160ms}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--pill);color:var(--on-pill)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--track)}
.btn.small{min-height:var(--tap-sm);padding:0 var(--s3);font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover) and (pointer:fine){
  .btn.primary:hover{background:var(--accent-d)} .btn.dark:hover{opacity:.88} .btn.ghost:hover{background:var(--surface)}
  .chip:hover{background:var(--surface)} .add:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)} .linkbtn:hover{background:var(--bg)}
  .seg button:hover:not([aria-pressed="true"]){background:var(--track)} .theme-cycle:hover{background:var(--track)}
}
.linkbtn{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap-sm);padding:0 var(--s2);border:0;background:transparent;border-radius:var(--s2);color:var(--ink);font-weight:600;font-size:13px;text-decoration:underline;text-decoration-color:var(--track);text-underline-offset:3px}
.linkbtn[aria-pressed="true"]{background:var(--bg)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,currentColor 35%,transparent);border-top-color:currentColor;animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap-sm);padding:0 var(--s3);border-radius:999px;border:1px solid var(--track);background:var(--card);font:500 13px/1.2 var(--f-body);transition:background-color 160ms var(--ease),transform 160ms var(--ease)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--pill);color:var(--on-pill);border-color:var(--pill)}
.chiprow{display:flex;flex-wrap:wrap;gap:var(--s2)}

/* type */
h1{font-size:28px;line-height:1.3}
h2{font-size:20px;line-height:1.35}
.sub{color:var(--ink-2);font-size:14px}
.hint{font-size:13px;color:var(--ink-2)}
.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:var(--s2)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow)}

/* describe */
.hero{display:grid;gap:var(--s2)}
.compose{padding:var(--s5);display:grid;gap:var(--s4)}
textarea{width:100%;min-height:92px;resize:none;padding:var(--s3) var(--s4);border:1px solid var(--track);border-radius:12px;background:var(--bg);font-size:15px;line-height:1.55}
textarea::placeholder{color:var(--ink-2);opacity:1}
textarea:focus-visible{outline-offset:0;border-color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3)}
.source{display:flex;gap:var(--s2);align-items:flex-start;font-size:13px;color:var(--ink-2)}
.source .ico{margin-top:3px}

/* notices */
.notice{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:14px}
.notice.warn{background:var(--gold-soft);box-shadow:none}
.notice .ico{margin-top:3px}
.notice .chiprow{margin-top:var(--s2)}

/* results */
.res-head{display:grid;gap:var(--s1)}
.matched{display:flex;flex-wrap:wrap;gap:var(--s2)}
.pill{display:inline-flex;align-items:center;padding:2px var(--s3);border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:500}
.filters{padding:var(--s4) var(--s5);display:grid;gap:var(--s4)}
.sliders{display:grid;gap:var(--s4) var(--s5);grid-template-columns:1fr}
@media (min-width:700px){.sliders{grid-template-columns:1fr 1fr}}
.slider{display:grid;gap:var(--s2)}
.slider .top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);font-size:13px}
.slider label{font-weight:600}
.slider output{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--ink) var(--p,0%),var(--track) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--card);border:2px solid var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--ink);outline-offset:3px}
input[type=range]:focus-visible::-moz-range-thumb{outline:2px solid var(--ink);outline-offset:3px}
@media (pointer:coarse){input[type=range]{height:36px}input[type=range]::-webkit-slider-thumb{width:24px;height:24px;margin-top:-10px}}
.rows{display:grid;gap:var(--s3)}
.row{position:relative;padding:0;overflow:hidden;transition:box-shadow 160ms var(--ease)}
.row .thumb{width:100%;height:168px;border-radius:0}
.row .thumb .ico{width:36px;height:36px}
.row .thumb .best{position:absolute;left:var(--s3);top:var(--s3);z-index:1}
.row-body{padding:var(--s4)}
.row[data-in="true"]{box-shadow:0 0 0 2px var(--ink)}
.row-main{display:grid;gap:0}
.rc{min-width:0;padding:var(--s4) var(--s4) 0}
.thumb{position:relative;width:64px;height:64px;border-radius:12px;display:grid;place-items:center;color:var(--ic,#fff);background:var(--t);overflow:hidden}
.thumb .ico{width:24px;height:24px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tone-ink{--t:#1B2233} .tone-red{--t:#C93520} .tone-slate{--t:#4B5568} .tone-gold{--t:#E3AE3C;--ic:#1B2233}
:root[data-theme="dark"] .tone-ink{--t:#3A4659}
.name-line{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s2)}
.name-line h3{font-size:16px;line-height:1.4}
.best{background:var(--gold);color:var(--on-gold);font-size:12px;font-weight:600;padding:0 var(--s2);border-radius:6px;line-height:1.6}
.best.alt{background:var(--surface);color:var(--ink);border:1px solid var(--track)}
.st{display:inline-flex;align-items:center;gap:4px;padding:0 var(--s2);border-radius:6px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;line-height:1.6}
.st .ico{width:12px;height:12px}
.st.warn{background:var(--gold-soft)}
.st.done{background:var(--done);color:var(--bg)}
.meta{font-size:13px;color:var(--ink-2);margin-top:2px}
.vibes{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);margin-top:var(--s3)}
.vibe{display:inline-flex;align-items:center;gap:var(--s2);font-size:13px}
.vibe .vs{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.slats{display:inline-flex;gap:2px}
.slats i{width:9px;height:6px;border-radius:2px;background:var(--track);transform-origin:left center}
.slats i.on{background:var(--ink)}
.scored .slats i.on{animation:slat 380ms var(--ease) backwards;animation-delay:calc(var(--r)*90ms + var(--i)*30ms)}
@keyframes slat{from{transform:scaleX(.2);opacity:0}}
.evid{font-size:12px;color:var(--ink-2);margin-top:var(--s2)}
.add{position:absolute;inset:0;z-index:0;border:0;border-radius:16px;background:transparent;cursor:pointer;transition:background-color 160ms var(--ease)}
.add:active{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.add:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sel{position:absolute;top:var(--s3);right:var(--s3);z-index:1;width:28px;height:28px;border-radius:50%;background:var(--pill);color:var(--on-pill);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity 160ms var(--ease),transform 160ms var(--ease);pointer-events:none}
.sel .ico{width:14px;height:14px;stroke-width:3}
.row[data-in="true"] .sel{opacity:1;transform:none}
.row-acts,.more{position:relative;z-index:1;pointer-events:none}
.row-acts button{pointer-events:auto}
.why1{font-size:13px;margin-top:var(--s2)}
.tap{color:var(--ink-2);font-size:13px}
.row-acts{display:flex;flex-wrap:wrap;gap:0 var(--s2);margin:var(--s2) var(--s4) var(--s3)}
.matchl{font-size:13px;margin-top:var(--s2)}
.why{display:inline-flex;align-items:center;gap:4px;min-height:var(--tap-sm);padding:0 var(--s2) 0 0;border:0;background:transparent;font-weight:600;font-size:13px;text-decoration:underline;text-decoration-color:var(--track);text-underline-offset:3px}
.why .ico{width:14px;height:14px;transition:transform 200ms var(--ease)}
.why[aria-expanded="true"] .ico{transform:rotate(180deg)}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows 220ms var(--ease);margin:0 var(--s4)}
.more.open{grid-template-rows:1fr}
.more>div{overflow:hidden}
.more .body{display:grid;gap:var(--s2);padding:var(--s1) 0 0;font-size:13px;color:var(--ink-2)}
.more .body p{display:flex;gap:var(--s2);align-items:flex-start}
.more .body .ico{margin-top:3px}
.row.flash{animation:flash 900ms var(--ease)}
@keyframes flash{from{box-shadow:0 0 0 3px var(--gold)}}
.empty{padding:var(--s5);display:grid;gap:var(--s3);justify-items:start}
.empty p{color:var(--ink-2)}

/* day */
.day-head{display:grid;gap:var(--s3)}
.day-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:var(--s3)}
.head-acts{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.day-meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);align-items:center}
.field{display:flex;align-items:center;gap:var(--s2);font-size:13px}
.field label{font-weight:600}
select{min-height:var(--tap-sm);padding:0 var(--s3);border:1px solid var(--track);border-radius:999px;background:var(--card);font-weight:500;font-size:13px}
.sum{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s5);font-size:14px}
.sum>div{display:flex;gap:6px;align-items:baseline}
.sum dt{color:var(--ink-2)}
.sum dd{font-weight:600;font-variant-numeric:tabular-nums}
.sum dd small{color:var(--ink-2);font-weight:400;margin-left:4px}
.late-chip{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);padding:2px var(--s3);border-radius:999px;font-weight:600;font-size:13px;justify-self:start}
.suggest{padding:var(--s4) var(--s5);display:grid;gap:var(--s3)}
.suggest h3{display:flex;gap:var(--s2);align-items:center;font-size:14px;color:var(--ink-2)}
.suggest .pick h3{font-size:16px;color:var(--ink)}
.suggest .facts{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);font-size:13px}
.suggest .facts span{display:inline-flex;gap:6px;align-items:center}
.suggest .rank{font-size:12px;color:var(--ink-2)}
.sug-acts{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.timeline{position:relative;padding:var(--s4) var(--s4) var(--s2)}
.stop{background:var(--card);border-radius:12px}
.stop .walkin,.stop .srow{display:grid;grid-template-columns:44px 24px minmax(0,1fr);column-gap:var(--s3)}
.stop .walkin[hidden]{display:none}
.rail{position:relative;display:flex;justify-content:center}
.rail::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--track)}
.srow .rail::after{width:4px;margin-left:-2px;border-radius:2px;background:var(--pill)}
.stop.done .srow .rail::after{background:var(--done)}
.walkin .rail::after{background:repeating-linear-gradient(180deg,var(--track) 0 4px,transparent 4px 8px)}
.stop:first-child .srow .rail::after{top:12px}
.stop:last-child .srow .rail::after{bottom:auto;height:12px}
.dot{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:500 12px/1 var(--f-head);box-shadow:0 0 0 3px var(--card)}
.dot.done{background:var(--done);color:var(--bg)}
.dot .ico{width:12px;height:12px;stroke-width:3}
.time{font:500 14px/24px var(--f-head);font-variant-numeric:tabular-nums;white-space:nowrap}
.stop.done .time,.stop.done h3{color:var(--ink-2)}
.stop-body{position:relative;min-width:0;padding-bottom:var(--s3)}
.stop-body h3{font-size:15px;line-height:24px}
.stop-chips{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);margin-top:var(--s1)}
.note{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--ink-2);margin-top:var(--s1)}
.note .ico{margin-top:2px;width:14px;height:14px}
.note.warn{color:var(--warn);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);margin-top:var(--s2)}
.walk-body{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) 0 var(--s3);font-size:13px;color:var(--ink-2)}
.rm,.ibtn{width:var(--tap-sm);height:var(--tap-sm);flex:none;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;color:var(--ink-2)}
.ibtn[aria-pressed="true"]{color:var(--accent)} .ibtn[aria-pressed="true"] .ico{fill:currentColor}
/* the tools sit top-right beside the name only; notes, stepper and buttons below use the full width, so nothing overflows the card on a phone */
.stop-tools{position:absolute;top:calc((24px - var(--tap-sm)) / 2);right:0;display:flex;align-items:flex-start}
.stop:not(.done) .stop-body h3{padding-right:calc(var(--tap-sm) * 3 + var(--s2))}
/* manual ordering */
.grip{touch-action:none;cursor:grab}
.grip:active{cursor:grabbing}
/* the lifted stop gets breathing room on every side: a card-coloured ring (no layout change, so the list does not jump) plus a soft shadow */
.stop.lifting{position:relative;z-index:4;cursor:grabbing;border-radius:16px;box-shadow:0 0 0 12px var(--card),0 14px 32px 8px rgba(27,34,51,.26)}
:root[data-theme="dark"] .stop.lifting{box-shadow:0 0 0 12px var(--card),0 14px 32px 8px rgba(0,0,0,.55)}
.timeline.reordering{user-select:none;-webkit-user-select:none}
.timeline.reordering .stop:not(.lifting) .time,.timeline.reordering .walk-body{opacity:.35}
@media (hover:hover) and (pointer:fine){.rm:hover,.ibtn:hover{background:var(--surface)} .rm:hover{color:var(--warn)}}
.nofit,.skipbox{padding:var(--s4) var(--s5)}
.nofit h3,.skipbox h3{display:flex;gap:var(--s2);align-items:center;font-size:14px}
.nofit h3{color:var(--warn)}
.nofit ul,.skipbox ul{margin-top:var(--s2)}
.nofit li,.skipbox li{display:flex;justify-content:space-between;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-top:1px solid var(--line)}
.nofit li:first-child,.skipbox li:first-child{border-top:0}
.day-foot{display:flex;justify-content:flex-start}

/* sheet */
dialog{border:0;padding:0;background:transparent;max-width:none;margin:auto auto 0;width:100%;color:var(--ink)}
dialog::backdrop{background:var(--scrim)}
dialog[open]{animation:sheetin 240ms var(--ease)}
dialog[open]::backdrop{animation:fade 200ms ease-out}
@keyframes sheetin{from{transform:translateY(16px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);border-radius:20px 20px 0 0;padding:var(--s5);max-width:560px;margin:0 auto;display:grid;gap:var(--s4);overscroll-behavior:contain;max-height:88dvh;overflow:auto;padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom))}
.sheet h2{font-size:20px}
.sheet h3{font-size:14px;margin-bottom:var(--s2)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);border:0;padding:0;margin:0}
.opts legend{font-weight:600;font-size:14px;margin-bottom:var(--s2);padding:0}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;justify-content:center;min-height:var(--tap);border:1px solid var(--track);border-radius:999px;font-weight:600;font-size:13px;transition:background-color 160ms var(--ease)}
.opt input:checked+span{background:var(--pill);color:var(--on-pill);border-color:var(--pill)}
.opt input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.diff{display:grid;gap:var(--s2);background:var(--surface);border-radius:12px;padding:var(--s3) var(--s4);font-size:14px}
.diff li{display:flex;gap:var(--s2);align-items:flex-start}
.diff .ico{margin-top:3px}
.diff .bad{color:var(--warn);font-weight:600}
.sheet-actions{display:flex;justify-content:flex-end;gap:var(--s2)}
.axes{display:grid;gap:var(--s2)}
.axes li{display:grid;grid-template-columns:minmax(76px,auto) auto 1fr;gap:var(--s3);align-items:center;font-size:13px}
.axes .mn{color:var(--ink-2);font-size:12px;text-align:right}
.rev{display:grid;gap:var(--s2);font-size:13px;color:var(--ink-2)}
.srcline{display:flex;gap:var(--s2);align-items:flex-start;font-size:12px;color:var(--ink-2)}
.srcline .ico{margin-top:2px;width:14px;height:14px}
.linkrow{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.linkrow code{flex:1;min-width:0;background:var(--surface);border-radius:999px;padding:var(--s2) var(--s4);font:500 13px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.votes{display:grid}
.votes li{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s2) 0;border-top:1px solid var(--line);font-size:14px}
.votes li:first-child{border-top:0}
.vt{display:grid;gap:4px;justify-items:end;min-width:104px}
.vbar{display:flex;width:88px;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.vbar .up{background:var(--ink)} .vbar .dn{background:var(--accent)}
.vt .vs{font-size:12px;color:var(--ink-2)}

/* toast */
.toasts{position:fixed;left:var(--gutter);right:var(--gutter);bottom:84px;z-index:40;display:flex;justify-content:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:var(--s2);max-width:420px;width:100%;background:var(--toast-bg);color:var(--toast-fg);border-radius:12px;padding:var(--s1) var(--s1) var(--s1) var(--s4);font-size:14px;box-shadow:0 12px 28px -10px rgba(0,0,0,.4);animation:toastin 200ms var(--ease)}
.toast span{flex:1;padding:var(--s2) 0}
.toast button{min-height:var(--tap);padding:0 var(--s3);border:0;border-radius:8px;background:transparent;color:var(--toast-act);font-weight:600}
.toast :focus-visible{outline-color:var(--toast-fg)}
@keyframes toastin{from{transform:translateY(8px);opacity:0}}

/* map pins (Leaflet divIcons) */
.leaflet-container{font:inherit;background:var(--surface)}
:root[data-theme="dark"] #map[data-tiles="osm"] .leaflet-tile-pane,:root[data-theme="dark"] #map[data-tiles="carto"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
.leaflet-control-attribution{font-size:11px}
.pin{display:grid;place-items:center;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);color:#fff;font:500 12px/1 var(--f-head);transition:transform 160ms var(--ease)}
.pin.res{width:16px;height:16px;background:var(--accent)}
.pin.tray{width:16px;height:16px;background:#1B2233}
.pin.num{width:26px;height:26px;background:var(--accent);color:var(--on-accent)}
.pin.num.done{background:var(--done);color:#fff}
.pin.faint{width:9px;height:9px;background:#9AA3B2;border-width:1.5px}
.pin.best{box-shadow:0 0 0 4px var(--gold),0 1px 4px rgba(0,0,0,.35)}
.pinbox{width:100%;height:100%;display:grid;place-items:center}
.leaflet-marker-icon:focus-visible .pin,.leaflet-marker-icon:hover .pin{transform:scale(1.2)}
.leaflet-marker-icon:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:50%}
@media (pointer:coarse){.leaflet-bar a{width:44px;height:44px;line-height:44px}}

/* phone: first screen alignment */
.hero h1 .w{display:inline-block;white-space:pre;animation:wordIn 520ms var(--ease) backwards;animation-delay:calc(var(--i)*70ms + 120ms)}
@keyframes wordIn{from{opacity:0;transform:translateY(6px);filter:blur(4px)}}
@media (prefers-reduced-motion:reduce){.hero h1 .w{animation:none}}
/* describe: voice and time budget */
.ta{position:relative}
.ta textarea{padding-right:124px}
.vlang{position:absolute;bottom:var(--s2);right:calc(var(--tap) + var(--s3));min-width:var(--tap);height:var(--tap);padding:0 var(--s2);border:0;border-radius:999px;background:transparent;color:var(--ink-2);font:600 12px/1 var(--f-body)}
.vlang:hover{color:var(--ink)}
.micbtn{position:absolute;right:var(--s2);bottom:var(--s2);width:var(--tap);height:var(--tap);border-radius:50%;border:0;background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--track);display:grid;place-items:center;transition:background-color 160ms var(--ease),transform 160ms var(--ease)}
.micbtn:active{transform:scale(.94)}
.micbtn .ico{width:20px;height:20px}
.micbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none;animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{50%{opacity:.72}}
@media (prefers-reduced-motion:reduce){.micbtn[aria-pressed="true"]{animation:none}}
.bud{display:grid;gap:var(--s2)}
.bud .chiprow{align-items:center}
.bud select{margin-left:auto}
/* day: now card and day bar */
.now{padding:var(--s4) var(--s5);display:grid;gap:var(--s3)}
.now .k{display:flex;gap:var(--s2);align-items:center;font-size:13px;font-weight:600;color:var(--ink-2)}
.now h3{font-size:18px;line-height:1.35}
.now .facts{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);font-size:13px}
.now .facts span{display:inline-flex;gap:6px;align-items:center}
.now .go{font-weight:600}
.daybar{padding:var(--s4) var(--s4) var(--s3);display:grid;gap:var(--s2)}
.db{display:flex;gap:2px;height:28px;align-items:stretch}
.db>span{min-width:3px;border-radius:6px;display:grid;place-items:center;font:500 11px/1 var(--f-head);overflow:hidden}
.db .s{background:var(--pill);color:var(--on-pill)}
.db .s.cur{background:var(--accent);color:var(--on-accent)}
.db .s.dn{background:var(--done);color:var(--bg)}
.db .s.x{background:var(--gold);color:var(--on-gold)}
.db .w{align-self:center;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--track) 0 3px,transparent 3px 6px)}
.db .f{border:1.5px dashed var(--track);color:var(--ink-2);font-family:var(--f-body);font-size:11px;font-weight:500}
.dbr{display:flex;justify-content:space-between;gap:var(--s3);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fits{justify-self:start}
.askfab{position:fixed;left:50%;bottom:calc(var(--s4) + env(safe-area-inset-bottom));z-index:60;width:56px;height:56px;margin-left:-28px;border:0;border-radius:50%;background:var(--pill);color:var(--on-pill);display:none;place-items:center;box-shadow:0 6px 18px -4px rgba(27,34,51,.45);transition:transform 160ms var(--ease),background-color 160ms var(--ease)}
.askfab:active{transform:scale(.94)}
.askfab .ico{width:24px;height:24px}
.askfab[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
body[data-view="now"] .askfab{display:grid}
body:has(#panel[data-st="peek"]) .askfab{display:none}
dialog.picker{margin:0;inset:0;width:100%;max-width:none;height:100dvh;max-height:none;background:var(--surface)}
.pick-in{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;max-width:760px;margin:0 auto;background:var(--surface)}
.pick-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) var(--gutter);background:var(--bg);border-bottom:1px solid var(--line)}
.pick-head h2{font-size:20px}
.pick-body{overflow:auto;overscroll-behavior:contain;padding:var(--s4) var(--gutter) var(--s5)}
.daybar-fix{position:fixed;left:0;right:0;bottom:0;z-index:70;padding:var(--s2) var(--gutter) calc(var(--s2) + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -6px 20px -10px rgba(27,34,51,.35)}
.daybar-fix[hidden]{display:none}
.daybar-fix .daybar{max-width:760px;margin:0 auto;padding:0;border:0;box-shadow:none;background:transparent}
body.has-daybar .app{height:calc(100dvh - var(--header-h) - var(--dbh,0px))}
body.has-daybar .askfab{bottom:calc(var(--s4) + var(--dbh,0px) + env(safe-area-inset-bottom))}
.homeloc{display:grid;gap:var(--s1);padding:var(--s4) var(--s5);border-radius:16px;background:var(--card);border:1px solid var(--line)}
.homeloc h2{font-size:20px}
.homeloc .sub{font-size:14px;color:var(--ink-2)}
.homeacts{display:flex;flex-wrap:wrap;gap:var(--s2)}
.home-sec{font-size:16px;margin-top:var(--s2)}
.planner{position:fixed;inset:0;z-index:3000;background:var(--bg);display:grid;grid-template-rows:minmax(0,1fr)}
.planner[hidden]{display:none}
.planner iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.vlink{justify-self:start;font-size:13px}
.mapcol{position:relative}
.navbar{position:absolute;z-index:1100;top:30px;left:56px;right:8px;display:grid;gap:var(--s2);padding:var(--s3) var(--s4);border-radius:14px;background:var(--pill);color:var(--on-pill);box-shadow:0 8px 24px -6px rgba(0,0,0,.45)}
.navbar[hidden],.nav-acts [hidden]{display:none}
.nav-main{display:flex;gap:var(--s3);align-items:center}
.nav-ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:20px;line-height:1}
.nav-txt{font-weight:600;font-size:15px;line-height:1.35}
.nav-meta{font-size:13px;opacity:.8;font-variant-numeric:tabular-nums}
.nav-prog{height:4px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden}
.nav-prog i{display:block;height:100%;width:0;background:var(--accent);transition:width 240ms linear}
.nav-acts{display:flex;gap:var(--s2);flex-wrap:wrap}
.nav-demo{font-size:12px;opacity:.7}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2);margin-top:var(--s3)}
.modes button{display:grid;gap:2px;justify-items:center;align-content:center;min-height:64px;padding:var(--s2) var(--s1);border:1px solid var(--track);border-radius:12px;background:transparent;font-size:12px;color:var(--ink-2);transition:background-color 160ms var(--ease)}
.modes button b{font-size:13px;color:var(--ink)}
.modes button small{font-size:11px;line-height:1}
.modes .mi{width:22px;height:22px}
.modes button[aria-pressed="true"]{background:var(--pill);border-color:var(--pill);color:var(--on-pill)}
.modes button[aria-pressed="true"] b{color:var(--on-pill)}
.modes button:disabled{opacity:.45}
.modes button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.routeline{font-size:13px;color:var(--ink-2);margin-top:var(--s2)}
.nowpage{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.ask{display:grid;gap:var(--s3)}
.ask-sum{font-size:13px;color:var(--ink-2)}
.ask-lead{font-weight:600;font-size:14px}
.ask-list{display:grid;gap:var(--s2)}
.ask-list .idea-card h4{font-size:15px}
a.btn{text-decoration:none}
.nowhead{display:grid;gap:var(--s2)}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--track)}
.prog i.d{background:var(--done)}
.prog i.c{background:var(--accent)}
.nowc .acts{display:flex;flex-wrap:wrap;gap:var(--s2)}
.nowc h3.sm{font-size:14px;color:var(--ink-2)}
.upnext{display:grid;gap:var(--s2);padding:0;margin:0;list-style:none}
.upnext li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:var(--s3);font-size:14px}
.upnext .t{font:500 14px/1.5 var(--f-head);font-variant-numeric:tabular-nums}
.upnext small{display:block;color:var(--ink-2);font-size:13px}
.idea{padding:var(--s4) var(--s5);display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s3);min-width:0}
.idea h3{font-size:14px;color:var(--ink-2)}
.idea-form{display:flex;align-items:center;gap:var(--s2)}
.idea-form input{flex:1;min-width:0;min-height:var(--tap);padding:0 var(--s4);border:1px solid var(--track);border-radius:999px;background:var(--bg);font-size:14px}
.idea-form input:focus-visible{outline-offset:0;border-color:var(--ink)}
.idea .micbtn,.idea .vlang,.ask .micbtn,.ask .vlang{position:static;flex:none}
.idea-card{display:grid;gap:var(--s2);padding:var(--s3) var(--s4);border-radius:12px;background:var(--surface)}
.idea-card h4{font:500 16px/1.4 var(--f-head)}
.idea-card .heard{font-size:12px;color:var(--ink-2)}
.alt{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3)}
@media (max-width:899px){
  .compose .chip{min-height:var(--tap-sm);padding:0 var(--s3);font-size:12.5px}
  .compose .actions{display:grid;gap:var(--s3)}
  .compose .actions>.btn{width:100%}
  .compose .alt{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
  .compose .alt .linkbtn{justify-content:center;min-height:var(--tap);border:1px solid var(--track);border-radius:999px;text-decoration:none;background:var(--card)}
}
/* adjustable time at a place */
.stay{display:inline-flex;align-items:center;gap:var(--s1);margin-top:var(--s1);font-size:13px;color:var(--ink-2)}
.stay output{min-width:56px;text-align:center;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ibtn.sm{width:var(--tap-sm);height:var(--tap-sm);border:1px solid var(--track);color:var(--ink);font-size:16px;line-height:1}
/* place photo in the detail sheet */
.hero{margin:0;display:grid;gap:var(--s2)}
.hero-img{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.gal{position:relative}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:12px;overscroll-behavior-x:contain}
.gal-track::-webkit-scrollbar{display:none}
.gal-track:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.slide{flex:0 0 100%;scroll-snap-align:center;border-radius:0}
.gal-btn{position:absolute;top:50%;width:var(--tap);height:var(--tap);margin-top:calc(var(--tap) / -2);border:0;border-radius:50%;background:rgba(255,255,255,.9);color:#1B2233;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.gal-btn .ico{width:20px;height:20px}
.gal-btn.prev{left:var(--s2)} .gal-btn.prev .ico{transform:rotate(90deg)}
.gal-btn.next{right:var(--s2)} .gal-btn.next .ico{transform:rotate(-90deg)}
.gal-btn:active{transform:scale(.94)}
.gal-count{position:absolute;right:var(--s2);bottom:var(--s2);padding:2px var(--s2);border-radius:999px;background:rgba(27,34,51,.78);color:#fff;font-size:12px;font-variant-numeric:tabular-nums}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero figcaption{font-size:12px;color:var(--ink-2)}
.hero figcaption a{color:inherit}

/* desktop: information 55%, map 45% */
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,55fr) minmax(0,45fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"tabs map" "panel map"}
  body .mapcol,body[data-view="describe"] .mapcol{display:block;grid-area:map;border-left:1px solid var(--line)}
  .panel,body[data-view="describe"] .panel{grid-area:panel;align-self:stretch;height:auto;border-radius:0;box-shadow:none;transition:none}
  .grab{display:none}
  .view,body[data-view="describe"] .view{padding-top:var(--s5);padding-bottom:var(--s6)}
  .toasts{left:0;right:auto;width:55vw;bottom:80px}
  dialog{margin:auto;width:480px}
  .sheet{border-radius:20px}
}
@media (max-width:420px){
  h1{font-size:24px}
  .compose,.filters,.nofit,.skipbox,.suggest{padding:var(--s4)}
}
@media (prefers-reduced-motion:reduce){
  .scored .slats i.on,dialog[open],dialog[open]::backdrop,.toast,.row.flash{animation:none}
  .more,.why .ico,.btn,.chip,.add,.seg button,.pin,.panel{transition:none}
  .spin{animation-duration:2s}
}

/* ---------- live clock (Bangkok). ?at=Sat-11:00 pins it for demos and tests ---------- */
const params = new URLSearchParams(location.search);
function bangkokNow(){
  const m=(params.get("at")||"").match(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[ -](\d\d):(\d\d)$/);
  if(m) return {dow:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(m[1]), min:+m[2]*60+ +m[3]};
  const f=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Bangkok",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g=k=>f.find(x=>x.type===k).value;
  return {dow:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(g("weekday")), min:(+g("hour")%24)*60+ +g("minute")};
}
const DAYIDX = {Mo:0,Tu:1,We:2,Th:3,Fr:4,Sa:5,Su:6};
/* minimal opening_hours reader for the shapes used above: "Mo-Su 09:00-18:00", "Tu-Su ...", "10:00-19:00" */
function hoursFor(h,dow){
  if(!h) return {status:"unknown"};
  const m=h.match(/^(?:(Mo|Tu|We|Th|Fr|Sa|Su)(?:-(Mo|Tu|We|Th|Fr|Sa|Su))? )?(\d\d):(\d\d)-(\d\d):(\d\d)$/);
  if(!m) return {status:"unknown"};
  const a=m[1]?DAYIDX[m[1]]:0, b=m[1]?(m[2]?DAYIDX[m[2]]:a):6;
  if(dow<a||dow>b) return {status:"closed"};
  const o=+m[3]*60+ +m[4]; let c=+m[5]*60+ +m[6]; if(c<=o) c+=1440;
  return {status:"ok", open:o, close:c};
}

/* ---------- route solver (mock of the OR-Tools step) ---------- */
function simulate(order,start,prevPlace,endMin,manual=false){
  let now=start, prev=prevPlace||null, walk=0; const items=[], dropped=[];
  for(const id of order){
    const p=P[id];
    if(p.status==="unknown"){ dropped.push({id, reason:"unknown"}); continue; }
    if(p.status==="closed"){ dropped.push({id, reason:"closedday"}); continue; }
    const w=prev?walkMin(prev,p):0, arr=now+w, s=Math.max(arr,p.open), end=s+durOf(p);
    let conflict=null;
    /* automatic mode drops what cannot fit; manual mode keeps the user's order and flags the conflict instead */
    if(end>p.close){ if(!manual){ dropped.push({id, reason: arr<p.open ? "late" : "early"}); continue; } conflict="close"; }
    else if(end>endMin){ if(!manual){ dropped.push({id, reason:"window"}); continue; } conflict="window"; }
    items.push({id, walk:w, wait:s-arr, start:s, end, conflict});
    walk+=w; now=end; prev=p;
  }
  return {items,dropped,finish:now,walk};
}
const fitsIn=(pl,id)=>pl.items.some(i=>i.id===id&&!i.conflict);
function solve(ids,start,prevPlace,endMin,pins,base){

function plan(tray=state.tray, delay=state.delay, start=state.startMin, end=state.endMin){

  vs.forEach(v=>{ const p=P[v.id], w=prev?walkMin(prev,p):0; items.push({id:v.id,walk:w,wait:0,start:v.start,end:v.end,done:true}); walk+=w; prev=p; });

  const t0=vs.length ? vs[vs.length-1].end+delay : start+delay;
  const r=state.manual ? simulate(rest,t0,prev,end,true) : solve(rest,t0,prev,end,state.pins,vs.length);
  const all=[...items,...r.items];
  return {items:all, dropped:r.dropped, finish:all.length?all[all.length-1].end:t0, walk:walk+r.walk};
}

/* next stop: reachable before close, not visited/skipped/rejected, different type from previous, ranked by vibe/distance/freshness */
function nextCandidates(types,pred){
  if(state.tray.length>=MAX_STOPS) return [];
  const pl=plan();
  const cold=!state.tray.length;                          /* no plan yet: start from now and from where you stand */
  const start0=cold?state.now.min:state.startMin, end0=cold?Math.min(1380,Math.max(state.endMin,state.now.min+180)):state.endMin;
  const done=pl.items.filter(i=>i.done), lastDone=done[done.length-1], lastAny=pl.items[pl.items.length-1], ref=lastDone||lastAny;
  const from=ref?P[ref.id]:(cold&&state.geo?state.geo:ME);
  const at=lastDone ? lastDone.end+state.delay : (lastAny ? lastAny.end : start0+state.delay);
  const base=baseTags();
  return PLACES.filter(p=>p.status==="ok" && !state.tray.includes(p.id) && !visited(p.id) && !state.skipped.includes(p.id) && !state.rejected.includes(p.id) && ((types||pred) ? ((!types||types.includes(p.type)) && (!pred||pred(p))) : (!ref || p.type!==P[ref.id].type)))
    .map(p=>{ const w=walkMin(from,p), arr=at+w; return {p,w,arr}; })
    .filter(c=>(!cold || c.p.open<=c.arr+30) && fitsIn(plan([...state.tray,c.p.id],state.delay,start0,end0),c.p.id))
    .map(c=>{
      const vibe=base.reduce((a,x)=>a+c.p.tags[x],0)/base.length/5, prox=1-Math.min(c.w,15)/15, fresh=1;   /* demo data has no per-place freshness, so every place scores equally here */
      return {...c, end:end0, cold, score:(cold?.2:.5)*vibe+(cold?.65:.35)*prox+.15*fresh, left:end0-c.arr};
    }).sort((a,b)=>b.score-a.score);

function parseIdea(q){
  const x=q.toLowerCase();
  if(/\b(hungry|starving|food|eat|eating|lunch|dinner|snack|breakfast)\b|หิว|กิน|อาหาร|ข้าว/.test(x)) return "hungry";
  if(/\b(hot|heat|sweat|sweating|warm|boiling)\b|ร้อน|เหงื่อ/.test(x)) return "hot";
  if(/\b(tired|rest|sit|exhausted|sleepy|break)\b|เหนื่อย|พัก|นั่ง|เมื่อย/.test(x)) return "tired";
  if(/\b(next|where|idea|suggest|recommend)\b|what now|ไปไหน|ต่อ|แนะนำ|ที่ไหน/.test(x)) return "next";

  japanese:{words:/japan|sushi|ramen|izakaya|ญี่ปุ่น|ซูชิ|ราเมน|อิซากายะ/, cat:/japan|sushi|ramen|izakaya/},
  thai:{words:/\bthai\b|ไทย/, cat:/\bthai\b/},
  chinese:{words:/chinese|dim ?sum|จีน|ติ่มซำ/, cat:/chinese|dumpling/},
  seafood:{words:/seafood|ซีฟู้ด|อาหารทะเล/, cat:/seafood/},
  noodles:{words:/noodle|ก๋วยเตี๋ยว|บะหมี่|เส้น/, cat:/noodle/},
  dumplings:{words:/dumpling|\bbun\b|ซาลาเปา|เกี๊ยว/, cat:/dumpling|\bbun\b/},
  dessert:{words:/dessert|sweets?\b|ice ?cream|ขนมหวาน|ของหวาน|ไอศกรีม/, cat:/dessert|ice.?cream|bakery/},
  coffee:{words:/coffee|\bcafe\b|café|กาแฟ|คาเฟ่/, cat:/cafe|coffee/}

function parseStyle(q){ const x=q.toLowerCase(); return Object.keys(STYLES).find(k=>STYLES[k].words.test(x))||null; }
const styleMatch=k=>p=>STYLES[k].cat.test((p.cat+" "+p.en).toLowerCase());
function askIdea(text,intent){

function applyPlan(m){
  const ids=(m.tray||[]).filter(id=>P[id]).slice(0,MAX_STOPS);
  const changed=ids.join(",")!==state.tray.join(",");
  if(changed){ pushUndo(); state.tray=ids; state.visits=state.visits.filter(v=>ids.includes(v.id)); state.skipped=[]; state.pins={}; state.manual=false; state.here=null; state.idea=null; }
  if(m.startMin>=0&&m.startMin<1440&&!state.visits.length) state.startMin=m.startMin;
  if(m.endMin>0&&m.endMin<=1440) state.endMin=m.endMin;
}
window.addEventListener("message",e=>{
  const fr=$("#plannerFrame"); if(e.origin!==location.origin||e.source!==fr.contentWindow) return;
  const m=e.data||{}; if(!m.dayoff) return;
  if(m.dayoff==="close"){ closePlanner(); return; }
  applyPlan(m); closePlanner();
  if(m.dayoff==="plan"){ state.view="now"; render({focus:"#vh"}); if(state.tray.length) toast(t("tPlanSet",{n:state.tray.length})); }

});
function replaceStop(oldId,newId){
  const next=state.tray.map(x=>x===oldId?newId:x);
  if(!fitsIn(plan(next),newId)){ toast(t("tNoSwap")); return; }
  pushUndo(); state.tray=next; delete state.pins[oldId]; state.here=null; state.idea=null;
  $("#sheet").close(); render({focus:"#vh"});
  toast(t("tSwapped",{a:nm(P[oldId]),b:nm(P[newId])}),true);
}

/* ---------- in-page walking navigation (a demo: the dot walks the real OSM walking route, sped up) ---------- */
const walkStepsCache=new Map();
/* demo stations near Yaowarat / Song Wat (approximate positions) */
const STATIONS=[
  {sys:"mrt",en:"Hua Lamphong",th:"หัวลำโพง",lat:13.7380,lng:100.5170},
  {sys:"mrt",en:"Wat Mangkon",th:"วัดมังกร",lat:13.7432,lng:100.5098},
  {sys:"mrt",en:"Sam Yot",th:"สามยอด",lat:13.7447,lng:100.5006},
  {sys:"mrt",en:"Sanam Chai",th:"สนามไชย",lat:13.7437,lng:100.4930},
  {sys:"bts",en:"Saphan Taksin",th:"สะพานตากสิน",lat:13.7186,lng:100.5141},
  {sys:"bts",en:"Krung Thon Buri",th:"กรุงธนบุรี",lat:13.7211,lng:100.5030},
  {sys:"bts",en:"Wongwian Yai",th:"วงเวียนใหญ่",lat:13.7219,lng:100.4953},
  {sys:"bts",en:"National Stadium",th:"สนามกีฬาแห่งชาติ",lat:13.7466,lng:100.5290}

const NAVMODES=["walk","car","bts","mrt"], SYSNAME={bts:"BTS",mrt:"MRT"};
function transitPlan(a,b,sys){
  const st=STATIONS.filter(x=>x.sys===sys), near=(pt)=>st.reduce((m,x)=>meters(pt,x)<meters(pt,m)?x:m);
  const board=near(a), alight=near(b);
  if(board===alight) return null;
  const rideM=meters(board,alight)*1.15, stops=Math.max(1,Math.round(rideM/900)), rideMin=Math.round(rideM/550)+1;
  const w1=walkMin(a,board), w2=walkMin(alight,b);
  return {board,alight,stops,rideM,rideMin,w1,w2,total:w1+4+rideMin+w2};
}
function modeEst(a,b,mode){
  if(mode==="walk") return {min:walkMin(a,b)};
  if(mode==="car"){ const m=meters(a,b)*1.35; return {min:Math.max(4,3+Math.round(m/260)),km:(m/1000).toFixed(1)}; }
  const tp=transitPlan(a,b,mode); return tp?{min:tp.total,tp}:null;
}
const navFrom=(pl,cur)=>{ const ci=pl.items.indexOf(cur), prev=ci>0?P[pl.items[ci-1].id]:null; return state.geo?{lat:state.geo.lat,lng:state.geo.lng}:(prev||ME); };
async function walkSteps(a,b,prof){
  prof=prof||"foot";
  const key=`${prof}|${a.lng.toFixed(5)},${a.lat.toFixed(5)};${b.lng.toFixed(5)},${b.lat.toFixed(5)}`, co=`${a.lng.toFixed(5)},${a.lat.toFixed(5)};${b.lng.toFixed(5)},${b.lat.toFixed(5)}`;
  if(walkStepsCache.has(key)) return walkStepsCache.get(key);
  let out=null;
  if(!state.routeDown){
    try{
      const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),6000);
      const r=await fetch(`https://routing.openstreetmap.de/routed-${prof}/route/v1/${prof==="car"?"driving":"foot"}/${co}?overview=full&geometries=geojson&steps=true`,{signal:ctl.signal});
      clearTimeout(to); if(!r.ok) throw new Error("route");
      const j=await r.json(), rt=j.routes&&j.routes[0];
      if(rt) out={coords:rt.geometry.coordinates.map(([x,y])=>[y,x]), steps:rt.legs[0].steps, dist:rt.distance};
    }catch(e){}
  }
  walkStepsCache.set(key,out); return out;
}
const straightRoute=(a,b)=>({coords:[[a.lat,a.lng],[b.lat,b.lng]],steps:[{maneuver:{type:"depart"},name:"",distance:Math.round(meters(a,b))},{maneuver:{type:"arrive"},name:"",distance:0}],dist:meters(a,b)});
async function buildRoute(from,to,mode){
  if(mode==="walk") return (await walkSteps(from,to))||straightRoute(from,to);
  if(mode==="car") return (await walkSteps(from,to,"car"))||straightRoute(from,to);
  const tp=transitPlan(from,to,mode); if(!tp) return (await walkSteps(from,to))||straightRoute(from,to);
  const L1=(await walkSteps(from,tp.board))||straightRoute(from,tp.board), L2=(await walkSteps(tp.alight,to))||straightRoute(tp.alight,to);
  const sn=x=>x[state.lang], ride={maneuver:{type:"ride"},name:"",distance:Math.round(tp.rideM),text:t("navRide",{sys:SYSNAME[mode],a:esc(sn(tp.board)),b:esc(sn(tp.alight)),n:tp.stops})};
  const s1=L1.steps.filter(x=>x.maneuver.type!=="arrive"), s2=L2.steps.map((x,i)=>i===0?{...x,text:t("navExit",{a:esc(sn(tp.alight))})}:x);
  if(s1.length) s1[s1.length-1]={...s1[s1.length-1]};
  return {coords:[...L1.coords,[tp.alight.lat,tp.alight.lng],...L2.coords], steps:[...s1,ride,...s2], dist:(L1.dist||0)+tp.rideM+(L2.dist||0), totalMin:tp.total};
}
let navTimer=null, navDot=null;
function stepText(st,name){
  const m=st.maneuver||{}, road=st.name||"";
  if(st.text) return st.text;
  const car=state.nav&&state.nav.mode==="car";
  if(m.type==="arrive") return t("navArrive",{name});
  if(m.type==="depart") return road?t(car?"navDepartOnCar":"navDepartOn",{road:esc(road)}):t(car?"navDepartCar":"navDepart");
  const dirKey={left:"navLeft",right:"navRight","slight left":"navSlightLeft","slight right":"navSlightRight","sharp left":"navSharpLeft","sharp right":"navSharpRight",uturn:"navUturn"}[m.modifier];
  if(!dirKey||m.modifier==="straight") return road?t("navContinueOn",{road:esc(road)}):t("navContinue");
  return road?t("navTurnOn",{dir:t(dirKey),road:esc(road)}):t("navTurn",{dir:t(dirKey)});
}
const stepArrow=st=>{ const m=st.maneuver||{}; return m.type==="ride"?"⇒":m.type==="arrive"?"⚑":m.type==="depart"?"↑":({left:"↰","slight left":"↖","sharp left":"↙",right:"↱","slight right":"↗","sharp right":"↘",uturn:"↶"}[m.modifier]||"↑"); };
function pointAt(nv,d){
  let i=1; while(i<nv.cum.length-1&&nv.cum[i]<d) i++;
  const a=nv.pts[i-1], b=nv.pts[i], seg=(nv.cum[i]-nv.cum[i-1])||1, f=Math.max(0,Math.min(1,(d-nv.cum[i-1])/seg));
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f];
}
const NAVLABEL={walk:"navLabel",car:"navLabelCar",bts:"navLabelBts",mrt:"navLabelMrt"};
function renderNav(){
  const nv=state.nav, bar=$("#navbar"); if(!nv||!bar) return;
  const p=P[nv.id], frac=nv.len?nv.at/nv.len:1, rd=nv.rd*frac;
  let k=0, acc=0; for(let i=0;i<nv.steps.length;i++){ if(rd>=acc+nv.steps[i].distance&&i<nv.steps.length-1){ acc+=nv.steps[i].distance; k=i+1; } else { k=i; break; } }
  const cur=nv.steps[k], up=nv.steps[k+1], toNext=Math.max(0,Math.round(acc+cur.distance-rd));
  let txt, ic;
  if(nv.done){ txt=t("navArrive",{name:esc(nm(p))}); ic="⚑"; }
  else if(k===0&&rd<8){ txt=stepText(cur,nm(p)); ic=stepArrow(cur); }
  else if(up){ txt=t("navIn",{d:toNext,txt:stepText(up,esc(nm(p)))}); ic=stepArrow(up); }
  else { txt=t("navIn",{d:toNext,txt:stepText({maneuver:{type:"arrive"}},esc(nm(p)))}); ic="⚑"; }
  const rem=Math.max(0,Math.round(nv.len-nv.at)), min=Math.max(1,Math.ceil(rem/nv.mpm));
  bar.setAttribute("aria-label",t(NAVLABEL[nv.mode]));
  $("#navIc").textContent=ic; $("#navTxt").innerHTML=txt; $("#navMeta").textContent=nv.done?"":t("navLeft2",{m:rem,n:min});
  $("#navFill").style.width=Math.round(frac*100)+"%"; $("#navDemo").textContent=t(nv.mode==="walk"?"navDemo":"navDemoTrip");
  $("#navStop").textContent=t("navStop"); const ar=$("#navArrive"); ar.hidden=!nv.done; ar.textContent=t("nowArrived");
  if(nv.last!==txt){ nv.last=txt; say(plainText(txt)); }
}
function navTick(){
  const nv=state.nav; if(!nv) return;
  nv.at=Math.min(nv.len,nv.at+Math.max(4,nv.len/(params.get("navfast")?6:48)));
  const pos=pointAt(nv,nv.at); navDot&&navDot.setLatLng(pos);
  if(LMAP) LMAP.panTo(pos,{animate:!reducedMotion()});
  if(nv.at>=nv.len){ nv.done=true; clearInterval(navTimer); navTimer=null; }

      <button type="button" class="btn primary" data-act="build" data-fk="build" data-testid="done-home">${icon("check")}${t("doneHome")}</button></div>`;

/* ---------- real map (Leaflet + OpenStreetMap tiles) ---------- */
let LMAP=null, LGROUP=null, LROUTE=null, lastFit="", routeToken=0;
/* Tiles: Mapbox when MAP_BLOCK_KEY is available (served by server.mjs as /env.js), else OSM over http, else CARTO.
   Three tile errors (bad token, URL restriction, 403) retire a provider and the next one takes over. */
const MAP_KEY = (window.DAYOFF_ENV && window.DAYOFF_ENV.MAP_BLOCK_KEY) || "";
const OSM_ATTR='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
let TL=null, tileKind="", tileErrs=0; const tileDead=new Set();
function wantTiles(){
  if(MAP_KEY && !tileDead.has("mapbox")) return document.documentElement.dataset.theme==="dark" ? "mapbox-dark" : "mapbox-light";
  if(location.protocol==="file:" || tileDead.has("osm")) return "carto";
  return "osm";
}
function tileSpec(kind){
  if(kind.startsWith("mapbox")){
    const style = kind==="mapbox-dark" ? "dark-v11" : "streets-v12";
    return {url:`https://api.mapbox.com/styles/v1/mapbox/${style}/tiles/512/{z}/{x}/{y}@2x?access_token=${MAP_KEY}`, opt:{tileSize:512, zoomOffset:-1, maxZoom:19, attribution:'&copy; <a href="https://www.mapbox.com/about/maps/">Mapbox</a> '+OSM_ATTR}};
  }
  if(kind==="carto") return {url:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", opt:{maxZoom:19, subdomains:"abcd", attribution:OSM_ATTR+' &copy; <a href="https://carto.com/attributions">CARTO</a>'}};
  return {url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", opt:{maxZoom:19, attribution:OSM_ATTR}};
}
function syncTiles(){
  if(!LMAP) return;
  const kind=wantTiles(); if(kind===tileKind) return;
  if(TL) LMAP.removeLayer(TL);
  const sp=tileSpec(kind); TL=L.tileLayer(sp.url,sp.opt).addTo(LMAP); tileKind=kind; tileErrs=0;
  $("#map").dataset.tiles = kind.startsWith("mapbox") ? "mapbox" : kind;
  TL.on("tileerror",()=>{ if(++tileErrs>=3){ tileDead.add(kind.startsWith("mapbox")?"mapbox":kind); syncTiles(); } });
}
const routeCache=new Map();
function initMap(){
  if(!window.L){ $("#map").innerHTML=`<p class="mapfail">${t("mapFail")}</p>`; return; }
  LMAP=L.map("map",{zoomControl:true,attributionControl:false,scrollWheelZoom:true,keyboard:true}).setView([13.7385,100.5105],15);
  L.control.attribution({position:"topright"}).addTo(LMAP);   /* top-right so the phone bottom sheet never hides it */
  syncTiles();
  LGROUP=L.layerGroup().addTo(LMAP);
  new ResizeObserver(()=>{ LMAP.invalidateSize(); }).observe($("#map"));
}
function pinIcon(kind,n,best){
  const dot = kind==="num"||kind==="done" ? 26 : kind==="faint" ? 9 : 16;
  const size = kind==="faint" ? 14 : Math.max(dot,30);          /* hit area stays comfortable even when the dot is small */
  const cls = kind==="done" ? "num done" : kind;
  return L.divIcon({className:"", html:`<div class="pinbox"><div class="pin ${cls}${best?" best":""}">${n||""}</div></div>`, iconSize:[size,size], iconAnchor:[size/2,size/2]});
}
async function walkGeometry(pts){
  const key=pts.map(p=>p.lng.toFixed(5)+","+p.lat.toFixed(5)).join(";");
  if(routeCache.has(key)) return routeCache.get(key);
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),6000);
    const r=await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${key}?overview=full&geometries=geojson`,{signal:ctl.signal});
    clearTimeout(to);
    if(!r.ok) throw new Error("route "+r.status);
    const j=await r.json(); const g=j.routes&&j.routes[0]&&j.routes[0].geometry.coordinates.map(([x,y])=>[y,x]);
    routeCache.set(key,g||null); return g||null;
  }catch(e){ routeCache.set(key,null); return null; }
}
function focusItem(id){
  const el=document.querySelector(`.row[data-id="${id}"], .stop[data-pid="${id}"]`);
  if(!el) return;
  el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
function renderMap(){
  const mapEl=$("#map"), col=$("#mapcol");
  if(!LMAP) return;
  syncTiles();                         /* follows the theme (light / dark Mapbox style) */
  LGROUP.clearLayers(); if(LROUTE){ LMAP.removeLayer(LROUTE); LROUTE=null; }
  routeToken++;
  let pins=[], route=[], focus=[];
  const inTray=id=>state.tray.includes(id);
  if(false){
    const pl=plan();
    pl.items.forEach((it,i)=>{ const p=P[it.id]; pins.push({p,kind:it.done?"done":"num",n:i+1}); focus.push(p); });
    route=pl.items.map(i=>P[i.id]);
    PLACES.filter(p=>!pl.items.some(i=>i.id===p.id)).forEach(p=>pins.unshift({p,kind:"faint"}));
  } else if(state.view==="now" && state.tray.length){
    const pl=plan(), cur=pl.items.find(i=>!i.done), ci=cur?pl.items.indexOf(cur):-1;
    pl.items.forEach((it,i)=>{ const p=P[it.id]; pins.push({p,kind:it.done?"done":"num",n:i+1,best:it===cur}); });
    PLACES.filter(p=>!pl.items.some(i=>i.id===p.id)).forEach(p=>pins.unshift({p,kind:"faint"}));
    if(cur){
      const prev=ci>0?P[pl.items[ci-1].id]:null, from=state.geo?{...state.geo,id:"geo"}:prev||{...ME,id:"me"};
      route=[from,P[cur.id]]; focus=[from,P[cur.id]];
    }
  } else if(state.pick && state.results.length){
    const vis=visibleResults(), ids=vis.map(r=>r.id);
    vis.forEach((r,i)=>{ const p=P[r.id]; pins.push({p,kind:inTray(p.id)?"tray":"res",best:i===0&&!isWeak(r)}); focus.push(p); });
    PLACES.filter(p=>!ids.includes(p.id)).forEach(p=>pins.unshift({p,kind:"faint"}));
  } else { PLACES.forEach(p=>pins.push({p,kind:"faint"})); }
  pins.forEach(({p,kind,n,best})=>{
    const m=L.marker([p.lat,p.lng],{icon:pinIcon(kind,n,best),title:nm(p),alt:nm(p),keyboard:kind!=="faint",riseOnHover:true});
    m.bindTooltip(esc(nm(p)),{direction:"top",offset:[0,-8]});
    if(kind!=="faint") m.on("click",()=>focusItem(p.id));
    m.addTo(LGROUP);
  });
  if(state.geo) L.circleMarker([state.geo.lat,state.geo.lng],{radius:8,color:"#ffffff",weight:3,fillColor:"#1B2233",fillOpacity:1,interactive:false}).addTo(LGROUP);
  if(!state.geo&&state.view==="now") L.circleMarker([ME.lat,ME.lng],{radius:8,color:"#ffffff",weight:3,fillColor:"#1B2233",fillOpacity:1,interactive:false}).addTo(LGROUP);
  mapEl.setAttribute("aria-label", focus.length?t("mapStops",{n:focus.length}):t("mapLabel"));
  if(route.length>1){
    const pts=route.map(p=>[p.lat,p.lng]), token=routeToken;
    LROUTE=L.polyline(pts,{color:"#C93520",weight:4,opacity:.85,dashArray:"2 8",lineCap:"round"}).addTo(LMAP);
    if(!state.routeDown) walkGeometry(route).then(g=>{
      if(!g||token!==routeToken||!LMAP) return;
      LMAP.removeLayer(LROUTE); LROUTE=L.polyline(g,{color:"#C93520",weight:4,opacity:.9}).addTo(LMAP);
      LROUTE.getElement()?.setAttribute("data-route","osm");
    });
  }
  if(col.offsetWidth===0){ lastFit=""; return; }     /* hidden on phones while describing */
  const bottom = (isPhone() && state.view!=="describe") ? Math.min(snapPx(state.sheet)+16, col.clientHeight*0.6) : 0;   /* keep pins above the sheet */
  const key=state.view+"|"+focus.map(p=>p.id).join(",")+"|"+Math.round(bottom);
  if(key!==lastFit){
    lastFit=key; LMAP.invalidateSize();
    const pts=(focus.length?focus:PLACES).map(p=>[p.lat,p.lng]);
    if(pts.length===1){ LMAP.setView(pts[0],16,{animate:false}); if(bottom) LMAP.panBy([0,bottom/2],{animate:false}); }
    else LMAP.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[40,40],paddingBottomRight:[40,40+bottom],maxZoom:17,animate:false});
  }
}

function diffLines(oldPl,newPl){

  newPl.items.forEach(i=>{ const o=om.get(i.id); if(i.conflict && !(o&&o.conflict)){ out.push({cls:"bad",txt:t("skipped",{name:nm(P[i.id])})}); return; } if(!o) out.push({cls:"",txt:t("fits",{name:nm(P[i.id])})}); else if(o.start!==i.start) out.push({cls:"",txt:t("moved",{name:nm(P[i.id]),a:fmt(o.start),b:fmt(i.start)})}); });

/* place photo: a geotagged Wikimedia Commons photo within 60 m (credited), else the Wikipedia photo, else a Mapbox aerial view of the exact spot */
const commonsCache=new Map();
function plainText(html){ return new DOMParser().parseFromString(html||"","text/html").body.textContent.trim(); }
async function commonsPhoto(p){
  if(commonsCache.has(p.id)) return commonsCache.get(p.id);
  let out=[];
  try{
    const u="https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch&ggscoord="+p.lat+"%7C"+p.lng+"&ggsradius=100&ggslimit=15&ggsnamespace=6&prop=imageinfo&iiprop=url%7Cextmetadata%7Cmime&iiurlwidth=800&iiextmetadatafilter=Artist%7CLicenseShortName&format=json&origin=*";
    const r=await fetch(u); if(!r.ok) throw new Error("commons");
    const j=await r.json();
    out=Object.values((j.query&&j.query.pages)||{}).filter(x=>x.imageinfo&&x.imageinfo[0]&&x.imageinfo[0].mime==="image/jpeg").sort((a,b)=>a.index-b.index).slice(0,6).map(pg=>{
      const ii=pg.imageinfo[0], m=ii.extmetadata||{};
      return {kind:"commons", src:ii.thumburl||ii.url, credit:plainText(m.Artist&&m.Artist.value)||"Wikimedia Commons", lic:plainText(m.LicenseShortName&&m.LicenseShortName.value), href:ii.descriptionurl};
    });
  }catch(e){}
  commonsCache.set(p.id,out); return out;
}
const aerialOf = p => MAP_KEY ? {kind:"aerial", src:`https://api.mapbox.com/styles/v1/mapbox/satellite-streets-v12/static/pin-l+C93520(${p.lng},${p.lat})/${p.lng},${p.lat},17,0/800x450@2x?access_token=${MAP_KEY}`} : null;
function capFor(ph){
  return ph.kind==="commons" ? `${t("photoNear")} · ${esc(ph.credit)}${ph.lic?" · "+esc(ph.lic):""} · <a href="${esc(ph.href)}" target="_blank" rel="noopener">Wikimedia Commons</a>`
       : ph.kind==="wiki" ? t("photoWiki") : `${t("aerial")} · © Mapbox · © OpenStreetMap contributors`;
}
/* a swipeable strip of every photo found: nearby Commons photos, the Wikipedia photo, then the aerial view of the exact spot */
function paintGallery(sh,p,slides){
  const fig=sh.querySelector("#photo"); if(!fig||sh.dataset.pid!==p.id) return;
  if(!slides.length){ fig.innerHTML=`<div class="hero-img tone-${p.tone}" aria-hidden="true">${icon(p.icon)}</div><figcaption>${t("photoNone")}</figcaption>`; return; }
  const n=slides.length;

    <div class="gal-track" tabindex="0">${slides.map((ph,i)=>`<div class="hero-img slide" role="group" aria-roledescription="slide" aria-label="${esc(t("photoN",{i:i+1,n}))}"><img src="${esc(ph.src)}" alt="${esc(nm(p))}" data-kind="${ph.kind}" referrerpolicy="no-referrer" ${i?'loading="lazy"':""}></div>`).join("")}</div>
    ${n>1?`<button type="button" class="gal-btn prev" data-act="gal" data-d="-1" aria-label="${esc(t("photoPrev"))}">${icon("chev")}</button><button type="button" class="gal-btn next" data-act="gal" data-d="1" aria-label="${esc(t("photoNext"))}">${icon("chev")}</button><span class="gal-count" aria-hidden="true">1 / ${n}</span>`:""}</div>
    <figcaption>${capFor(slides[0])}</figcaption>`;
  const tr=fig.querySelector(".gal-track"), cap=fig.querySelector("figcaption"), cnt=fig.querySelector(".gal-count");
  let at=0;
  tr.addEventListener("scroll",()=>{ const i=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth)); if(i!==at&&slides[i]){ at=i; cap.innerHTML=capFor(slides[i]); if(cnt) cnt.textContent=(i+1)+" / "+n; } },{passive:true});
  fig.querySelectorAll('img[data-kind="aerial"]').forEach(im=>im.addEventListener("error",()=>paintGallery(sh,p,slides.filter(x=>x.kind!=="aerial")),{once:true}));

function galStep(b){

/* the aerial view appears at once; real photos are added in front of it as each one finishes loading */
async function loadDetailPhoto(sh,p){
  const aerial=aerialOf(p);
  if(aerial) paintGallery(sh,p,[aerial]);
  const cands=[...await commonsPhoto(p)];
  if(state.photos[p.id]&&!cands.some(c=>c.src===state.photos[p.id])) cands.push({kind:"wiki",src:state.photos[p.id]});

  if(!ok.length){ if(!aerial) paintGallery(sh,p,[]); return; }
  paintGallery(sh,p,aerial?[...ok,aerial]:ok);
}

/* ---------- manual order: drag a stop by its handle, or focus the handle and press ↑ / ↓ ---------- */
const reducedMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function commitOrder(order,focusId){
  const doneIds=state.visits.filter(v=>state.tray.includes(v.id)).map(v=>v.id);
  const moved=order.filter(id=>!doneIds.includes(id));
  const current=plan().items.filter(i=>!i.done).map(i=>i.id);
  if(moved.join()===current.join()) return false;                         /* dropped back where it was: nothing changed */
  const rest=state.tray.filter(id=>!doneIds.includes(id)&&!moved.includes(id));   /* unscheduled stops stay at the end */
  pushUndo(); state.tray=[...doneIds,...moved,...rest]; state.manual=true;
  render({focus:`[data-fk="grip-${focusId}"]`});
  const pl=plan();
  say(t("tMoved",{name:nm(P[focusId]),n:pl.items.findIndex(i=>i.id===focusId)+1,m:pl.items.length}));
  return true;
}
function moveStop(id,dir){
  const ids=plan().items.filter(i=>!i.done).map(i=>i.id), i=ids.indexOf(id), j=i+dir;
  if(i<0) return;
  if(j<0||j>=ids.length){ say(t("moveEdge",{name:nm(P[id])})); return; }
  [ids[i],ids[j]]=[ids[j],ids[i]]; commitOrder(ids,id);
}
let rd=null;
function renumber(ol){
  [...ol.children].forEach((li,i)=>{ const d=li.querySelector(".dot:not(.done)"); if(d) d.textContent=i+1; const w=li.querySelector(".walkin"); if(w) w.hidden=(i===0); });
}
function rdPlace(y){ const base=rd.ol.getBoundingClientRect().top+rd.li.offsetTop; rd.li.style.transform=`translateY(${y-rd.grabY-base}px)`; }
function rdReorder(y){
  const {li,ol}=rd, centre=y-rd.grabY+li.offsetHeight/2, others=[...ol.children].filter(x=>x!==li);
  let idx=0; others.forEach(x=>{ const r=x.getBoundingClientRect(); if(centre>r.top+r.height/2) idx++; });
  idx=Math.max(idx,rd.locked);                                            /* visited stops stay on top */
  if(idx===[...ol.children].indexOf(li)) return;
  const before=new Map(others.map(x=>[x,x.getBoundingClientRect().top]));
  ol.insertBefore(li,others[idx]||null); renumber(ol);
  if(!reducedMotion()) others.forEach(x=>{                                /* neighbours glide into place (transform only) */
    const d=before.get(x)-x.getBoundingClientRect().top;
    if(d){ x.style.transition="none"; x.style.transform=`translateY(${d}px)`; x.getBoundingClientRect(); x.style.transition="transform 180ms var(--ease)"; x.style.transform=""; }
  });
}
function rdFollow(){
  if(!rd||!rd.active) return;
  const sc=$("#view"), r=sc.getBoundingClientRect();
  if(rd.y<r.top+48) sc.scrollTop-=10; else if(rd.y>r.bottom-48) sc.scrollTop+=10;   /* scroll while dragging near an edge */
  rdPlace(rd.y); rdReorder(rd.y); rdPlace(rd.y);
  rd.raf=requestAnimationFrame(rdFollow);
}
function rdEnd(commit){
  if(!rd) return;
  const d=rd; rd=null; cancelAnimationFrame(d.raf);
  try{ d.grip.releasePointerCapture(d.pointer); }catch(e){}
  if(!d.active) return;
  const order=[...d.ol.children].map(x=>x.dataset.pid);
  [...d.ol.children].forEach(x=>{ x.style.transform=""; x.style.transition=""; });
  d.li.classList.remove("lifting"); d.ol.classList.remove("reordering");
  if(!(commit && order.join()!==d.order0 && commitOrder(order,d.pid))) render({focus:`[data-fk="grip-${d.pid}"]`});
}
document.addEventListener("pointerdown",e=>{
  const grip=e.target.closest&&e.target.closest(".grip"); if(!grip||e.button>0) return;
  const li=grip.closest(".stop"), ol=li.parentElement;
  rd={li,ol,grip,pid:li.dataset.pid,pointer:e.pointerId,y:e.clientY,y0:e.clientY,grabY:e.clientY-li.getBoundingClientRect().top,
      locked:[...ol.children].filter(x=>x.classList.contains("done")).length,active:false,raf:0,order0:[...ol.children].map(x=>x.dataset.pid).join()};
  grip.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove",e=>{

    rd.active=true; rd.li.classList.add("lifting"); rd.ol.classList.add("reordering"); rd.raf=requestAnimationFrame(rdFollow);
  }
  rdPlace(rd.y); rdReorder(rd.y); rdPlace(rd.y);
});

/* ---------- phone bottom sheet: Map / Split / List ---------- */
const mq=matchMedia("(max-width: 899px)");
const isPhone=()=>mq.matches;
const PEEK=140, ORDER=["peek","half","list"];
const stagePx=()=>$(".app").clientHeight-$("#tabs").offsetHeight;
const snapPx=st=>st==="peek"?PEEK : st==="half"?Math.round(stagePx()*.5) : stagePx()-48;
const panelPx=()=>$("#panel").getBoundingClientRect().height;
function applySheet(st,{refit=true}={}){
  state.sheet=st; const pn=$("#panel");
  if(!isPhone()){ pn.style.removeProperty("--sheet-h"); pn.removeAttribute("data-st"); return; }
  if(state.view==="describe"){ pn.style.setProperty("--sheet-h","100%"); pn.dataset.st="list"; return; }
  pn.style.setProperty("--sheet-h",snapPx(st)+"px"); pn.dataset.st=st;
  $("#grab").setAttribute("aria-label",t("grabLabel",{s:t("grab_"+st)}));
  if(refit){ lastFit=""; renderMap(); }
}
const cycleSheet=(dir=1)=>applySheet(ORDER[Math.max(0,Math.min(2,ORDER.indexOf(state.sheet)+dir))]);
let drag=null;
function dragStart(y,fromGrab){
  if(!isPhone()||state.view==="describe") return;
  drag={y0:y,h0:panelPx(),mode:fromGrab?"sheet":null,fromGrab,lastY:y,lastT:performance.now(),v:0};
}
function dragMove(y){
  if(!drag) return false;
  const dy=y-drag.y0, view=$("#view"), maxH=snapPx("list");
  if(drag.mode===null){
    if(Math.abs(dy)<6) return false;
    if(dy<0 && drag.h0<maxH-2) drag.mode="sheet";                        /* swipe up and the list is not full yet: grow the sheet first */
    else if(dy>0 && view.scrollTop<=0 && drag.h0>PEEK+2) drag.mode="sheet"; /* swipe down at the top of the list: give the map back */
    else drag.mode="scroll";
  }
  if(drag.mode!=="sheet") return false;
  const now=performance.now(); drag.v=(y-drag.lastY)/Math.max(1,now-drag.lastT); drag.lastY=y; drag.lastT=now;
  const pn=$("#panel"); pn.classList.add("dragging");
  pn.style.setProperty("--sheet-h",Math.max(PEEK,Math.min(maxH,drag.h0-dy))+"px");
  return true;
}
function dragEnd(){
  if(!drag) return;
  const d=drag; drag=null; const pn=$("#panel"); pn.classList.remove("dragging");
  if(d.mode!=="sheet") return;
  const h=panelPx(), moved=Math.abs(h-d.h0), pts=ORDER.map(snapPx);
  if(d.fromGrab && moved<6){ cycleSheet(state.sheet==="list"?-2:1); return; }          /* a tap on the handle */
  const proj=h-d.v*300;                                                                  /* where momentum would carry it (v: px/ms, down is positive) */
  const to=pts.reduce((bi,x,i)=>Math.abs(x-proj)<Math.abs(pts[bi]-proj)?i:bi,0);
  applySheet(ORDER[to]);
}

$("#grab").addEventListener("pointermove",e=>{ dragMove(e.clientY); });

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day-Off · Three intents</title>
<meta name="theme-color" content="#ffffff">
<script>
(function(){var p="system";try{p=localStorage.getItem("dayoff-theme")||"system";}catch(e){}
if(!/^(light|dark|system)$/.test(p))p="system";
var d=p==="dark"||(p==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
var r=document.documentElement;r.dataset.theme=d?"dark":"light";r.dataset.themePref=p;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="shared/base.css">
<style>
/* Redesign flow: Explore | Plan | Next stop. Same Wanderlog-style tokens as the main page (base.css), no green.
   Amber is the one new colour: it means "tight", never "go". */
:root{--amber:#9A6A0B;--amber-soft:#FBF0D4;--ease-drawer:cubic-bezier(.32,.72,0,1)}
:root[data-theme="dark"]{--amber:#F2C265;--amber-soft:#3A3115}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface)}
.scroll{flex:1;min-height:0;overflow:auto;padding:var(--s4) var(--gutter) 72px;scroll-behavior:auto}
@media (min-width:900px){.scroll{padding-bottom:var(--s5)}}
.col{max-width:560px;margin:0 auto;display:grid;gap:var(--s5);align-content:start}
.col>.areabar+*{margin-top:calc(-1*var(--s2))}   /* the area pill belongs to the block under it */
.col.enter>*{animation:enter 200ms var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
.mapcol{display:none;position:relative;min-height:0;background:var(--surface);isolation:isolate;z-index:0}
#map{position:absolute;inset:0}
@media (min-width:900px){.app{grid-template-columns:55fr 45fr}.mapcol{display:block;border-left:1px solid var(--line)}.mapfab{display:none!important}}
body.mapopen .mapcol{display:block;position:fixed;inset:var(--header-h) 0 0 0;z-index:40}
.mapclose{position:absolute;top:var(--s3);left:var(--s3);z-index:1200}
@media (min-width:900px){.mapclose{display:none}}
h1{font-size:clamp(26px,6.5vw,32px);line-height:1.15;letter-spacing:-.005em}
h2{font-size:20px;line-height:1.25}
small,.sub{color:var(--ink-2);font-size:13px;line-height:1.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:var(--s4);box-shadow:var(--shadow)}
.ibtn{display:inline-grid;place-items:center;width:var(--tap);height:var(--tap);border:0;border-radius:50%;background:var(--surface);color:var(--ink);flex:none;transition:transform 160ms var(--ease),background-color 160ms var(--ease)}
.ibtn:active{transform:scale(.95)}
.ibtn.sm{width:var(--tap-sm);height:var(--tap-sm)}
.ibtn .ico{width:18px;height:18px}
.ibtn[aria-pressed="true"]{background:var(--pill);color:var(--on-pill)}
@media (hover:hover) and (pointer:fine){.ibtn:hover{background:var(--track)}.ibtn[aria-pressed="true"]:hover{background:var(--pill)}}
.linkbtn{border:0;background:none;padding:0;min-height:var(--tap);font-weight:600;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-align:left;display:inline-flex;align-items:center;gap:6px}
.deftag{font-style:normal;font-size:11px;font-weight:600;line-height:1;padding:3px 6px;border-radius:6px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}

/* area pill */
.areabar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s3) 0 var(--s3);border-radius:999px;border:1px solid var(--track);background:var(--card);font-weight:600;font-size:14px;max-width:100%;transition:transform 160ms var(--ease),background-color 160ms var(--ease)}
.pill:active{transform:scale(.97)}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (hover:hover) and (pointer:fine){.pill:hover{background:var(--surface)}}

/* home */
.intents{display:grid;gap:var(--s3)}
.intent{display:grid;grid-template-columns:48px 1fr 20px;gap:var(--s3);align-items:center;text-align:left;min-height:84px;padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);transition:transform 160ms var(--ease),border-color 160ms var(--ease)}
.intent:active{transform:scale(.985)}
.intent .ib{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--pill);color:var(--on-pill)}
.intent:first-child .ib{background:var(--pill)}
.intent .ib .ico{width:22px;height:22px}
.intent b{display:block;font:500 19px/1.2 var(--f-head);margin-bottom:2px}
.intent small{display:block}
.intent>.ico{transform:rotate(-90deg);color:var(--ink-2)}
@media (hover:hover) and (pointer:fine){.intent:hover{border-color:var(--ink)}}
.demo-note{font-size:12px;color:var(--ink-2)}
.resume{display:flex;align-items:center;gap:var(--s3);justify-content:space-between;flex-wrap:wrap}

/* explore */
.sbox{display:flex;align-items:center;gap:var(--s2);min-height:48px;padding:0 6px 0 var(--s4);border:1px solid var(--track);border-radius:999px;background:var(--card)}
.sbox:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.sbox input{flex:1;min-width:0;border:0;background:transparent;outline:0;min-height:44px;font-size:15px}
.sbox input::-webkit-search-cancel-button{display:none}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap}
/* place card: the main page card (image band, whole card adds, check + ring, expandable why) */
.pcs{display:grid;gap:var(--s3)}
.pc{position:relative;padding:0;transition:box-shadow 160ms var(--ease)}
.pc[data-in="true"]{box-shadow:0 0 0 2px var(--ink)}
:root[data-theme="dark"] .tone-ink{--t:#3A4659}
.pc-thumb{pointer-events:none;position:relative;width:100%;height:168px;border-radius:15px 15px 0 0;display:grid;place-items:center;color:var(--ic,#fff);background:var(--t)}
.pc-thumb .ico{width:36px;height:36px}
.pc-thumb .best{position:absolute;left:var(--s3);top:var(--s3)}
.pc-body{pointer-events:none;padding:var(--s4) var(--s4) 0}
.name-line{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s2)}
.name-line h3{font-size:16px;line-height:1.4}
.st{display:inline-flex;align-items:center;gap:4px;padding:0 var(--s2);border-radius:6px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;line-height:1.6}
.st .ico{width:12px;height:12px}
.st.warn{background:var(--gold-soft)}
.meta{font-size:13px;color:var(--ink-2);margin-top:2px}
.why1{font-size:13px;margin-top:var(--s2)}
.pc-add{position:absolute;inset:0;z-index:0;border:0;border-radius:16px;background:transparent;cursor:pointer;transition:background-color 160ms var(--ease)}
.pc-add:active{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.pc-add:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pc-sel{position:absolute;top:var(--s3);right:var(--s3);z-index:1;width:28px;height:28px;border-radius:50%;background:var(--pill);color:var(--on-pill);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity 160ms var(--ease),transform 160ms var(--ease);pointer-events:none}
.pc-sel .ico{width:14px;height:14px;stroke-width:3}
.pc[data-in="true"] .pc-sel{opacity:1;transform:none}
.pc-acts,.pc-more{position:relative;z-index:1;pointer-events:none}
.pc-acts{display:flex;flex-wrap:wrap;align-items:center;gap:0 var(--s2);margin:var(--s2) var(--s4) var(--s3)}
.pc-acts button{pointer-events:auto}
.pc-link{display:inline-flex;align-items:center;gap:4px;min-height:var(--tap-sm);padding:0 var(--s2) 0 0;border:0;background:transparent;font-weight:600;font-size:13px;text-decoration:underline;text-decoration-color:var(--track);text-underline-offset:3px}
.pc-link .ico{width:14px;height:14px;transition:transform 200ms var(--ease)}
.pc-link[aria-expanded="true"] .ico{transform:rotate(180deg)}
.pc-star{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:var(--tap-sm);padding:0 var(--s3);border-radius:999px;border:1px solid var(--track);background:var(--card);font-weight:600;font-size:13px;transition:background-color 160ms var(--ease),transform 160ms var(--ease)}
.pc-star:active{transform:scale(.97)}
.pc-star .ico{width:15px;height:15px}
.pc-star[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.pc-star[aria-pressed="true"] .ico{fill:currentColor}
.pc-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows 220ms var(--ease);margin:0 var(--s4)}
.pc-more.open{grid-template-rows:1fr;margin-bottom:var(--s3)}
.pc-more>div{overflow:hidden}
.pc-more .body{display:grid;gap:var(--s2);padding:var(--s1) 0 0;font-size:13px;color:var(--ink-2)}
.pc-more .body p{display:flex;gap:var(--s2);align-items:flex-start}
.pc-more .body .ico{margin-top:3px}
/* next stop as a conversation */
.chat{display:grid;gap:var(--s3);align-content:start}
.msg{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s2);justify-items:start;max-width:92%;min-width:0}
.msg>*{min-width:0;max-width:100%}
.msg:has(.pkrow){max-width:100%;width:100%}
.chat{grid-template-columns:minmax(0,1fr);min-width:0}
.scroll{overflow-x:hidden}
.msg.u{justify-items:end;justify-self:end}
.bub{padding:var(--s3) var(--s4);border-radius:18px 18px 18px 6px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:15px;line-height:1.5}
.msg.u .bub{background:var(--pill);color:var(--on-pill);border-color:transparent;border-radius:18px 18px 6px 18px;box-shadow:none}
.msg.in{animation:msgin 220ms var(--ease-drawer) backwards}
@keyframes msgin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.msg.in{animation:none}}
.msg .hero{width:min(100%,420px)}
.replies{display:flex;flex-wrap:wrap;gap:var(--s2)}
.composer{position:sticky;bottom:0;display:grid;gap:var(--s2);padding:var(--s3) 0 0;background:linear-gradient(to top,var(--surface) 80%,transparent)}
.composer form{display:flex;gap:var(--s2);align-items:center}
.composer input[type=text]{flex:1;min-width:0;min-height:var(--tap);padding:0 var(--s4);border-radius:999px;border:1px solid var(--track);background:var(--card);font:inherit}
.composer input[type=text]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sendbtn{width:var(--tap);height:var(--tap);border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;transition:transform 160ms var(--ease)}
.sendbtn:active{transform:scale(.95)}
.sendbtn .ico{width:20px;height:20px}
.empty{text-align:left}
.empty p{margin-top:var(--s2)}

/* plan form */
.say{display:grid;gap:var(--s2)}
.say .sbox{align-items:flex-start;padding:var(--s2) 6px var(--s2) var(--s4);border-radius:18px}
.say textarea{flex:1;border:0;background:transparent;outline:0;resize:none;min-height:56px;font-size:15px;line-height:1.5;padding:var(--s2) 0}
.fields{display:grid;padding:0}
.field{display:grid;grid-template-columns:96px 1fr;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4);border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.flabel{font-weight:600;font-size:14px}
.fval{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;min-width:0}
.fval input[type=time],.fval input[type=date]{min-height:var(--tap-sm);padding:0 var(--s3);border:1px solid var(--track);border-radius:999px;background:var(--card);font-weight:500;font-size:14px;color:var(--ink)}
.fval .chip{min-height:var(--tap-sm)}
@media (max-width:420px){.field{grid-template-columns:1fr}.fval{margin-top:-2px}}
.sect{display:grid;gap:var(--s3)}
.sect h2{font-size:17px}
.actgrid{display:flex;gap:var(--s2);flex-wrap:wrap}
.actgrid .chip .ico{width:15px;height:15px}
.line{display:flex;align-items:center;gap:0;flex-wrap:wrap;padding:var(--s3) var(--s2);margin:0 calc(-1*var(--s2))}
.lstop{display:flex;align-items:center;gap:2px;position:relative;padding-right:var(--s4)}
.lstop::after{content:"";position:absolute;right:2px;top:50%;width:var(--s3);height:3px;margin-top:-1.5px;background:var(--accent);border-radius:2px}
.lstop:last-child{padding-right:0}.lstop:last-child::after{display:none}
.ldot{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:500 12px/1 var(--f-head);flex:none}
.lname{display:inline-flex;align-items:center;gap:2px;min-height:var(--tap-sm);padding:0 4px 0 var(--s2);border:1px solid var(--track);border-radius:999px;background:var(--card);font-weight:600;font-size:13px;margin-left:4px}
.lname button{border:0;background:transparent;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;padding:0;color:var(--ink-2)}
.lname button .ico{width:14px;height:14px}
.lname button:hover{background:var(--surface);color:var(--ink)}
.lname .mvl .ico{transform:rotate(90deg)}.lname .mvr .ico{transform:rotate(-90deg)}
.lstop[draggable=true]{cursor:grab}
.lstop.drag{opacity:.4}
.musts{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.btn.wide{width:100%;min-height:52px;font-size:16px}
.note{display:flex;gap:var(--s2);align-items:flex-start;font-size:13px;color:var(--ink-2)}
.note .ico{margin-top:3px}

/* day result */
.recap{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3)}
.recap p{font-size:14px;line-height:1.5}
.recap b{font-weight:600}
.health{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;padding:var(--s3) var(--s4);border-radius:14px;border:1px solid var(--line);background:var(--card)}
.hl{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;padding:4px 10px;border-radius:999px;line-height:1.3}
.hl .ico{width:15px;height:15px}
.hl-fits{background:var(--surface);color:var(--ink)}
.hl-tight{background:var(--amber-soft);color:var(--amber)}
.hl-no{background:var(--warn);color:var(--on-accent)}
:root[data-theme="dark"] .hl-no{color:#1A0B08}
.health.tight{border-color:var(--amber)}.health.no{border-color:var(--warn)}
.health .grow{flex:1;min-width:140px;font-size:13px;color:var(--ink-2)}
.banner{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:14px;background:var(--gold-soft);border:1px solid var(--gold);font-size:14px}
.banner .ico{margin-top:3px;color:var(--amber)}
.tl{display:grid;gap:0}
.stop{display:grid;grid-template-columns:32px 1fr;gap:var(--s3)}
.rail{position:relative;display:flex;flex-direction:column;align-items:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;width:4px;border-radius:2px;background:var(--accent);opacity:.9}
.stop:first-child .rail::before{top:20px}.stop:last-child .rail::before{bottom:calc(100% - 52px)}
.num{position:relative;z-index:1;margin-top:20px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:500 13px/1 var(--f-head);border:3px solid var(--surface)}
.stop.bad .num{background:var(--track);color:var(--ink-2)}
.stop.bad .rail::before{background:var(--track)}
.stop.done .num{background:var(--done)}
.sbody{padding-bottom:var(--s3);min-width:0}
.walkc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);min-height:20px;padding:2px 0 6px}
.walkc .ico{width:13px;height:13px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stop.bad .scard{background:transparent;border-style:dashed;border-color:var(--track);box-shadow:none}
.stop.bad .shead b{color:var(--ink-2)}
.shead{display:grid;grid-template-columns:52px 1fr auto;gap:var(--s2);align-items:center;width:100%;min-height:60px;padding:var(--s2) var(--s3);border:0;background:transparent;text-align:left}
.shead time{font:500 16px/1 var(--f-head);font-variant-numeric:tabular-nums}
.shead b{display:block;font-weight:600;line-height:1.3}
.shead small{display:block}
.shead .ico.cv{transition:transform 200ms var(--ease);color:var(--ink-2)}
.shead[aria-expanded="true"] .ico.cv{transform:rotate(180deg)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--surface);color:var(--ink)}
.badge .ico{width:11px;height:11px}
.badge.star{background:var(--gold);color:var(--on-gold)}.badge.star .ico{fill:currentColor}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.sdet{display:none;padding:0 var(--s3) var(--s3);gap:var(--s3);border-top:1px solid var(--line)}
.sdet.open{display:grid;padding-top:var(--s3);animation:enter 180ms var(--ease)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);text-align:center}
.times div{background:var(--surface);border-radius:10px;padding:6px 4px}
.times b{display:block;font:500 15px var(--f-head);font-variant-numeric:tabular-nums}
.times small{font-size:12px}
.stepper{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.stepper .val{min-width:84px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.pinopts{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.srow{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.srow .lbl{font-weight:600;font-size:13px;min-width:56px}
.warnrow{display:flex;gap:var(--s2);align-items:flex-start;padding:0 var(--s3) var(--s3);font-size:13px;color:var(--amber)}
.warnrow .ico{margin-top:2px;flex:none}
.stop.bad .warnrow{padding-top:0}
.fixrow{display:flex;gap:var(--s2);flex-wrap:wrap;padding:0 var(--s3) var(--s3)}
.totals{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:14px;font-weight:600;padding:var(--s2) 0}
.reveal .stop{animation:rise 320ms var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}

/* next stop */
.hero{padding:0;overflow:hidden}
.hero .band{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);background:var(--t,#1B2233);color:var(--ic,#fff)}
.hero .band .ico{width:30px;height:30px}
.hero h2{font-size:clamp(24px,6vw,30px);line-height:1.15;color:inherit}
.hero .band small{color:inherit;opacity:.85}
.hero .facts{display:grid;gap:var(--s2);padding:var(--s4);font-size:15px}
.hero .facts p{display:flex;gap:var(--s3);align-items:center}
.hero .facts .ico{width:18px;height:18px;color:var(--ink-2)}
.hero .acts{display:grid;grid-template-columns:2fr 1fr;gap:var(--s2);padding:0 var(--s4) var(--s4)}
.hero .acts .btn{min-height:52px;font-size:15px}
.hero .acts .btn.single{grid-column:1/-1}
.hero .acts:has(.single){grid-template-columns:1fr 1fr}
details.dopt{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 var(--s4)}
details.dopt summary{cursor:pointer;min-height:48px;display:flex;align-items:center;gap:var(--s2);font-weight:600;list-style:none}
details.dopt summary::-webkit-details-marker{display:none}
details.dopt[open]{padding-bottom:var(--s3)}
details.dopt input[type=time]{min-height:var(--tap-sm);padding:0 var(--s3);border:1px solid var(--track);border-radius:999px;background:var(--card);color:var(--ink);font-weight:500}
.doneList{font-size:13px;color:var(--ink-2)}

/* dock: day bar + tabs */
.dockwrap{position:relative;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.mapfab{position:absolute;right:var(--gutter);top:-52px;box-shadow:0 6px 16px -6px rgba(0,0,0,.4)}
.daybar{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:52px;padding:0 var(--gutter);border:0;border-bottom:1px solid var(--line);background:var(--card);text-align:left}
.daybar .dn{font-weight:600}
.daybar .dgo{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px}
.daybar .dgo .ico{transform:rotate(-90deg)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:900;background:rgba(10,14,22,.45);animation:fadeIn 180ms ease-out both}

.sheet{position:fixed;z-index:901;left:0;right:0;bottom:0;max-height:86dvh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:var(--s3) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));animation:sheetUp 260ms var(--ease-drawer) both}
@keyframes sheetUp{from{transform:translateY(100%)}}
@media (min-width:640px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:440px;border-radius:20px;transform:translate(-50%,-50%);animation:sheetIn 200ms var(--ease) both}@keyframes sheetIn{from{opacity:0;transform:translate(-50%,-48%) scale(.97)}}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--track);margin:0 auto var(--s3)}

.pickbar{position:fixed;z-index:1500;left:var(--s3);right:var(--s3);top:calc(var(--header-h) + var(--s3));display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s2) var(--s3) var(--s2) var(--s4);border-radius:999px;background:var(--toast-bg);color:var(--toast-fg);font-weight:600;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}

/* getting there + Navigate (ported from the main page) */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2);margin-top:var(--s3)}
.modes button{display:grid;gap:2px;justify-items:center;align-content:center;min-height:64px;padding:var(--s2) var(--s1);border:1px solid var(--track);border-radius:12px;background:transparent;font-size:12px;color:var(--ink-2);transition:background-color 160ms var(--ease),transform 160ms var(--ease)}
.modes button:active{transform:scale(.97)}

.modes button[aria-pressed="true"]{background:var(--pill);border-color:var(--pill);color:var(--on-pill)}
.modes button[aria-pressed="true"] b{color:var(--on-pill)}
.modes button:disabled{opacity:.45}
.routeline{font-size:13px;color:var(--ink-2);margin-top:var(--s2)}
.navacts{display:grid;gap:var(--s2);margin-top:var(--s4)}
.navacts .btn{min-height:52px}
.navbar{position:fixed;z-index:1200;top:0;left:0;right:0;display:grid;gap:var(--s3);padding:calc(var(--s4) + env(safe-area-inset-top)) var(--gutter) var(--s3);background:var(--pill);color:var(--on-pill);box-shadow:0 8px 24px -6px rgba(0,0,0,.45);transition:background-color 200ms var(--ease)}
.navbar.done{background:var(--accent);color:var(--on-accent)}
.navbar[hidden],.navfoot[hidden],.nav-acts [hidden]{display:none}
.nav-main{display:flex;gap:var(--s4);align-items:center}
.nav-ic{flex:none;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:30px;line-height:1}
.navbar.done .nav-ic{background:var(--on-accent);color:var(--accent)}
.nav-txt{font-weight:600;font-size:22px;line-height:1.25}
.nav-meta{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.nav-prog{height:4px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden}
.nav-prog i{display:block;height:100%;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform 240ms linear}
.navbar.done .nav-prog i{background:var(--on-accent)}
.navfoot{position:fixed;z-index:1200;left:0;right:0;bottom:0;display:grid;gap:var(--s3);padding:var(--s4) var(--gutter) calc(var(--s4) + env(safe-area-inset-bottom));background:var(--bg);color:var(--ink);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px -8px rgba(27,34,51,.3)}

.nf-name{font-size:14px;color:var(--ink-2)}
.nf-mode{display:inline-flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);border-radius:999px;background:var(--surface);font-size:13px;font-weight:600}

.nav-acts{display:flex;gap:var(--s2)}
.nav-acts .btn{flex:1;min-height:var(--tap)}
.navcenter{position:absolute;right:var(--gutter);top:-64px;width:48px;height:48px;border:0;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 14px -4px rgba(0,0,0,.4)}

.nav-demo{font-size:12px;color:var(--ink-2)}
body.navmode .header,body.navmode .side,body.navmode #pickbar{display:none !important}
body.navmode .app{grid-template-columns:minmax(0,1fr)}
body.navmode .mapcol{display:block;position:fixed;inset:0;z-index:1000;border:0}
body.navmode .mapclose,body.navmode .mapfab{display:none}
body.navmode .leaflet-top{margin-top:130px}

/* placeholder art: a tone, a quiet pattern and the place icon. PH[id] swaps in real photos later. */
.art{position:relative;overflow:hidden;display:grid;place-items:center;background:var(--t);color:var(--ic,#fff)}
.art::before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none}
.art.a0::before{background:radial-gradient(circle at 20% 25%,currentColor 0 2px,transparent 3px) 0 0/22px 22px}
.art.a1::before{background:repeating-linear-gradient(135deg,currentColor 0 2px,transparent 2px 14px)}
.art.a2::before{background:radial-gradient(circle at 50% 100%,transparent 0 46%,currentColor 47% 50%,transparent 51%) 0 0/36px 36px}
.art.a3::before{background:radial-gradient(circle at 80% 20%,currentColor 0 18%,transparent 19%),radial-gradient(circle at 80% 20%,transparent 0 30%,currentColor 31% 33%,transparent 34%)}
.art .ico{position:relative;width:34px;height:34px}
.art.a1 .ico{transform:translateX(-14%)}
.art.a3 .ico{transform:translate(-18%,12%)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* place info: a panel over the map on desktop, a sheet over the map on phones */
.app{position:relative}
.pinfo{position:absolute;z-index:30;left:0;right:0;bottom:var(--dock-h,58px);max-height:78%;display:flex;flex-direction:column;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px -12px rgba(0,0,0,.45);animation:msgin 240ms var(--ease-drawer)}

@media (min-width:900px){.pinfo{left:auto;right:12px;bottom:12px;width:calc(45% - 24px);max-height:66%;border-radius:16px;box-shadow:0 14px 34px -14px rgba(0,0,0,.5)}}
.pi-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:0 var(--s3) 0 var(--s4);border-bottom:1px solid var(--line)}
.pi-tabs{display:flex;gap:var(--s5)}
.pi-tabs button{min-height:48px;border:0;border-bottom:2px solid transparent;background:none;font-weight:600;font-size:14px;color:var(--ink-2)}
.pi-tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pi-tabs button:focus-visible,.pi-x:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.pi-body{overflow:auto;overscroll-behavior:contain;padding:var(--s4);display:grid;gap:var(--s3);align-content:start}
.pi-head{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:var(--s3);align-items:start}
.pi-head h2{font-size:20px;line-height:1.25}
.pi-head .art{width:96px;height:80px;border-radius:12px}
.pi-acts{display:flex;flex-wrap:wrap;gap:var(--s2)}
.pi-acts .btn{min-height:var(--tap-sm);padding:0 var(--s4);font-size:14px}
.pi-facts{display:grid;gap:var(--s2);font-size:14px}

.pi-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}

.vrow{display:grid;grid-template-columns:110px minmax(0,1fr) 28px;gap:var(--s3);align-items:center;font-size:13px}
.vrow i{display:block;height:6px;border-radius:3px;background:var(--track);position:relative;overflow:hidden}

body.navmode .pinfo{display:none}

/* phone: the map is the page, the content is a three-height sheet over it */
.pane{display:flex;flex-direction:column;flex:1;min-height:0}
.grab{display:none}
@media (max-width:899px){
  .app{display:block}
  .mapcol{display:block;position:absolute;inset:0;border:0}
  .side{position:absolute;inset:0;display:block;pointer-events:none;background:transparent;z-index:2}
  .pane{pointer-events:auto;position:absolute;left:0;right:0;top:0;bottom:var(--dock-h,58px);background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -8px 24px -12px rgba(0,0,0,.4);transform:translateY(var(--sy,0px));transition:transform 280ms var(--ease-drawer);will-change:transform}
  .pane.drag{transition:none}
  .grab{display:grid;place-items:center;flex:none;width:100%;height:28px;border:0;background:transparent;touch-action:none;cursor:grab}
  .grab::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--track)}
  .grab:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
  .scroll{padding-bottom:calc(var(--sy,0px) + var(--s5))}
  #dock{pointer-events:auto;position:absolute;left:0;right:0;bottom:0;z-index:3}
  body.mapopen .pane,body.mapopen #dock{display:none}
  .leaflet-top{margin-top:0}
  .mapcol .mapsw{bottom:calc(var(--dock-h,64px) + var(--s2))}
  .mapcol .leaflet-bottom{margin-bottom:var(--dock-h,64px)}
}
@media (prefers-reduced-motion:reduce){.pane{transition:none}}

/* explore: feed of community posts, trips, then the old search as Places */
.exseg{display:flex;gap:var(--s1);padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.exseg button{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;font-weight:600;font-size:14px;transition:background-color 160ms var(--ease),color 160ms var(--ease)}
.exseg button[aria-selected="true"]{background:var(--pill);color:var(--on-pill)}
.exseg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.feed{columns:2;column-gap:var(--s3)}
.fc{break-inside:avoid;margin-bottom:var(--s5)}

.fc-share:focus-visible{outline:2px solid #fff;outline-offset:2px}
.fc-n{position:absolute;left:var(--s2);bottom:var(--s2);padding:2px var(--s2);border-radius:6px;background:rgba(27,34,51,.72);color:#fff;font-size:12px;font-weight:600}

.hbtn{border:0;background:none;color:inherit;min-height:var(--tap-sm);padding:0 4px;font:inherit}

.av{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600}
.trip{display:grid;gap:var(--s4)}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2);border-radius:16px;overflow:hidden}

.trow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:var(--s3);align-items:center;width:100%;padding:var(--s2);border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;transition:background-color 160ms var(--ease)}
.trow:active{background:var(--surface)}
.trow:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.trow-art{width:64px;height:56px;border-radius:10px}
.trow small{display:block;color:var(--ink-2);font-size:13px}
/* places list cards: tap opens the place, the round button adds */
.pc-media{position:relative;z-index:1;pointer-events:none}

.pc-plus{pointer-events:auto;position:absolute;top:var(--s3);right:var(--s3);width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--card);color:var(--ink);box-shadow:0 2px 8px -2px rgba(0,0,0,.35);transition:transform 160ms var(--ease),background-color 160ms var(--ease)}
.pc-plus:active{transform:scale(.92)}

.pc-plus:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* plan: pick step (choices before the plan), then the editable list */
.pk{display:grid;gap:var(--s5)}
.pksec{display:grid;gap:var(--s3);min-width:0}

.pkrow,.recrow{display:flex;gap:var(--s3);overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 var(--gutter);margin:0 calc(-1*var(--gutter));padding:2px var(--gutter) var(--s2);scrollbar-width:none;min-width:0}
.pkrow::-webkit-scrollbar,.recrow::-webkit-scrollbar{display:none}
.pkc{position:relative;flex:0 0 172px;scroll-snap-align:start;display:grid;align-content:start;gap:var(--s1);text-align:left;padding:0 0 var(--s3);border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);transition:box-shadow 160ms var(--ease),transform 160ms var(--ease)}

.pkc.skip .ico{width:24px;height:24px;margin:0 auto var(--s2)}
.plh{font-size:22px}
.st-art{width:48px;height:40px;border-radius:8px}

.pnote{width:100%;resize:vertical;min-height:64px;padding:var(--s3);border:1px solid var(--track);border-radius:12px;background:var(--surface);font:inherit;font-size:14px;color:var(--ink)}

.addrow{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:56px;padding:0 var(--s4);border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-weight:600;color:var(--ink-2);text-align:left;transition:background-color 160ms var(--ease)}
.addrow:active{background:var(--surface)}

.rec{flex:0 0 232px;display:grid;grid-template-columns:56px minmax(0,1fr) 40px;gap:var(--s2);align-items:center;padding:var(--s2);border:1px dashed var(--track);border-radius:14px;background:var(--card);scroll-snap-align:start}
.rec .art{width:56px;height:48px;border-radius:10px}
.rec .art .ico{width:22px;height:22px}
.rec b{display:block;font-size:14px;line-height:1.25;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec small{display:block;font-size:12px}
.rec .rplus{width:40px;height:40px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);transition:transform 160ms var(--ease),background-color 160ms var(--ease)}
.rec .rplus:active{transform:scale(.92)}
.rec .rplus:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.shead{grid-template-columns:52px minmax(0,1fr) 48px auto}
.pkn{position:absolute;top:var(--s2);left:var(--s2);width:26px;height:26px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;font:600 13px/1 var(--f-head);box-shadow:0 2px 6px -2px rgba(0,0,0,.4)}
.optsrow{margin:0;padding:2px 2px var(--s2)}

/* home dashboard */
.dash{display:grid;gap:var(--s5);min-width:0}
.today{display:grid;gap:var(--s2);background:var(--pill);color:var(--on-pill);border-color:transparent}

.today .trow2{display:flex}
.today .tacts{margin-top:var(--s2)}
.today .btn.ghost{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--on-pill) 45%,transparent)}
.today .btn.primary{background:var(--accent);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.tile{display:grid;gap:var(--s1);align-content:start;justify-items:start;text-align:left;padding:var(--s3);border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);transition:transform 160ms var(--ease),border-color 160ms var(--ease)}
.tile:active{transform:scale(.97)}
.tile:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tile .ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--accent);margin-bottom:var(--s1)}
.tile .ib .ico{width:20px;height:20px}
.tile b{font:500 16px/1.2 var(--f-head)}
.tile small{font-size:12px;line-height:1.35}
@media (hover:hover) and (pointer:fine){.tile:hover{border-color:var(--ink)}}
.cal{display:grid;gap:var(--s3)}
.cal-head{display:flex;align-items:center;gap:var(--s2)}
.cal-head h2{flex:1;font-size:18px;min-width:0}
.cal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s1)}
.cal-d{position:relative;display:grid;justify-items:center;align-content:center;gap:2px;min-height:62px;padding:var(--s2) 0;border:1px solid var(--line);border-radius:14px;background:var(--card);font-variant-numeric:tabular-nums;transition:background-color 160ms var(--ease),transform 160ms var(--ease)}
.cal-d:active{transform:scale(.95)}
.cal-d:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cal-d small{font-size:11px;color:var(--ink-2)}
.cal-d b{font:500 17px/1 var(--f-head)}
.cal-d .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal-d .dot[hidden]{display:block;visibility:hidden}
.cal-d.today b{color:var(--accent)}
.cal-d[aria-pressed="true"]{background:var(--pill);color:var(--on-pill);border-color:transparent}
.cal-d[aria-pressed="true"] small,.cal-d[aria-pressed="true"].today b{color:inherit}
.cal-days.month .cal-d{min-height:46px;padding:var(--s1) 0}
.cal-days.month .cal-d small{display:none}
.cal-wkrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;color:var(--ink-2)}
.cal-day{display:grid;gap:var(--s2)}
.cal-day h3{font-size:14px;color:var(--ink-2);font-weight:600}
.trips{display:grid;gap:var(--s3)}
.trlist{display:grid;gap:var(--s2)}
.trn{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--surface);font-size:11px;line-height:18px;text-align:center}
.exseg button[aria-selected="true"] .trn{background:color-mix(in srgb,var(--on-pill) 22%,transparent)}
.trc{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:var(--s2) var(--s3) var(--s2) var(--s2)}
.tr-art{width:64px;height:64px;border-radius:12px}
.tr-art .ico{width:26px;height:26px}
.trc b{display:block;font-weight:600;line-height:1.3}
.trc small{display:block}
.trbadge{display:inline-block;margin-top:4px;padding:0 var(--s2);border-radius:6px;background:var(--amber-soft);color:var(--amber);font-size:12px;font-weight:600;line-height:1.6}
.trbadge.ok{background:var(--surface);color:var(--ink-2)}
.cal-day .empty{padding:var(--s3)}

/* floating dock: sliding pill, raised Next stop button, stop-count badge */
.dockwrap{background:transparent;border-top:0;padding:0 var(--s3) calc(var(--s3) + env(safe-area-inset-bottom))}
.dockwrap .daybar{border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:0 auto var(--s2);max-width:520px}
.tabs.dock{position:relative;grid-template-columns:repeat(5,minmax(0,1fr));max-width:520px;margin:var(--s5) auto 0;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 10px 28px -12px rgba(0,0,0,.35)}
.daybar+.tabs.dock{margin-top:var(--s6,28px)}
.tabs.dock .slider{position:absolute;top:6px;bottom:6px;left:0;border-radius:18px;background:color-mix(in srgb,var(--accent) 12%,transparent);pointer-events:none;opacity:0;transition:transform 320ms var(--ease-drawer),width 320ms var(--ease-drawer),opacity 160ms var(--ease)}
.tabs.dock .tab{z-index:1;min-height:56px;border-radius:18px}
.tabs.dock .tab[aria-current="page"]::before{display:none}
.tabs.dock .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-5px}
.tabs.dock .tab[aria-current="page"]:not(.tabnext) .ico{fill:color-mix(in srgb,currentColor 20%,transparent)}
.tabnext{color:var(--ink);justify-content:flex-end;gap:0;padding-bottom:7px}
.tabnext[aria-current="page"]{color:var(--accent)}
.tabnext .nb{position:absolute;top:-26px;left:50%;width:58px;height:58px;margin-left:-29px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;border:5px solid var(--card);box-shadow:0 6px 14px -8px rgba(0,0,0,.4);transition:transform 220ms var(--ease-drawer),outline-offset 220ms var(--ease)}
.tabnext .nb .ico{width:26px;height:26px}
.tabnext:active .nb{transform:scale(.93)}
.tabnext[aria-current="page"] .nb{transform:translateY(-3px);outline:3px solid var(--accent);outline-offset:0}
.tabnext span:last-child{padding:1px 10px;border-radius:10px;transition:background-color 160ms var(--ease)}
.tabnext[aria-current="page"] span:last-child{background:var(--accent);color:#fff;font-weight:700}
.tabnext span:last-child{font-variant-numeric:tabular-nums}
.bdg{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font:600 11px/18px var(--f-body,inherit);font-style:normal;text-align:center;animation:msgin 260ms var(--ease-drawer)}
@media (prefers-reduced-motion:reduce){.tabs.dock .slider,.tabnext .nb,.bdg{transition:none;animation:none}}
</style>
</head>

/* ---------- planner: the shared simulator extended with must-visit, fixed times, activity order and a Tight state ---------- */
function simF(order,start,prev,endMin,ctx){
  let now=start, walk=0; const items=[], dropped=[];
  for(const id of order){
    const p=P[id];
    if(p.status==="closed"){ dropped.push({id,reason:"closedday"}); continue; }
    const unknown=p.status==="unknown", open=unknown?0:p.open, close=unknown?Infinity:p.close;
    const w=prev?walkMin(prev,p):0, arr=now+w, fx=ctx.fixed[id];
    let s=Math.max(arr,open), conflict=null, miss=null;
    if(fx!=null){ if(arr>fx){ conflict="fixed"; miss=arr; } else s=Math.max(s,fx); }
    const end=s+durOf(p);
    if(end>close){ dropped.push({id,reason:arr<open?"late":"early"}); continue; }
    if(end>endMin){ dropped.push({id,reason:"window"}); continue; }
    items.push({id,walk:w,wait:s-arr,arr,start:s,end,conflict,miss,slack:close===Infinity?Infinity:close-end});
    walk+=w; now=end; prev=p;
  }
  return {items,dropped,finish:now,walk};
}
function solveF(ids,start,prev,endMin,ctx){
  if(!ids.length) return {items:[],dropped:[],finish:start,walk:0};
  const rank=id=>{ const a=F.actOf[id]; return a?F.acts.indexOf(a):-1; };
  const run=pins=>{
    const pinned=Object.keys(pins).filter(id=>ids.includes(id)); let best=null;
    (function perm(rest,cur){
      if(!rest.length){
        for(const id of pinned) if(cur.indexOf(id)+ctx.base!==pins[id]) return;
        const r=simF(cur,start,prev,endMin,ctx); let inv=0;
        for(let i=0;i<cur.length;i++) for(let j=i+1;j<cur.length;j++){ const a=rank(cur[i]), b=rank(cur[j]); if(a>=0&&b>=0&&a>b) inv++; }
        const mustDrop=r.dropped.filter(d=>ctx.musts.has(d.id)).length;
        const cost=mustDrop*1e7+r.dropped.length*1e5+r.items.filter(i=>i.conflict).length*1e4+inv*300+r.finish+r.walk*.01;
        if(!best||cost<best.cost) best={...r,cost}; return;
      }
      rest.forEach((id,i)=>perm([...rest.slice(0,i),...rest.slice(i+1)],[...cur,id]));
    })(ids,[]);
    return best;
  };
  return (Object.keys(ctx.pins).some(id=>ids.includes(id))&&run(ctx.pins))||run({});   /* pins are kept when any order allows them */
}
function planF(){
  syncState();
  const vs=state.visits.filter(v=>state.tray.includes(v.id)), items=[]; let prev=startPt(), walk=0;
  vs.forEach(v=>{ const p=P[v.id], w=walkMin(prev,p); items.push({id:v.id,walk:w,wait:0,arr:v.start,start:v.start,end:v.end,done:true,slack:Infinity}); walk+=w; prev=p; });
  const rest=state.tray.filter(id=>!vs.some(v=>v.id===id));
  const t0=vs.length?vs[vs.length-1].end+state.delay:state.startMin+state.delay;
  const r=solveF(rest,t0,prev,state.endMin,{fixed:F.fixed,musts:F.musts,pins:state.pins,base:vs.length});
  const all=[...items,...r.items], finish=all.length?all[all.length-1].end:t0;
  const bad=r.dropped.length+r.items.filter(i=>i.conflict).length;
  const tight=!bad&&all.length&&(r.items.some(i=>i.slack<10)||state.endMin-finish<15);
  return {items:all,dropped:r.dropped,finish,walk:walk+r.walk,health:bad?"no":tight?"tight":"fits",bad};
}
function reasonOf(d){ const p=P[d.id]; return d.reason==="late"?t("rLate",{t:fmt(p.open)}):d.reason==="early"?t("rEarly",{t:fmt(p.close)}):d.reason==="window"?t("rWindow",{t:fmt(state.endMin)}):t("rClosedDay"); }

/* undo: one snapshot of everything the plan depends on */
const snap=()=>JSON.stringify({tray:state.tray,durs:state.durs,durSrc:F.durSrc,endMin:F.endMin,startMin:F.startMin,fixed:F.fixed,pins:state.pins,defs:F.defs,musts:[...F.musts],acts:F.acts,actOf:F.actOf,visits:state.visits});
function restore(s){ const o=JSON.parse(s); state.tray=o.tray; state.durs=o.durs; F.durSrc=o.durSrc; F.endMin=o.endMin; F.startMin=o.startMin; F.fixed=o.fixed; state.pins=o.pins; F.defs=o.defs; F.musts=new Set(o.musts); F.acts=o.acts; F.actOf=o.actOf; state.visits=o.visits; render(); }
const withUndo=(msg,fn)=>{ const s=snap(); fn(); render(); toast(msg,()=>restore(s)); };

/* ---------- build a day from the Plan inputs ---------- */
function buildDay(){
  syncState(); useDow(F.date.dow);
  const keep=state.tray.slice(), used=new Set(keep); F.actOf={}; F.notes=[];
  const parsed=parseQuery(F.q+" "+F.say), tags=[...new Set([...parsed.tags,...F.tags])];
  const score=id=>tags.length?tags.reduce((a,x)=>a+P[id].tags[x],0)/tags.length/5:0;
  let last=startPt();
  F.acts.forEach(a=>{
    const have=keep.find(id=>actsOf(P[id]).includes(a)&&!F.actOf[id]);
    if(have){ F.actOf[have]=a; if(!state.durs[have]||F.durSrc[have]!=="you") setStay(have,stayFor(a),"act:"+a); last=P[have]; return; }
    if(state.tray.length>=MAX_STOPS) return;
    const c=PLACES.filter(p=>!used.has(p.id)&&p.status!=="closed"&&inArea(p)&&actsOf(p).includes(a)).sort((x,y)=>(score(y.id)-score(x.id))||(meters(last,x)-meters(last,y)))[0];
    if(!c){ F.notes.push(t("none")); return; }
    used.add(c.id); state.tray.push(c.id); F.actOf[c.id]=a; setStay(c.id,stayFor(a),"act:"+a); last=c;
  });
  if(!F.acts.length&&state.tray.length<2){
    const types=new Set(state.tray.map(id=>P[id].type)), list=rank(" ",{tags:tags.length?tags:[],cafe:parsed.cafe}).list;
    for(const r of list){ const p=P[r.id]; if(state.tray.length>=4) break; if(used.has(p.id)||p.status==="closed"||!inArea(p)||types.has(p.type)) continue; state.tray.push(p.id); used.add(p.id); types.add(p.type); }
  }
  F.built=true; F.reveal=true; F.exp=null;
}
function addPlace(id,silent){
  const i=state.tray.indexOf(id);
  if(i>=0){ state.tray.splice(i,1); F.musts.delete(id); delete F.fixed[id]; delete state.pins[id]; delete F.actOf[id]; return; }
  if(state.tray.length>=MAX_STOPS){ toast(t("full")); return; }
  state.tray.push(id); if(!F.durSrc[id]) F.durSrc[id]="sug";
}

/* ---------- Fix it for me: the smallest change first, never silent (one Undo restores all) ---------- */
function fixIt(){
  const s=snap(), log=[]; let tightSteps=0;
  for(let k=0;k<16;k++){
    const pl=planF(); if(pl.health==="fits") break;
    if(pl.health==="tight"&&++tightSteps>2) break;
    const fx=pl.items.find(i=>i.conflict==="fixed");
    if(fx){ F.fixed[fx.id]=fx.miss; log.push(t("fixTime")); continue; }
    const cand=state.tray.filter(id=>!visited(id)).map(id=>[id,durOf(P[id])]).filter(x=>x[1]>30).sort((a,b)=>b[1]-a[1])[0];
    if(cand){ setStay(cand[0],cand[1]-15); log.push(t("fixShort")); continue; }
    if(F.endMin<1380){ F.endMin=Math.min(1380,F.endMin+30); F.defs.end=false; log.push(t("fixLater",{t:fmt(F.endMin)})); continue; }
    const dr=pl.dropped.find(d=>!F.musts.has(d.id)); if(dr){ addPlace(dr.id); log.push(t("fixDrop",{name:nm(P[dr.id])})); continue; }
    break;
  }
  const ok=planF().health!=="no";
  render(); toast(ok?t("fixDone",{what:[...new Set(log)].join(", ")||"–"}):t("fixPartial"),()=>restore(s));
}
function fixOne(id,kind){
  const s=snap(), p=P[id];
  if(kind==="earlier"){ if(F.startMin>420){ F.startMin-=60; F.defs.start=false; if(F.defs.end) defaults(); } else state.pins[id]=0; }
  else if(kind==="later"){ F.endMin=Math.min(1380,F.endMin+60); F.defs.end=false; }
  else if(kind==="short"){ setStay(id,durOf(p)-15); }
  else if(kind==="time"){ const it=planF().items.find(i=>i.id===id); if(it&&it.miss!=null) F.fixed[id]=it.miss; }
  else if(kind==="date"){ F.built=false; F.screen="plan"; render(); document.querySelector('[data-fk="date"]')?.focus(); return; }
  render(); toast(t("fixDone",{what:nm(p)}),()=>restore(s));
}

/* ---------- say it in your words ---------- */
function parseSay(s){
  const x=s.toLowerCase(), out={acts:[],tags:parseQuery(s).tags}, found=[];
  ACTS.forEach(a=>{ const m=ACT_RX[a].exec(x); if(m) found.push([m.index,a]); });
  out.acts=found.sort((a,b)=>a[0]-b[0]).map(f=>f[1]);
  const hr=(h,mi,ap)=>{ h=+h; mi=+(mi||0); if(ap==="pm"&&h<12) h+=12; else if(ap==="am"&&h===12) h=0; else if(!ap&&h<7) h+=12; return h*60+mi; };
  let m=/(?:back|home|leave|done|finish|until|by|before)\s*(?:by\s*)?(\d{1,2})(?::(\d\d))?\s*(am|pm)?/.exec(x);
  if(m) out.end=hr(m[1],m[2],m[3]);
  else if((m=/(?:กลับ|เสร็จ|ก่อน|ถึง)\s*(?:ก่อน\s*)?(\d{1,2})(?:[:.](\d\d))?\s*(โมงเย็น|ทุ่ม|โมง)?/.exec(x))) out.end=m[3]==="ทุ่ม"?(+m[1]+18)*60:hr(m[1],m[2],m[3]==="โมงเย็น"?"pm":null);
  m=/(?:start(?:ing)?|from|at)\s*(\d{1,2})(?::(\d\d))?\s*(am|pm)?/.exec(x)||/เริ่ม\s*(\d{1,2})(?:[:.](\d\d))?/.exec(x);
  if(m) out.start=hr(m[1],m[2],m[3]);
  if(/tomorrow|พรุ่งนี้/.test(x)) out.date="tomorrow";
  return out;
}
function fillSay(){
  const o=parseSay(F.say), got=[];
  if(o.acts.length){ F.acts=o.acts; got.push(t("fActs")); }
  if(o.tags.length){ F.tags=[...new Set([...F.tags,...o.tags])]; }
  if(o.date){ setDate(o.date); got.push(t("fDate")); }
  if(o.start!=null){ F.startMin=o.start; F.defs.start=false; if(F.defs.end) defaults(); got.push(t("fStart")); }
  if(o.end!=null&&o.end>F.startMin+30){ F.endMin=o.end; F.defs.end=false; got.push(t("fEnd")); }
  render(); toast(got.length?t("sayDone",{what:got.join(", ")}):t("sayNone"));
}
function setDate(k,val){
  if(k==="today") F.date={k,dow:REAL.dow}; else if(k==="tomorrow") F.date={k,dow:(REAL.dow+1)%7};
  else { const d=new Date(val+"T12:00:00"); if(isNaN(d)) return; F.date={k:"custom",iso:val,dow:(d.getDay()+6)%7,label:d.toLocaleDateString(state.lang==="th"?"th-TH":"en-GB",{weekday:"short",day:"numeric",month:"short"})}; }
  F.defs.date=k==="today"; defaults();
}
function listen(target){
  if(!SR) return; const r=new SR(); r.lang=state.lang==="th"?"th-TH":"en-US";
  r.onresult=e=>{ const s=e.results[0][0].transcript; if(target==="nq") nextSay(s); else if(target==="q"){ F.q=s; render(); } else { F.say=s; fillSay(); } };
  r.onerror=()=>toast(t("micFail")); try{ r.start(); toast(t("listening")); }catch(e){}
}

  const m=c=>pq.tags.length?pq.tags.reduce((a,x)=>a+c.p.tags[x],0)/pq.tags.length/5:0;
  return out.sort((a,b)=>(a.known===b.known?0:a.known?-1:1)||((last&&b.p.type!==last.type?1:0)-(last&&a.p.type!==last.type?1:0))||(m(b)-m(a))||(a.w-b.w));

  } else {

      <p>${icon("clock")}<span>${c.known?t("nOpen",{t:fmt(p.close)}):t("nUnknown")}</span></p>${c.known&&N.until!=null?`<p>${icon("route")}<span>${t("nLeft",{t:durText(Math.max(0,c.left))})}</span></p>`:""}`;

let mapSig="";
function renderMap(){
  if(!window.L) return; const sc=F.screen; let list=[], route=null;

  else if(sc==="explore") list=exploreList().list.map(r=>({id:r.id,kind:state.tray.includes(r.id)?"tray":"res"}));
  else if(sc==="plan"&&F.pk){ const picked=Object.values(F.picks); list=[...new Set(F.acts.flatMap(a=>pickCands(a).map(p=>p.id)))].map(id=>({id,kind:picked.includes(id)?"tray":"res"})); }
  else if(sc==="plan"&&F.built&&state.tray.length){ const pl=planF(); list=pl.items.map((it,i)=>({id:it.id,kind:it.done?"done":"num",n:i+1})); route=pl.items; }
  else if(sc==="next"){ const cs=nextOptions(), opt=F.next.stage==="options"&&!F.next.id?cs.slice(0,NX_MAX).map(c=>c.p.id):[]; list=cs.slice(0,12).map(c=>{ const oi=opt.indexOf(c.p.id), pk=c.p.id===F.next.id; return {id:c.p.id,kind:pk||oi>=0?"num":"res",n:pk?1:oi>=0?oi+1:undefined,best:pk}; }); if(F.next.id&&!list.some(x=>x.id===F.next.id)) list.push({id:F.next.id,kind:"num",n:1,best:true}); }
  else list=state.tray.map(id=>({id,kind:"tray"}));
  const sig=sc+(F.trip||F.exTab)+(F.pk?"pk":"")+(sc==="next"?F.next.stage+F.next.id:"")+JSON.stringify(list)+(sc==="next"?JSON.stringify(nextFrom()):"");
  if(sig!==mapSig){ mapSig=sig; DayMap.pins(list,{fit:true,extra:sc==="next"?nextFrom():null}); if(route) DayMap.route(route); }

}

  const tabs=[["about","piAbout"],["photos","piPhotos"],["vibe","piVibe"]].map(([k,l])=>`<button type="button" role="tab" id="pit-${k}" aria-selected="${tab===k}" data-act="info-tab" data-tab="${k}" data-fk="pit-${k}">${t(l)}</button>`).join("");
  const mine=Object.keys(p.tags).filter(x=>p.tags[x]!=null).sort((x,y)=>p.tags[y]-p.tags[x]);
  let body;
  if(tab==="photos") body=`<div class="pi-photos">${[0,1,2,3].map(i=>artOf(p,i)).join("")}</div><p class="sub">${t("piNote")}</p>`;
  else if(tab==="vibe") body=`<div>${mine.map(k=>`<div class="vrow"><span>${esc(TAGNAME[state.lang][k])}</span><i><b style="transform:scaleX(${p.tags[k]/5})"></b></i><span>${p.tags[k]}/5</span></div>`).join("")}</div><p class="sub">${t("piEst")}</p>`;
  else body=`<div class="pi-head"><div><h2>${esc(nmx)}</h2><p class="meta">${TYPENAME[state.lang][p.type]} · ${priceBand(p.price)} · ${AREA[state.lang][p.area]||""}</p></div>${artOf(p,0)}</div>
    <div class="pi-acts"><button type="button" class="btn ${inT?"dark":"primary"}" data-act="add" data-id="${id}" data-fk="pi-add" data-testid="pi-add" aria-pressed="${inT}">${icon(inT?"check":"plus")}${t(inT?"piIn":"piAdd")}</button>
      <button type="button" class="btn ghost" data-act="star" data-id="${id}" data-fk="pi-star" aria-pressed="${must}">${icon("star")}${t("mustTag")}</button>
      <button type="button" class="btn ghost" data-act="info-nav" data-id="${id}" data-fk="pi-nav" data-testid="pi-nav">${icon("walk")}${t("piNav")}</button></div>
    <div class="pi-facts"><p>${icon("clock")}<span>${p.status==="ok"?t("hours",{t:hoursText(p)}):t("hoursUnknown")}</span></p>
      <p>${icon("walk")}<span>${t("piWalk",{n:walkMin(startPt(),p),name:from})} · ${t("piVisit",{n:durOf(p)})}</span></p>
      <p>${icon("info")}<span>${mine.slice(0,3).map(k=>esc(TAGNAME[state.lang][k])).join(" · ")}</span></p></div>`;
  return `<div class="pi-top"><div class="pi-tabs" role="tablist" aria-label="${esc(nmx)}">${tabs}</div><button type="button" class="ibtn sm pi-x" data-act="info-x" data-fk="pi-x" data-testid="pi-close" aria-label="${esc(t("piClose"))}">${icon("x")}</button></div>
    <div class="pi-body" role="tabpanel" aria-labelledby="pit-${tab}" data-testid="pi-body">${body}</div>`;
}
function showInfo(){
  const el=$("#pinfo"); if(!el) return;
  if(!F.sel||!P[F.sel]){ el.hidden=true; el.innerHTML=""; return; }
  const open=!el.hidden, top=open&&el.querySelector(".pi-body")?el.querySelector(".pi-body").scrollTop:0;
  el.hidden=false; el.innerHTML=infoHTML(F.sel); if(open){ const b=el.querySelector(".pi-body"); if(b) b.scrollTop=top; }
  el.setAttribute("aria-label",nm(P[F.sel]));
}
function openInfo(id,focus){ F.sel=id; F.infoTab="about"; showInfo(); const b=$("#pinfo .pi-tabs button"); if(focus&&b) b.focus({preventScroll:true}); if(DayMap.focus) DayMap.focus(id); }
function closeInfo(){ F.sel=null; showInfo(); }

/* ---------- phone bottom sheet: peek, half, full ---------- */
const isPhone=()=>matchMedia("(max-width:899px)").matches;
const SNAPS=["peek","half","full"];
function snapPx(s){ const H=$("#pane").offsetHeight; return s==="full"?0:s==="half"?Math.round(H*.5):Math.max(0,H-132); }
function applySnap(){
  const pane=$("#pane"); if(!pane) return;
  if(!isPhone()){ pane.style.removeProperty("--sy"); return; }
  const sy=snapPx(F.snap); pane.style.setProperty("--sy",sy+"px"); if(window.DayMap&&DayMap.setPad) DayMap.setPad(Math.max(0,pane.offsetHeight-sy+($("#dock").offsetHeight||0)));
  const g=pane.querySelector(".grab"); if(g) g.setAttribute("aria-label",t("snapLbl")+": "+F.snap);
  setTimeout(()=>{ if(window.DayMap&&DayMap.invalidate) DayMap.invalidate(); },300);
}
const defaultSnap=()=>F.screen==="home"||F.screen==="trips"||F.screen==="next"&&F.next.stage==="ask"?"full":F.screen==="plan"&&!F.built?"full":"half";
let gd=null, skipClick=false;
document.addEventListener("pointerdown",e=>{ const g=e.target.closest&&e.target.closest(".grab"); if(!g||!isPhone()) return; gd={y:e.clientY,t:performance.now(),sy:snapPx(F.snap),moved:false,v:snapPx(F.snap)}; try{ g.setPointerCapture(e.pointerId); }catch(x){} });
document.addEventListener("pointermove",e=>{ if(!gd) return; const dy=e.clientY-gd.y; if(Math.abs(dy)>5) gd.moved=true; if(!gd.moved) return; $("#pane").classList.add("drag"); gd.v=Math.min(snapPx("peek"),Math.max(0,gd.sy+dy)); $("#pane").style.setProperty("--sy",gd.v+"px"); });
document.addEventListener("pointerup",e=>{
  if(!gd) return; const g=gd; gd=null; $("#pane").classList.remove("drag"); if(!g.moved) return;
  skipClick=true; setTimeout(()=>{ skipClick=false; },60);
  const vel=(e.clientY-g.y)/Math.max(1,performance.now()-g.t), pts=SNAPS.map(s=>[s,snapPx(s)]);
  let pick=pts.reduce((a,b)=>Math.abs(b[1]-g.v)<Math.abs(a[1]-g.v)?b:a)[0];
  if(Math.abs(vel)>.6){ const i=SNAPS.indexOf(F.snap); pick=SNAPS[Math.max(0,Math.min(2,i+(vel>0?-1:1)))]; }
  F.snap=pick; applySnap(); mapSig=""; renderMap();
});
addEventListener("resize",()=>applySnap());
if(window.ResizeObserver) new ResizeObserver(()=>{ const d=$("#dock"); if(d) document.querySelector(".app").style.setProperty("--dock-h",d.offsetHeight+"px"); applySnap(); }).observe($("#dock"));

/* ---------- render ---------- */
function render(){
  const cur=document.activeElement, key=cur&&cur.dataset&&cur.dataset.fk;
  useDow(F.screen==="plan"?F.date.dow:REAL.dow);
  const col=$("#col"); col.innerHTML=VIEWS[F.screen](); col.classList.toggle("enter",F.enter);
  syncTrip(); $("#dock").innerHTML=dockHTML(); animateSlider(); updateChrome(); applySnap(); renderMap(); showInfo();
  if(key&&KBD){ const el=document.querySelector(`[data-fk="${key}"]`); if(el) el.focus({preventScroll:true}); }
  F.enter=false; if(F.reveal){ F.reveal=false; }
}
function go(s){ F.screen=s; F.enter=true; F.exp=null; if(s==="next"){ Object.assign(F.next,{id:null,phase:"suggest",stage:"ask",q:"",acts:[]}); F.nlog=[]; } F.snap=defaultSnap(); $("#scroll").scrollTop=0; mapSig=""; render(); }

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act, id=b.dataset.id;
  if(a==="go"){ go(b.dataset.s); }
  else if(a==="tab") navTo(b.dataset.s);
  else if(a==="cal-day"){ F.calSel=b.dataset.iso; render(); }
  else if(a==="cal-prev"||a==="cal-next"){ const d=1*(a==="cal-next"?1:-1), an=fromISO(F.calAnchor); F.calAnchor=isoOf(F.calMonth?new Date(an.getFullYear(),an.getMonth()+d,1,12):addDays(an,7*d)); render(); }
  else if(a==="cal-mode"){ F.calMonth=!F.calMonth; F.calAnchor=F.calSel; render(); }
  else if(a==="cal-plan"){ if(F.built){ state.tray=[]; F.musts=new Set(); F.fixed={}; state.pins={}; F.actOf={}; F.acts=[]; F.built=false; } F.tripId=null; F.pk=false; setDate(F.calSel===TODAY_ISO?"today":"custom",F.calSel); go("plan"); }
  else if(a==="tr-tab"){ F.trTab=b.dataset.k; render(); }
  else if(a==="trip-again"){ openTrip(allTrips().find(x=>x.id===id)); }
  else if(a==="saved-open"){ F.trip=id; F.exTab="for"; go("explore"); }
  else if(a==="openday"){ F.built=true; go("plan"); }
  else if(a==="sample"){ F.tripId=null; state.tray=["soheng","eiahsae","gulongbao"].filter(x=>P[x]); if(state.tray.length<3) state.tray=PLACES.slice(0,3).map(p=>p.id); F.built=true; go("plan"); }
  else if(a==="area") areaSheet();
  else if(a==="area-set"){ F.area={k:b.dataset.k}; closeSheet(); mapSig=""; render(); }
  else if(a==="area-pickmap") startPick("area");
  else if(a==="sheet-x") closeSheet();
  else if(a==="from") fromSheet();
  else if(a==="from-set"){ F.start={k:"default"}; F.defs.from=true; closeSheet(); render(); }
  else if(a==="from-gps"){ closeSheet(); locate(g=>{ F.start={k:"gps",lat:g.lat,lng:g.lng,name:t("yourLoc")}; F.defs.from=false; render(); }); }
  else if(a==="from-pin") startPick("start");
  else if(a==="from-place"){ const p=P[id]; if(F.fromFor==="next"){ F.next.pos={lat:p.lat,lng:p.lng,name:nm(p)}; F.next.id=null; mapSig=""; } else { F.start={k:"search",lat:p.lat,lng:p.lng,name:nm(p)}; F.defs.from=false; } closeSheet(); render(); }
  else if(a==="n-pin") startPick("next");
  else if(a==="n-from") nextFromSheet();
  else if(a==="pick-cancel") cancelPick();
  else if(a==="snap"){ if(skipClick) return; F.snap=SNAPS[(SNAPS.indexOf(F.snap)+1)%3]; applySnap(); mapSig=""; renderMap(); }
  else if(a==="ex-tab"){ F.exTab=b.dataset.k; F.trip=null; mapSig=""; render(); }
  else if(a==="trip-open"){ F.trip=id; $("#scroll").scrollTop=0; mapSig=""; render(); }
  else if(a==="trip-back"){ F.trip=null; mapSig=""; render(); }
  else if(a==="trip-use") useTrip(CM.find(c=>c.id===id));
  else if(a==="c-like"){ if(F.likes.has(id)) F.likes.delete(id); else F.likes.add(id); render(); }
  else if(a==="c-save"){ if(F.saved.has(id)) F.saved.delete(id); else { F.saved.add(id); toast(t("exSaved")); } try{ localStorage.setItem("dayoff.saved",JSON.stringify([...F.saved])); }catch(x){} render(); }
  else if(a==="c-share") shareLink(CM.find(c=>c.id===id));
  else if(a==="info") openInfo(id,true);
  else if(a==="info-tab"){ F.infoTab=b.dataset.tab; showInfo(); const n=$("#pit-"+F.infoTab); if(n) n.focus({preventScroll:true}); }
  else if(a==="info-x") closeInfo();
  else if(a==="info-nav") openNavSheet(id,"info");
  else if(a==="opennow"){ F.openNow=!F.openNow; render(); }
  else if(a==="chip"){ const g=b.dataset.tag; F.tags=F.tags.includes(g)?F.tags.filter(x=>x!==g):[...F.tags,g]; render(); }
  else if(a==="mic") listen(b.dataset.for);
  else if(a==="add"){ addPlace(id); render(); }
  else if(a==="why"){ const el=document.getElementById("more-"+id); if(F.more.has(id)) F.more.delete(id); else F.more.add(id); if(el) el.classList.toggle("open",F.more.has(id)); b.setAttribute("aria-expanded",String(F.more.has(id))); }
  else if(a==="star"){ if(F.musts.has(id)) F.musts.delete(id); else { F.musts.add(id); if(!state.tray.includes(id)) addPlace(id); } render(); }
  else if(a==="say-go"){ F.say=$("#say").value; fillSay(); }
  else if(a==="date"){ setDate(b.dataset.k); render(); }
  else if(a==="act-add"){ const k=b.dataset.a; F.acts=F.acts.includes(k)?F.acts.filter(x=>x!==k):[...F.acts,k]; render(); }
  else if(a==="act-rm"){ F.acts=F.acts.filter(x=>x!==b.dataset.a); render(); }
  else if(a==="act-mv"){ const i=F.acts.indexOf(b.dataset.a), j=i+ +b.dataset.d; if(j>=0&&j<F.acts.length){ [F.acts[i],F.acts[j]]=[F.acts[j],F.acts[i]]; render(); } }
  else if(a==="build"){ const sv=$("#say"); if(sv) F.say=sv.value; if(F.acts.length){ F.pk=true; F.picks={}; F.enter=true; mapSig=""; render(); } else { buildDay(); render(); } $("#scroll").scrollTop=0; }
  else if(a==="pk-set"){ F.picks[b.dataset.a]=id||null; render(); }
  else if(a==="pk-back"){ F.pk=false; F.enter=true; mapSig=""; render(); }
  else if(a==="pk-build"){ F.acts.forEach(x=>{ const pid=F.picks[x]; if(pid&&!state.tray.includes(pid)&&state.tray.length<MAX_STOPS) state.tray.push(pid); }); F.pk=false; buildDay(); mapSig=""; render(); $("#scroll").scrollTop=0; }
  else if(a==="stay-fb"){
    const d=b.dataset.k==="1"?-15:15, act=F.actOf[id], sn=snap();   // too long: shorter next time
    setStay(id,durOf(P[id])+d,"you");
    if(act){ STAYADJ[act]=(STAYADJ[act]||0)+d; try{ localStorage.setItem("dayoff.stayadj",JSON.stringify(STAYADJ)); }catch(x){} }
    render(); toast(act?t("fbAct",{n:stayFor(act),a:t("act_"+act)}):t("fbOne",{name:nm(P[id]),n:durOf(P[id])}),()=>restore(sn));
  }
  else if(a==="add-place"){ F.exTab="places"; go("explore"); }
  else if(a==="edit"){ F.built=false; F.enter=true; render(); }
  else if(a==="exp"){ F.exp=F.exp===id?null:id; render(); }
  else if(a==="stay"){ setStay(id,durOf(P[id])+ +b.dataset.d); render(); }
  else if(a==="pin-keep"){ if(state.pins[id]!=null) delete state.pins[id]; else { const i=planF().items.findIndex(x=>x.id===id); if(i>=0) state.pins[id]=i; } render(); }
  else if(a==="unpin"){ delete state.pins[id]; delete F.fixed[id]; render(); }
  else if(a==="rm"){ const nmx=nm(P[id]); withUndo(t("removed",{name:nmx}),()=>addPlace(id)); }
  else if(a==="fix") fixOne(id,b.dataset.k);
  else if(a==="fixall") fixIt();
  else if(a==="n-locate") locate(()=>{ F.next.pos=null; render(); });
  else if(a==="n-go") openNavSheet(F.next.id,"next");
  else if(a==="plan-nav") openNavSheet(id,"plan");
  else if(a==="nav-mode"){ F.navMode=b.dataset.m; fillNavSheet(); }
  else if(a==="nav-start") startNav();
  else if(a==="navStop") stopNav();
  else if(a==="navCenter"){ const nv=state.nav; if(nv){ nv.follow=true; DayMap.panTo(pointAt(nv,nv.at)); renderNav(); } }
  else if(a==="navArrive"){ const nv=state.nav, id=nv&&nv.id, ctx=nv&&nv.ctx; stopNav(); if(ctx==="next"&&F.next.id===id) nextArrive(); else if(id){ F.exp=id; toast(t("nvReached",{name:nm(P[id])})); render(); } }
  else if(a==="n-arrive") nextArrive();
  else if(a==="n-other"){ F.next.id=null; F.next.phase="suggest"; F.next.stage="options"; F.next.arrive=null; mapSig=""; render(); const sc=$("#scroll"); sc.scrollTop=sc.scrollHeight; }
  else if(a==="nx-pick") nextPick(id);
  else if(a==="nx-chip"){ const ch=NXCHIPS.find(x=>x[0]===b.dataset.k); nextSay(t(ch[1]),ch[2].hour?{acts:[],until:F.next.t+60}:{acts:ch[2].acts}); }
  else if(a==="n-done"){ const p=P[F.next.id]; F.nlog.push({who:"u",html:esc(t("cvDone",{name:nm(p)}))}); const st=F.next.arrive??F.next.t; state.visits.push({id:p.id,start:st,end:st+durOf(p)}); F.next.t=st+durOf(p); F.next.pos={lat:p.lat,lng:p.lng,name:nm(p)}; F.next.id=null; F.next.phase="suggest"; F.next.stage="ask"; F.next.q=""; F.next.acts=[]; F.next.arrive=null; toast(t("nMarkDone",{name:nm(p)})); render(); }
  else if(a==="n-skip"){ const p=P[F.next.id]; F.nlog.push({who:"u",html:esc(t("cvSkip",{name:nm(p)}))}); state.skipped.push(p.id); F.next.id=null; F.next.phase="suggest"; F.next.stage="ask"; F.next.q=""; F.next.acts=[]; F.next.arrive=null; toast(t("nSkipped",{name:nm(p)})); render(); }
  else if(a==="n-until-clear"){ F.next.until=null; render(); }
});
document.addEventListener("change",e=>{
  const c=e.target.dataset&&e.target.dataset.chg; if(!c) return; const v=e.target.value;
  if(c==="date"){ setDate("custom",v); render(); }
  else if(c==="start"){ const m=toMin(v); if(m==null) return; F.startMin=m; F.defs.start=false; if(F.defs.end) defaults(); if(F.endMin<=F.startMin+30){ F.endMin=Math.min(1380,F.startMin+240); F.defs.end=false; } render(); }
  else if(c==="end"){ const m=toMin(v); if(m==null) return; if(m<=F.startMin+30){ toast(t("endBad")); render(); return; } F.endMin=m; F.defs.end=false; render(); }
  else if(c==="fixtime"){ const m=toMin(v); if(m==null) return; F.fixed[e.target.dataset.id]=m; render(); }
  else if(c==="until"){ const m=toMin(v); if(m==null) return; F.next.until=m; F.next.id=null; render(); }
});
document.addEventListener("submit",e=>{ if(e.target.dataset.form==="nsay"){ e.preventDefault(); const v=$("#nq").value.trim(); if(v) nextSay(v); return; }
   if(e.target.dataset.form==="search"){ e.preventDefault(); F.q=$("#q").value; render(); } });
let qT=null;
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ F.q=e.target.value; clearTimeout(qT); qT=setTimeout(()=>{ const r=$("#results"); if(r){ r.innerHTML=resultsHTML(); mapSig=""; renderMap(); } },180); }
  else if(e.target.id==="say") F.say=e.target.value;
  else if(e.target.dataset&&e.target.dataset.pnote) F.pnotes[e.target.dataset.pnote]=e.target.value;
  else if(e.target.id==="fsearch") fromResults(e.target.value);
});
let dragId=null;
document.addEventListener("dragstart",e=>{ const l=e.target.closest&&e.target.closest("[data-act-id]"); if(!l) return; dragId=l.dataset.actId; l.classList.add("drag"); e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",dragId); }catch(x){} });
document.addEventListener("dragover",e=>{ if(dragId&&e.target.closest&&e.target.closest("[data-act-id]")) e.preventDefault(); });
document.addEventListener("drop",e=>{ const l=e.target.closest&&e.target.closest("[data-act-id]"); if(!l||!dragId) return; e.preventDefault(); const to=F.acts.indexOf(l.dataset.actId), from=F.acts.indexOf(dragId); if(from>=0&&to>=0&&from!==to){ F.acts.splice(to,0,F.acts.splice(from,1)[0]); } dragId=null; render(); });
document.addEventListener("dragend",()=>{ dragId=null; $$(".lstop.drag").forEach(x=>x.classList.remove("drag")); });
document.addEventListener("keydown",e=>{
  const sh=$("#sheetHost");
  if(e.key==="Escape"){ if(state.nav) stopNav(); else if(sh.firstChild) closeSheet(); else if(F.sel) closeInfo(); else if(F.pick) cancelPick(); else if(document.body.classList.contains("mapopen")) document.body.classList.remove("mapopen"); }
  if(e.key==="Tab"&&sh.firstChild){ const f=[...sh.querySelectorAll("button,input,[href]")].filter(x=>!x.disabled&&x.offsetParent!==null); if(!f.length) return; const i=f.indexOf(document.activeElement); if(e.shiftKey&&i<=0){ e.preventDefault(); f[f.length-1].focus(); } else if(!e.shiftKey&&i===f.length-1){ e.preventDefault(); f[0].focus(); } }
});

/* ---------- start ---------- */
initChrome("flow",kind=>{ if(kind==="theme") DayMap.refresh(); updateChrome(); render(); });
DayMap.init("#map",{onPin:id=>{ openInfo(id); if(F.screen==="explore"){ const el=document.querySelector(`.pc[data-id="${id}"]`); if(el){ el.scrollIntoView({block:"center",behavior:reducedMotion()?"auto":"smooth"}); const ab=el.querySelector(".pc-add"); if(ab) ab.focus(); } } else if(F.screen==="plan"&&F.built){ F.exp=id; render(); } else if(F.screen==="next"&&F.next.phase==="suggest"&&F.next.stage!=="ask") nextPick(id); }});
DayMap.onDrag(()=>{ if(state.nav&&state.nav.follow!==false){ state.nav.follow=false; renderNav(); } });
(function init(){
  const q=new URLSearchParams(location.search);
  const tray=(q.get("tray")||"").split(",").filter(x=>P[x]); if(tray.length) state.tray=tray.slice(0,MAX_STOPS);
  (q.get("must")||"").split(",").filter(x=>P[x]).forEach(id=>{ F.musts.add(id); if(!state.tray.includes(id)) state.tray.push(id); });
  defaults();
  const s=q.get("s"); if(VIEWS[s]) F.screen=s;
  if(q.get("built")==="1"&&state.tray.length) F.built=true;
  if(q.get("x")==="places"||q.get("x")==="trips") F.exTab=q.get("x");
  if(q.get("post")&&CM.some(c=>c.id===q.get("post")&&c.k==="trip")){ F.screen="explore"; F.trip=q.get("post"); }
  F.snap=defaultSnap();
  if(q.get("start")&&toMin(q.get("start"))!=null){ F.startMin=toMin(q.get("start")); F.defs.start=false; defaults(); }
  if(q.get("end")&&toMin(q.get("end"))!=null){ F.endMin=toMin(q.get("end")); F.defs.end=false; }
  render();
})();
</script>

:root{--bg:#FFFFFF;--surface:#F4F5F7}
body{min-height:100dvh}
.wrap{max-width:1120px;margin:0 auto;padding:var(--s6) var(--gutter) 96px;display:grid;gap:var(--s6)}
.hero h1{font-size:clamp(30px,6vw,48px);line-height:1.1;max-width:18ch}

h2.sec{font-size:clamp(22px,4vw,30px);line-height:1.2}
.grid{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mini{display:grid;gap:var(--s2);text-decoration:none;color:inherit}
.mini .ph{aspect-ratio:9/16;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.mini img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.mini b{font-weight:600}.mini span{font-size:12px;color:var(--ink-2);line-height:1.35}
.mini:hover .ph{border-color:var(--ink)}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);font-weight:600;min-width:170px}
thead th{font-weight:600;background:var(--surface);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
.dots{display:inline-flex;gap:3px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--track)}.dots i.on{background:var(--ink)}
.dots[data-v="5"] i.on,.dots[data-v="4"] i.on{background:var(--accent)}
.vcard{display:grid;gap:var(--s5);grid-template-columns:minmax(0,1fr);padding:var(--s5);border:1px solid var(--line);border-radius:24px;background:var(--card)}
@media (min-width:860px){.vcard{grid-template-columns:260px minmax(0,1fr);align-items:start}}
.phone{width:min(260px,70%);aspect-ratio:9/19.5;border:8px solid var(--ink);border-radius:34px;overflow:hidden;background:var(--surface);margin:0 auto;position:sticky;top:76px}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.vh{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3)}
.vh .n{width:36px;height:36px;border-radius:10px;background:var(--pill);color:var(--on-pill);display:grid;place-items:center;font:500 16px var(--f-head)}
.vh h2{font-size:26px}
.stat{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--surface)}
.cols{display:grid;gap:var(--s5);grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.cols{grid-template-columns:1fr 1fr}}
.box h3{font-size:14px;margin-bottom:var(--s2)}
.box ul,.box ol{display:grid;gap:6px;font-size:14px}
.box ul li{padding-left:18px;position:relative}.box ul li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.box.pro li::before{background:var(--ink)}.box.con li::before{background:transparent;border:2px solid var(--warn)}
.box ol{counter-reset:s;}.box ol li{counter-increment:s;padding-left:30px;position:relative}.box ol li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:600}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:var(--s2) 0}
.flow span{padding:6px 12px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600}
.flow i{color:var(--ink-2);font-style:normal}
.steal{padding:var(--s3) var(--s4);border-radius:14px;background:var(--gold-soft);font-size:14px}
.acts{display:flex;gap:var(--s2);flex-wrap:wrap}
.btn{text-decoration:none}
.syn li{padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:14px;display:grid;gap:2px;background:var(--card)}
.syn{display:grid;gap:var(--s2);counter-reset:q}
.syn li{counter-increment:q}.syn b::before{content:counter(q) ". "}
.syn small{color:var(--ink-2);font-size:13px}
.note{padding:var(--s4);border:1px dashed var(--track);border-radius:14px;font-size:14px;color:var(--ink-2)}
.src a{text-underline-offset:3px}.src li{margin:4px 0}
.lede{color:var(--ink-2);max-width:70ch}
</style>
